[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nomergon-worker"
version = "0.1.0"
description = "Nomergon: the one process that holds model credentials and loads models; fed by the ops.jobs table (ADR 0004)."
readme = "README.md"
license = {text = "EUPL-1.2"}
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "typer>=0.12",
  # The three packages whose CLIs the worker runs as subprocesses, installed
  # into this one environment so every job runs from `sys.executable -m …`.
  # translate: the LLM translator; legifrance: the Playwright tier-3 fallback
  # of the Legifrance resolver (ADR 0002). torch comes from the gpu or cpu
  # extra below.
  "nomotheca-legislation-ingest[translate,legifrance]",
  "nomoscope-agentic-workflow",
  "nomokrisis-evaluation",
]

# The torch build, one of two extras that cannot share an environment: `gpu`
# takes torch from the cu126 index with ~4 GB of nvidia-* wheels; `cpu` the
# CPU-only wheel, for a box without an NVIDIA GPU (`uv sync --extra cpu`, the
# worker-cpu image). Both spell out the embeddings extra of
# Nomotheca-RAG/ingest: going through `nomotheca-legislation-ingest[embeddings]`
# would bring that package's own extra-scoped torch sources, a conflict uv
# cannot resolve from here.
[project.optional-dependencies]
gpu = ["sentence-transformers[openvino]>=3.0", "torch>=2.13.0"]
cpu = ["sentence-transformers[openvino]>=3.0", "torch>=2.13.0"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
nomergon = "nomergon.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nomergon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# gpu: torch from the CUDA 12.6 wheel index (the indexes and the extras'
# conflicts are declared once, in the workspace root's pyproject.toml). The
# cu126 wheels run on a CPU-only box too, but their nvidia-* libraries make the
# image ~4 GB larger, hence the cpu extra.
[tool.uv.sources]
torch = [
  { index = "pytorch_cu126", extra = "gpu" },
  { index = "pytorch_cpu", extra = "cpu" },
]
nomotheca-legislation-ingest = { workspace = true }
nomoscope-agentic-workflow = { workspace = true }
nomokrisis-evaluation = { workspace = true }
