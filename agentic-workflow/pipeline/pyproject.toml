[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "euromod-agentic-workflow"
version = "0.1.0"
description = "Agentic parameter-update pipeline for EUROMOD: retrieval -> proposal -> critique -> diff -> human review queue."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langchain>=0.3.27",
  "langchain-anthropic>=0.3",
  "langchain-openai>=0.3",
  "langgraph>=0.6.5",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "tenacity>=8.5",
  "typer>=0.12",
  "arize-phoenix-otel>=0.9",
  "openinference-instrumentation-langchain>=0.1.29",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
euromod-workflow = "euromod_workflow.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/euromod_workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
