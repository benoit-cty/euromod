# Curated parameter knowledge for IE — NOT part of the EUROMOD export.
#
# extracted_parameters/enriched/IE.enriched.json is delivered by the EUROMOD
# team and is READ-ONLY: never edit it. Anything we know that the export does
# not carry — or gets wrong — lives here instead, and is applied on top of the
# ingested rows by
#
#     uv run nomoscope-workflow curate-params curation/IE.curation.yaml
#
# run after `ingest-params` (ingesting a country file replaces its rows, so the
# overlay has to follow it). This file exists so the knowledge also survives
# `docker compose down -v`, is reviewable in git, and can say *why* each
# parameter is flagged.

country: IE

source_type:
  - type: national_team
    note: >-
      The 268 constants of tco_ie (`$tco_<letter>_<coicop>`) are implicit
      consumption-tax rates per COICOP category, derived by the national team
      from Household Budget Survey statistics — there is no legislative source
      for any of them (VAT and excise legislation states rates per good, not
      per survey category), so a run over one of them can only ever end
      `not_found`. Routing them `national_team_source` mirrors LT's xcc_lt
      precedent: the pipeline stops hunting the corpus for a number that is
      not in it and the values are protected from being overwritten. The
      golden case ie_tco_t_01131 pins the behaviour; the list below is every
      tco_ie constant in params.parameters on 2026-09-08 (generated, ordered by
      spine_order).
    targets:
      - euromod://IE/tco_ie/def_const/$tco_a_02111
