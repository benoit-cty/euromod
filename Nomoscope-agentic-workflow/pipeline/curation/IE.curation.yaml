      - euromod://IE/tscer_ie/def_const/$tscer_prsiA_rate2  # 0.1075,0.1085,0.1105,0.1115 — Employer PRSI Class A- Rate 2
      - euromod://IE/tscer_ie/def_const/$tscer_prsiB_rate  # 2.01% — Employer PRSI Class B- Rate
      - euromod://IE/tscer_ie/def_const/$tscer_prsiJ9_rate  # 0.005,n/a
