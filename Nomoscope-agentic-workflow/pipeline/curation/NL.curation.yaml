# Curated parameter knowledge for NL — NOT part of the EUROMOD export.
#
# extracted_parameters/enriched/NL.enriched.json is delivered by the EUROMOD
# team and is READ-ONLY: never edit it. Anything we know that the export does
# not carry — or gets wrong — lives here instead, and is applied on top of the
# ingested rows by
#
#     uv run nomoscope-workflow curate-params curation/NL.curation.yaml
#
# run after `ingest-params` (ingesting a country file replaces its model_values
# rows, so the overlay has to follow it). This file exists so the knowledge also
# survives `docker compose down -v`, is reviewable in git, and can say *why*
# each parameter is flagged.
#
# temporal_basis: deliberately no section. Every NL parameter is `in_force`:
# Dutch income tax is assessed on the calendar year (Wet IB 2001 art. 2.3 /
# art. 3.1: the belastbaar inkomen of a kalenderjaar), and the annual
# Belastingplan and the December bijstellingsregeling rewrite the amounts in
# the acts with effect from 1 January of the system year. EUROMOD system year Y
# states the law of year Y — no FR-style income-year offset. Do not add one to
# compensate for BWB's bitemporal `zicht` axis or for the 1 July semi-annual
# indexation of the WML, AKW, Participatiewet and AOW amounts: those are
# valid_from / mid-year questions, not basis questions.
#
# Tax-rate basis, decided here (Netherlands_sources_analysis.md §6.3): the
# export's first-band rate `$tin_br1` holds the TAX component only (8.17 % in
# 2025, exactly Wet IB 2001 art. 2.10) and the premies volksverzekeringen are
# modelled separately in peoplesic_nl (`$peoplesic_aow_rate` 17.9 % …). No NL
# parameter holds the Country Report's combined 35.82 %, so no combined-rate
# constant needs a national_team flag. A proposal of 35.82 % for `$tin_br1`
# is a wrong value with a plausible source (the CR, or the Belastingdienst
# tables) — the golden case tin_br1 pins it.
#
# Not flagged, on purpose, and left for the economists to decide:
#   - `$ersic_disab_r` / `$ersic_unemp_r` (average Aof / Awf employer
#     premiums): averages over the legislated laag/hoog rates fixed in the
#     annual Regeling (not ingested). The inputs are legislated, the average
#     is modelling — the same shape as LT's `$tin_MaxLimit_coef*`.
#   - `$tschl_prem_av` (average nominal Zvw premium): a VWS estimate, not a
#     legislated amount; the legislated proxy is the standaardpremie of Wet op
#     de zorgtoeslag art. 4, fixed by ministerial regeling and a different
#     quantity (premium plus average eigen risico).
#   - `$tco_t_std` / `$tco_t_red1` / `$tco_t_zero`: the statutory VAT rates
#     (Wet OB 1968 art. 9, not ingested) — legislated, so not flagged; only
#     the per-COICOP implicit rates below are.

country: NL

source_type:
  - type: national_team
    note: >-
      The standard weekly cost of formal childcare is not set by any act. The
      Wet kinderopvang (BWBR0017017, ingested) and its Besluit fix the
      maximum HOURLY price the kinderopvangtoeslag reimburses and the income
      table of the toeslag, never a household's actual cost: EUROMOD's
      EUR 400/week is the national team's assumption over observed daycare
      fees, documented in the Country Report's childcare theme, and changes
      when the team revises that assumption, not when a law changes. Routing
      it `national_team_source` stops the pipeline from reporting it as
      `not_found` every run and protects it from being overwritten by the
      toeslag's maximum hourly price (a plausible-looking wrong value that IS
      in the corpus' orbit). Confirmed against the corpus: no NL chunk states
      a weekly childcare cost. The income breakpoints of the same policy
      (`$bccfc_child2_thres*`) come from the toeslag's Besluit and are NOT
      flagged.
    targets:
      - euromod://NL/xcc_nl/def_const/$xcc_amt

  - type: national_team
    note: >-
      The $tco_t_* constants are implicit consumption-tax rates per COICOP
      category, derived by the national team from Household Budget Survey
      statistics and the VAT/excise structure — the class IE's tco_ie and
      ES's tco_es families belong to (every one holds `n/a` in the export).
      No act states an implicit rate; the legislated inputs are the statutory
      VAT rates (`$tco_t_std` / `$tco_t_red1` / `$tco_t_zero`, Wet OB 1968
      art. 9) and the excise amounts (`$tco_a_*`, `$tco_b_*`, `$tco_v_*`,
      Wet op de accijns), none of which is flagged here — their acts are
      simply not ingested yet.
    targets:
