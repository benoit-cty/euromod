unit:
  - unit: "/1"
    note: >-
      Every NL parameter listed here is delivered with unit `/100` although
      the export stores its value as a percent literal ('37.48%', '7.10%') —
      the same spelling the sibling parameters delivered as `/1` use
      (`$tin_br1` '8.17%' sits in the same tin_nl schedule as `$tin_br2`
      '37.48%' `/100`). nomokrisis_eval.scoring.normalise_value reads a percent
      literal as the fraction it denotes (0.3748), i.e. with `/1` semantics,
      and the proposal prompt's percent normalisation ("11 % -> 0.11") and the
      critique's range check (rates in [0,1]) both key on the unit being `/1`.
      Left as `/100`, a proposal of 37.48 for `$tin_br2` is both what the
      prompt invites and a value-leg miss against the '37.48%' the store
      holds. Membership is by value: every value of every year is a `N%`
      literal, or n/a. Reported to the economists team on 2026-09-08 as an
      export inconsistency (23 rate parameters `/100`, 17 sibling rates `/1`,
      identical spelling) and corrected here until a fixed export lands.
    targets:
      - euromod://NL/bho_nl/def_const/$bho_perc_red1  # n/a,27% — $bho_perc_red1
      - euromod://NL/bho_nl/def_const/$bho_perc_red2  # n/a,22% — $bho_perc_red2
      - euromod://NL/chall_nl/def_const/$chall_D  # n/a,6.75%,7.10%,7.6% — D
      - euromod://NL/peoplesic_nl/def_const/$peoplesic_aow_rate  # 17.9% — State pension contribution rate (CR Table 2.23)
