    note: >-
      The kinderbijslag age-band multipliers are dimensionless ratios above 1
      (`$bfa_mult2` 1.2143 = 347,83 / 286,45, `$bfa_mult3` 1.4286 = 409,21 /
      286,45) delivered as `/1`; the critique's "/1" range check (rates in
      [0,1]) rejected the correct 1.2143 on 2026-09-08. `ratio` carries no range
      check and tells the proposer the quantity is a multiplier, not a rate.
