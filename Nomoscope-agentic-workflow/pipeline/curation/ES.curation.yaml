unit:
  - unit: "/1"
    note: >-
      $bsa00_BCA_rate is delivered with unit `months`, an enrichment slip: it is
      a calibration *rate* (value 1, combined by a minimum operation with
      $bsa00_BTA_rate), not a duration. The unit is a hint on every LLM call —
      the proposal prompt normalises percentages against it and the critique
      range-checks with it — so `months` would invite a proposal in months for
      a dimensionless quantity. Otherwise the ES export's units are sound:
      unlike FR, IE and LT it already ships every rate-like constant as `/1`
      (checked 2026-09-08 — the only ES parameter matching *rate|share|coef*
      and delivered as currency is $uprate_bands_2013_lim, which really is
      1000 EUR/month). Left out on purpose: $ImputedWage, a 0/1 switch
      delivered as `currency/month`. It is not a fraction either, and no unit
      in the export's vocabulary fits a boolean — a separate item for the
      economists, like the LT multipliers and durations.
    targets:
      - euromod://ES/ConstDef_es/def_const/$bsa00_BCA_rate
