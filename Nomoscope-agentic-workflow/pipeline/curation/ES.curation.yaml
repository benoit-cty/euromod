# Curated parameter knowledge for ES — NOT part of the EUROMOD export.
#
# extracted_parameters/enriched/ES.enriched.json is delivered by the EUROMOD
# team and is READ-ONLY: never edit it. Anything we know that the export does
# not carry lives here instead, and is applied on top of the ingested rows by
#
#     uv run nomoscope-workflow curate-params curation/ES.curation.yaml
#
# run after `ingest-params` (ingesting a country file replaces its model_values
# rows, so the overlay has to follow it). This file exists so the knowledge also
# survives `docker compose down -v`, is reviewable in git, and can say *why*
# each parameter is flagged.
#
# temporal_basis: deliberately no section. Every ES parameter is `in_force`:
# the IRPF período impositivo is the calendar year (LIRPF art. 12), so EUROMOD
# system year Y states the law of year Y — no FR-style income-year offset.
# Do not add one to compensate for BOE's `fecha_vigencia` (the legal
# entry-into-force date, e.g. 2024-12-22 for a measure "con efectos desde el
# 1 de enero de 2025"): that is a valid_from question, not a basis question.

country: ES

source_type:
  - type: national_team
    note: >-
      $SMI2 is not the minimum wage the law sets. RD 87/2025 art. 1 fixes the
      2025 SMI at 1184 euros/month, but the model deliberately freezes this
      constant at its 2018 level (735.90) because it indexes regional
      minimum-income rules (Aragón's benefit ceiling, the Basque lone-parent
      complement) that reference "the minimum wage" without following its
      later increases — a national-team modelling choice documented in the
      parameter's own description. Left unflagged, every run would "correct"
      it to 1184 and propose overwriting a value that is right on purpose.
    targets:
      - euromod://ES/ConstDef_es/def_const/$SMI2

  - type: national_team
    note: >-
      Childcare costs in Spain are not set by national legislation. The
      school dining fee (comedor) and the means-tested "becas comedor"
      discounts on it are fixed by each autonomous community's (and often
      each municipality's) own annual call, so there is no national act for
      the pipeline to cite. The EUROMOD values are the national team's
      assumption over those regional schedules, documented in the Country
      Report's childcare theme. Confirmed against the corpus: `comedor`
      appears only in LIRPF art. 42 (in-kind income), never in a fee schedule.
    targets:
      - euromod://ES/xcc_es/def_const/$xcc_amt
      - euromod://ES/xcc_es/def_const/$xccdc_amt1
      - euromod://ES/xcc_es/def_const/$xccdc_amt2
      - euromod://ES/xcc_es/def_const/$xccdc_amt3
      - euromod://ES/xcc_es/def_const/$xccdc_lim1
      - euromod://ES/xcc_es/def_const/$xccdc_lim2
      - euromod://ES/xcc_es/def_const/$xccdc_lim3

  - type: national_team
    note: >-
      The $tco_t_* constants are implicit consumption-tax rates per COICOP
      category, derived by the national team from Household Budget Survey
      statistics and the VAT/excise structure — the same class IE's tco_ie
      family belongs to. No act states an implicit rate; the legislated
      inputs (Ley 37/1992 VAT rates, Ley 38/1992 excise amounts) are the
      $tco_v_* and $tco_a_* constants, which are NOT flagged here.
    targets:
      - euromod://ES/tco_es/def_const/$tco_t_01111
