      - euromod://FR/sickcomp_fr/def_const/$bhl_std_rate2a
      - euromod://FR/sickcomp_fr/def_const/$bhl_std_rate2b
      - euromod://FR/sickcomp_fr/def_const/$bhl_std_rate5
      # tin_fr: CEHR rates (CGI art. 223 sexies)
      - euromod://FR/tin_fr/def_const/$tinto_rate1
      - euromod://FR/tin_fr/def_const/$tinto_rate2
      # tinkt_fr: Barème IR marginal rates, décote rate, PL rate (CGI art. 197, 200 A)
