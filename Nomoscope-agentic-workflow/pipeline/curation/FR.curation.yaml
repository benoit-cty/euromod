# Curated parameter knowledge for FR — NOT part of the EUROMOD export.
#
# extracted_parameters/enriched/FR.enriched.json is delivered by the EUROMOD
# team and is READ-ONLY: never edit it. Anything we know that the export does
# not carry lives here instead, and is applied on top of the ingested rows by
#
#     uv run nomoscope-workflow curate-params curation/FR.curation.yaml
#
# run after `ingest-params`. The ingest upsert deliberately never touches these
# columns, so a re-ingest of a new export preserves them; this file exists so
# the knowledge also survives `docker compose down -v`, is reviewable in git,
# and can say *why* each parameter is flagged.

country: FR

temporal_basis:
  - basis: income_year
    note: >-
      French income tax is assessed in year Y on the income of year Y-1
      («impôt 2025 sur les revenus 2024»), and its schedule is enacted by the
      finance act voted at the end of the income year (the barème for income
      2024 sits in LOI 2025-127 du 14 février 2025). So an `income_year`
      parameter under EUROMOD system year Y states the value for income year
      Y-1, and retrieval, the expected `valid_from` and the critique's
      budget-act window all shift with it — the mapping itself lives in
      `schema.income_year_for`, not here. Deliberately NOT set on CSG/CRDS,
      which are withheld at source and follow `in_force`.
    targets:
      # Barème: marginal rates and band boundaries (CGI art. 197, I-1)
      - euromod://FR/tinkt_fr/def_const/$tin_rate1
      - euromod://FR/tinkt_fr/def_const/$tin_rate2
      - euromod://FR/tinkt_fr/def_const/$tin_rate3
      - euromod://FR/tinkt_fr/def_const/$tin_rate4
      - euromod://FR/tinkt_fr/def_const/$tin_rate5
      - euromod://FR/tinkt_fr/def_const/$tin_rate6
      - euromod://FR/tinkt_fr/def_const/$tin_upthres1
      - euromod://FR/tinkt_fr/def_const/$tin_upthres2
      - euromod://FR/tinkt_fr/def_const/$tin_upthres3
      - euromod://FR/tinkt_fr/def_const/$tin_upthres4
      - euromod://FR/tinkt_fr/def_const/$tin_upthres5
      # Décote (CGI art. 197, I-4)
      - euromod://FR/tinkt_fr/def_const/$tin_decote_amt
      - euromod://FR/tinkt_fr/def_const/$tin_decote_amt2
      - euromod://FR/tinkt_fr/def_const/$tin_decote_lim1
      - euromod://FR/tinkt_fr/def_const/$tin_decote_lim2
      - euromod://FR/tinkt_fr/def_const/$tin_decote_rate
      # CDHR (CGI art. 224): instituted by LF 2025 FOR 2025 income. Defined
      # inside tinto01_fr rather than as a def_const, so it reaches the DB from
      # extracted_parameters/curated/FR.in_function.json, not from the export.
      - euromod://FR/tin_fr/def_const/$tinrt_cdhr
      # Plafonnement du quotient familial
      - euromod://FR/tin_fr/def_const/$tinto_lim1
      - euromod://FR/tin_fr/def_const/$tinto_lim2
      - euromod://FR/tin_fr/def_const/$tinto_lim3
      - euromod://FR/tin_fr/def_const/$tinto_rate1
      - euromod://FR/tin_fr/def_const/$tinto_rate2

  - basis: income_year
    note: >-
      Same finance-act indexation article as the barème above, so the same
      dating applies — these were missed when the family was first flagged.
      Evidence is empirical, not just doctrinal: for each target and for every
      system year 2022-2025, the EUROMOD value equals the OpenFisca value keyed
      (system year - 1)-01-01 exactly, e.g. $tinty_ded_maxamt 2022..2025 =
      12 829 / 13 522 / 14 171 / 14 426 = OpenFisca income years 2021..2024.
      Left as `in_force`, retrieval would look for what is in force at the
      as_of date, find the previous finance act, and confirm the lagged value
      as `unchanged`. The $tscxc_* and $tsc_group* constants in the same
      policies are NOT here: they track the in-force value, as the same test
      shows.
    targets:
      # Plafonds du QF pour situations particulières (CGI art. 197, I-2)
      - euromod://FR/tinkt_fr/def_const/$tin_imaxdep_lim1
      - euromod://FR/tinkt_fr/def_const/$tin_imaxdep_lim2
      - euromod://FR/tinkt_fr/def_const/$tin_imaxdis_amt
      - euromod://FR/tinkt_fr/def_const/$tin_imaxwd_amt
      # Abattement 10 % frais professionnels (CGI art. 83, 3°)
      - euromod://FR/tinty_fr/def_const/$tinty_ded_maxamt
      - euromod://FR/tinty_fr/def_const/$tinty_ded_minamt
      # Same ceiling applied to unemployment benefits — no numeric history to
      # test against (EUROMOD holds a formula), flagged by legal provision.
      - euromod://FR/tinty_fr/def_const/$tinty_dedub_uplim
      # Abattement 10 % pensions (CGI art. 158, 5 a)
      - euromod://FR/tinty_fr/def_const/$tinty_dedpens_maxamt
      - euromod://FR/tinty_fr/def_const/$tinty_dedpens_minamt
      # Abattement personnes âgées / invalides (CGI art. 157 bis)
      - euromod://FR/tinty_fr/def_const/$tintadp_amt

  - basis: start_of_year
    note: >-
      EUROMOD holds the value in force on 1 January of the system year for
      these, where the benchmark's reference date is 1 July: a change during
      the year first appears in the next system year. Evidence is EUROMOD's own
      history against the law. `$tpr_threshold*` (CGI art. 1417, revised by
      the finance act each June): 2024..2026 hold 6 530 / 6 843 / 6 966 for
      threshold 4, the version in force on each 1 January, where 1 July 2025
      already had 6 966. `$UB_dayfixamt` (ARE fixed part, revised each 1 July
      by the Unédic board): 2024..2026 hold 12.95 / 13.11 / 13.18.
      `$tscerui_rate1` (employer unemployment contribution): 4,05 % from
      1 October 2017 is held from 2018, 4 % from 1 May 2025 from 2026 — 1 July
      of the year before would give 4 % for 2018. `$bsawk_income_rate` (CSS
      D. 843-3): 61 % from 5 October 2018 is held from 2019, and 2025 holds
      61 % where 59,85 % applies from 31 March 2025.
    targets:
      - euromod://FR/tpr_fr/def_const/$tpr_threshold1
      - euromod://FR/tpr_fr/def_const/$tpr_threshold2
      - euromod://FR/tpr_fr/def_const/$tpr_threshold3
      - euromod://FR/tpr_fr/def_const/$tpr_threshold4
      - euromod://FR/tpr_fr/def_const/$tpr_threshold5
      - euromod://FR/ConstDef_fr/def_const/$UB_dayfixamt
      - euromod://FR/tscer_fr/def_const/$tscerui_rate1
      - euromod://FR/bsawk_fr/def_const/$bsawk_income_rate

source_type:
  - type: national_team
    note: >-
      Values that are modelling choices or statistics, not legal figures, so
      they route around the pipeline (`national_team_source`). The two
      unemployment-benefit bounds of the 10 % deduction, `$tinty_dedub_uplim`
      and `$tinty_dedbun_lowlim`, held the legal amounts until 2018 (12 308 /
      947) and 0 since 2019: the model stopped applying a cap and a floor
      specific to unemployment benefits (the export's description says so),
      while CGI art. 83 still states 14 426 € for 2024 income. The income_year
      flag above stays for the day they are switched back on. The property-tax
      rates `$tpr_rate_baties` (0.3062 since 2019) and `$tpr_rate_nonbaties`
      (0) are national averages of rates the communes vote, which no act states.
    targets:
      - euromod://FR/tinty_fr/def_const/$tinty_dedub_uplim
      - euromod://FR/tinty_fr/def_const/$tinty_dedbun_lowlim
      - euromod://FR/tpr_fr/def_const/$tpr_rate_baties
      - euromod://FR/tpr_fr/def_const/$tpr_rate_nonbaties

unit:
  - unit: "/1"
    note: >-
      Residual FR rate units the EUROMOD export still gets wrong or leaves
      empty. The export of 2026-09 fixed the original slip (146 `*rate*`
      parameters delivered as `currency`): 132 now carry "/1" themselves and
      their entries were dropped from this list, 5 (`$bsawk_*_rate`,
      `$tintcmi_rate1-3`) no longer exist in the export. What is left:
      `$mc_yem_rrate` has no unit (values 0.7, 0.6), and the `xcc_fr` /
      `tpr_fr` rates are exported as "/100" although their sibling rates are
      fractions; their export values are null/0, so the "/100" cannot be
      confirmed either way, and "/1" stays until the economists team says so.
      `$bho_Tf_rate8` stays out on purpose: a negative per-dependent decrement
      that the "/1" range check would reject.
    targets:
      - euromod://FR/ConstDef_fr/def_const/$mc_yem_rrate
      - euromod://FR/tpr_fr/def_const/$tpr_rate_nonbaties
      - euromod://FR/xcc_fr/def_const/$tintcch_rate
      - euromod://FR/xcc_fr/def_const/$xcc_rate1
      - euromod://FR/xcc_fr/def_const/$xcc_rate2
      - euromod://FR/xcc_fr/def_const/$xcc_rate3
      - euromod://FR/xcc_fr/def_const/$xcc_rate4
      - euromod://FR/xcc_fr/def_const/$xcc_rate5
  - unit: "currency/hour"
    note: >-
      `$Minwage_hourly` is the hourly SMIC (11.88 for 2025 — the décret states
      "11,88 euros par heure") but the export labels it `currency/month`. Under
      that unit a correct proposal cannot be made: the 2026-09-08 Luna run found
      the arrêté, read the hourly amount and refused to present it as monthly.
      Curated to `currency/hour` (a unit the export does not use; accepted by
      KNOWN_UNITS for this purpose) and reported to the economists team with
      the other export defects.
    targets:
      - euromod://FR/SetDefault_fr/def_const/$Minwage_hourly
  - unit: "/100"
    note: >-
      Housing-benefit participation rates by RL band, held in percentage
      points: EUROMOD's 0.45 / 0.68 are the «0,45 %» / «0,68 %» of the arrêté
      du 27 septembre 2019 art. 14, where the "/1" unit made the proposer write
      0.0045 and score a miss on a correct reading.
    targets:
      - euromod://FR/bhotn_fr/def_const/$bho_rl_rate1
      - euromod://FR/bhotn_fr/def_const/$bho_rl_rate2
      - euromod://FR/bhotn_fr/def_const/$bho_rl_rate3
