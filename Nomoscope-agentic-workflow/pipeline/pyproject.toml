[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nomoscope-agentic-workflow"
version = "0.1.0"
description = "Agentic parameter-update pipeline for EUROMOD: retrieval -> proposal -> critique -> diff -> human review queue."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic-ai-slim[anthropic,openai]>=1.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "tenacity>=8.5",
  "typer>=0.12",
  "arize-phoenix-otel>=0.9",
  "openinference-instrumentation-pydantic-ai>=0.1.17",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
nomoscope-workflow = "nomoscope_workflow.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nomoscope_workflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
