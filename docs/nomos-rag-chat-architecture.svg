<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif">
  <title>Nómos RAG chat — architecture</title>
  <!-- European Commission style (square corners, flat, #004494 + yellow rule).
       Colour carries meaning: blue = law & data, purple = GPU, amber = LLM,
       green = what the analyst sees, cyan = asynchronous jobs, red = observability.
       Source: Nomoscope-agentic-workflow/rag-ui/README.md, pipeline/src/nomoscope_workflow/chat.py -->
  <defs>
    <style>
      .title { font-size: 32px; font-weight: 400; fill: #fff; }
      .sub   { font-size: 17px; fill: rgb(214,226,240); }
      .h     { font-size: 22px; font-weight: 700; fill: #000; }
      .h2    { font-size: 17px; font-weight: 700; fill: #000; }
      .tag   { font-size: 12px; font-weight: 600; fill: rgb(90,96,102); letter-spacing: .05em; }
      .t     { font-size: 15px; fill: #1a1a1a; }
      .s     { font-size: 13.5px; fill: rgb(90,96,102); }
      .lbl   { font-size: 13px; fill: rgb(90,96,102); }
      .cc    { font-size: 12px; font-weight: 700; fill: #fff; }
      .mono  { font-family: 'Fira Mono', Consolas, 'Courier New', monospace; font-size: 14px; font-weight: 700; }
      .w     { fill: #fff; }
    </style>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgb(0,68,148)"/></marker>
    <marker id="aCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgb(21,156,228)"/></marker>
    <marker id="aAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgb(176,90,0)"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="rgb(198,40,40)"/></marker>
  </defs>

  <rect width="1600" height="900" fill="#fff"/>
  <rect width="1600" height="96" fill="rgb(0,68,148)"/>
  <rect y="96" width="1600" height="5" fill="rgb(255,214,23)"/>
  <text x="40" y="52" class="title">Nómos RAG chat — ask the law, get verified quotes</text>
  <text x="40" y="80" class="sub">Each question becomes a job · an agent searches the legislation · every quote is checked against the law</text>

  <!-- ===== Top: web search, LLM endpoints, phoenix (outside the worker) ===== -->
  <rect x="40" y="116" width="320" height="62" fill="#fff" stroke="rgb(0,68,148)" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="142" class="h2">Web search (Tavily)</text>
  <text x="60" y="164" class="s">official portals only · leads, not proof</text>

  <rect x="400" y="116" width="440" height="62" fill="rgb(255,240,220)" stroke="rgb(176,90,0)" stroke-width="1.5"/>
  <text x="420" y="142" class="h2">LLM endpoints — any provider</text>
  <text x="420" y="164" class="s">Azure OpenAI · JRC gateway · OpenRouter · Anthropic</text>

  <path d="M880,122 v52 a130,10 0 0 0 260,0 v-52" fill="rgb(253,230,228)" stroke="rgb(198,40,40)" stroke-width="1.5"/>
  <ellipse cx="1010" cy="122" rx="130" ry="10" fill="#fff" stroke="rgb(198,40,40)" stroke-width="1.5"/>
  <text x="1010" y="153" text-anchor="middle" font-size="19" font-weight="700" fill="rgb(198,40,40)">Traceability</text>
  <text x="1010" y="173" text-anchor="middle" font-size="13" fill="rgb(90,96,102)">every LLM call traced</text>

  <!-- ===== The law ===== -->
  <rect x="40" y="210" width="210" height="310" fill="rgb(234,243,255)" stroke="rgb(0,68,148)" stroke-width="1.5"/>
  <text x="60" y="248" class="h">The law</text>
  <g>
    <rect x="60" y="270" width="34" height="22" fill="rgb(0,68,148)"/><text x="77" y="286" text-anchor="middle" class="cc">FR</text>
    <rect x="60" y="302" width="34" height="22" fill="rgb(0,68,148)"/><text x="77" y="318" text-anchor="middle" class="cc">NL</text>
    <rect x="60" y="334" width="34" height="22" fill="rgb(0,68,148)"/><text x="77" y="350" text-anchor="middle" class="cc">LT</text>
    <rect x="60" y="366" width="34" height="22" fill="rgb(0,68,148)"/><text x="77" y="382" text-anchor="middle" class="cc">ES</text>
    <rect x="60" y="398" width="34" height="22" fill="rgb(0,68,148)"/><text x="77" y="414" text-anchor="middle" class="cc">IE</text>
    <text x="106" y="286" class="t">Légifrance</text>
    <text x="106" y="318" class="t">wetten.nl</text>
    <text x="106" y="350" class="t">e-TAR</text>
    <text x="106" y="382" class="t">BOE</text>
    <text x="106" y="414" class="t">Statute Book</text>
  </g>
  <text x="60" y="458" class="s">official portals</text>
  <text x="60" y="478" class="s">+ published guidance</text>
  <text x="60" y="504" class="s">in 5 languages</text>

  <!-- ===== Nomergon: the worker frame ===== -->
  <rect x="290" y="210" width="850" height="310" fill="rgb(242,247,252)" stroke="rgb(0,68,148)" stroke-width="2.5"/>
  <rect x="290" y="210" width="850" height="38" fill="rgb(0,68,148)"/>
  <text x="308" y="236" font-size="19" font-weight="700" class="w">Nomergon · the worker</text>
  <text x="1124" y="236" text-anchor="end" font-size="13.5" class="w">runs every job in the background · the only one with the GPU, model keys, internet</text>

  <!-- Nomotheca -->
  <rect x="305" y="262" width="270" height="245" fill="#fff" stroke="rgb(0,68,148)" stroke-width="1.5"/>
  <text x="321" y="290" class="h" fill="rgb(0,68,148)">Nomotheca</text>
  <text x="321" y="308" class="tag">BUILDS THE LIBRARY</text>
  <rect x="318" y="320" width="244" height="54" fill="rgb(234,243,255)" stroke="rgb(0,68,148)"/>
  <text x="332" y="343" class="h2">Ingest</text>
  <text x="332" y="363" class="s">fetch · parse · chunk</text>
  <rect x="318" y="382" width="244" height="54" fill="rgb(240,234,252)" stroke="rgb(90,47,168)"/>
  <text x="332" y="405" class="h2">Embed</text>
  <rect x="504" y="390" width="46" height="20" fill="rgb(90,47,168)"/><text x="527" y="404" text-anchor="middle" class="cc">GPU</text>
  <text x="332" y="425" class="s">the law and each question</text>
  <rect x="318" y="444" width="244" height="54" fill="rgb(255,240,220)" stroke="rgb(176,90,0)"/>
  <text x="332" y="467" class="h2">Translate</text>
  <rect x="504" y="452" width="46" height="20" fill="rgb(176,90,0)"/><text x="527" y="466" text-anchor="middle" class="cc">LLM</text>
  <text x="332" y="487" class="s">small model, into English</text>

  <!-- Chat agent -->
  <rect x="590" y="262" width="535" height="245" fill="rgb(234,243,255)" stroke="rgb(0,68,148)" stroke-width="1.5"/>
  <text x="606" y="290" class="h" fill="rgb(0,68,148)">Chat agent</text>
  <rect x="1065" y="274" width="46" height="20" fill="rgb(176,90,0)"/><text x="1088" y="288" text-anchor="middle" class="cc">LLM</text>
  <text x="606" y="308" class="tag">ONE LLM · FOUR TOOLS · ONE TURN PER JOB</text>

  <rect x="604" y="320" width="251" height="56" fill="#fff" stroke="rgb(0,68,148)"/>
  <text x="618" y="343" class="mono" fill="rgb(0,68,148)">search_legislation</text>
  <text x="618" y="364" class="s">by meaning + words, on a date</text>
  <rect x="862" y="320" width="249" height="56" fill="#fff" stroke="rgb(0,68,148)"/>
  <text x="876" y="343" class="mono" fill="rgb(0,68,148)">find_article</text>
  <text x="876" y="364" class="s">a named act or article, directly</text>
  <rect x="604" y="384" width="251" height="56" fill="#fff" stroke="rgb(0,68,148)"/>
  <text x="618" y="407" class="mono" fill="rgb(0,68,148)">read_article</text>
  <text x="618" y="428" class="s">the whole article and its source</text>
  <rect x="862" y="384" width="249" height="56" fill="#fff" stroke="rgb(0,68,148)" stroke-dasharray="6 4"/>
  <text x="876" y="407" class="mono" fill="rgb(0,68,148)">web_search</text>
  <text x="876" y="428" class="s">finds acts the library lacks</text>

  <rect x="604" y="450" width="507" height="44" fill="rgb(226,243,226)" stroke="rgb(46,125,50)"/>
  <path d="M618,472 l5,5 l10,-11" fill="none" stroke="rgb(46,125,50)" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter"/>
  <text x="644" y="477" font-size="14.5" font-weight="700" fill="rgb(46,125,50)">every quote checked word for word against the law</text>

  <!-- ===== RAG chat app ===== -->
  <rect x="1200" y="210" width="360" height="310" fill="rgb(226,243,226)" stroke="rgb(46,125,50)" stroke-width="2"/>
  <text x="1220" y="252" font-size="30" font-weight="700" fill="rgb(46,125,50)">RAG chat</text>
  <text x="1540" y="250" text-anchor="end" class="tag" fill="rgb(46,125,50)">DESKTOP APP</text>
  <text x="1220" y="282" class="t">ask the law a question in plain words</text>

  <rect x="1216" y="298" width="328" height="52" fill="#fff" stroke="rgb(46,125,50)"/>
  <text x="1232" y="320" class="h2">Chat</text>
  <text x="1232" y="340" class="s">answers with quotes: verified, or flagged</text>
  <rect x="1216" y="358" width="328" height="52" fill="#fff" stroke="rgb(46,125,50)"/>
  <text x="1232" y="380" class="h2">Search</text>
  <text x="1232" y="400" class="s">straight into the library, no LLM</text>
  <rect x="1216" y="418" width="328" height="52" fill="#fff" stroke="rgb(46,125,50)"/>
  <text x="1232" y="440" class="h2">Discoveries</text>
  <text x="1232" y="460" class="s">a missing act? ingest it in one click</text>

  <text x="1220" y="500" class="s">runs nothing itself: every action is a job</text>

  <!-- ===== nomos database (wide) ===== -->
  <path d="M290,610 v150 a425,20 0 0 0 850,0 v-150" fill="rgb(222,240,248)" stroke="rgb(0,68,148)" stroke-width="2"/>
  <ellipse cx="715" cy="610" rx="425" ry="20" fill="rgb(234,243,255)" stroke="rgb(0,68,148)" stroke-width="2"/>
  <text x="320" y="690" font-size="32" font-weight="700" fill="rgb(0,68,148)">nomos</text>
  <text x="320" y="716" class="s">PostgreSQL + pgvector</text>
  <g text-anchor="middle">
    <rect x="500" y="652" width="190" height="76" fill="#fff" stroke="rgb(0,68,148)"/>
    <text x="595" y="686" class="h2" fill="rgb(0,68,148)">law</text>
    <text x="595" y="708" class="s">texts, versions, vectors</text>
    <rect x="705" y="652" width="190" height="76" fill="rgb(242,252,255)" stroke="rgb(21,156,228)" stroke-width="1.6"/>
    <text x="800" y="686" class="h2" fill="rgb(21,156,228)">job queue</text>
    <text x="800" y="708" class="s">questions &amp; answers</text>
    <rect x="910" y="652" width="200" height="76" fill="#fff" stroke="rgb(46,125,50)"/>
    <text x="1010" y="686" class="h2" fill="rgb(46,125,50)">history</text>
    <text x="1010" y="708" class="s">conversations = past jobs</text>
  </g>

  <!-- ===== Note: web text is never evidence ===== -->
  <rect x="1200" y="770" width="360" height="90" fill="#fff" stroke="rgb(199,208,211)"/>
  <rect x="1200" y="770" width="6" height="90" fill="rgb(255,214,23)"/>
  <text x="1222" y="800" class="h2">Web text is never evidence</text>
  <text x="1222" y="824" class="s">an act found on the web is ingested first,</text>
  <text x="1222" y="844" class="s">then the question is asked again</text>

  <!-- legend -->
  <g font-size="13" fill="rgb(90,96,102)">
    <rect x="40" y="620" width="14" height="14" fill="rgb(0,68,148)"/><text x="62" y="632">law &amp; data</text>
    <rect x="40" y="646" width="14" height="14" fill="rgb(90,47,168)"/><text x="62" y="658">GPU</text>
    <rect x="40" y="672" width="14" height="14" fill="rgb(176,90,0)"/><text x="62" y="684">LLM</text>
    <rect x="40" y="698" width="14" height="14" fill="rgb(21,156,228)"/><text x="62" y="710">asynchronous jobs</text>
    <rect x="40" y="724" width="14" height="14" fill="rgb(46,125,50)"/><text x="62" y="736">what the analyst sees</text>
    <rect x="40" y="750" width="14" height="14" fill="rgb(198,40,40)"/><text x="62" y="762">observability</text>
  </g>

  <!-- ===== Arrows ===== -->
  <!-- law -> Nomotheca -->
  <line x1="250" y1="410" x2="315" y2="410" stroke="rgb(0,68,148)" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <text x="270" y="400" text-anchor="middle" class="lbl">fetch</text>
  <!-- worker <-> web, LLM; worker -> phoenix -->
  <line x1="200" y1="181" x2="200" y2="196" stroke="rgb(0,68,148)" stroke-width="2.5" stroke-dasharray="5 3"/>
  <path d="M200,196 H330 V207" fill="none" stroke="rgb(0,68,148)" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#aBlue)"/>
  <line x1="620" y1="181" x2="620" y2="207" stroke="rgb(176,90,0)" stroke-width="2.5" marker-start="url(#aAmber)" marker-end="url(#aAmber)"/>
  <line x1="1010" y1="207" x2="1010" y2="189" stroke="rgb(198,40,40)" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#aRed)"/>
  <!-- bricks <-> nomos -->
  <line x1="440" y1="523" x2="440" y2="589" stroke="rgb(0,68,148)" stroke-width="2.5" marker-end="url(#aBlue)"/>
  <text x="452" y="560" class="lbl">writes the law</text>
  <line x1="700" y1="523" x2="700" y2="590" stroke="rgb(0,68,148)" stroke-width="2.5" marker-start="url(#aBlue)"/>
  <text x="712" y="560" class="lbl">reads the law</text>
  <line x1="1010" y1="590" x2="1010" y2="523" stroke="rgb(21,156,228)" stroke-width="2.5" marker-start="url(#aCyan)" marker-end="url(#aCyan)"/>
  <text x="1022" y="552" class="lbl">claims a question,</text>
  <text x="1022" y="568" class="lbl">writes the answer</text>

  <!-- app <-> nomos -->
  <path d="M1270,523 V680 H1143" fill="none" stroke="rgb(0,68,148)" stroke-width="2.5" marker-start="url(#aBlue)" marker-end="url(#aBlue)"/>
  <text x="1282" y="600" class="lbl">search</text>
  <path d="M1380,523 V735 H1143" fill="none" stroke="rgb(21,156,228)" stroke-width="2.5" marker-start="url(#aCyan)" marker-end="url(#aCyan)"/>
  <text x="1392" y="592" class="lbl">asks, follows,</text>
  <text x="1392" y="608" class="lbl">ingests</text>
</svg>
