<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 472" width="940" height="472" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Models JRC can host do as well as GPT</title>
<desc id="d">Per 100 legislation-based parameters of the four-country panel: proposals ready to accept, wrong proposals and parameters left to the analyst, for GPT, MiniMax M2.7 and DeepSeek V4 Flash.</desc>
<rect width="940" height="472" fill="#fcfcfb"/>
<text x="24" y="40" font-size="22" font-weight="600" fill="#0b0b0b">Models JRC can host do as well as GPT</text>
<text x="24" y="66" font-size="14" fill="#52514e">Out of 100 EUROMOD parameters set by legislation, how many can the agent update on its own?</text>
<text x="24" y="86" font-size="14" fill="#52514e">Panel of 200 parameters from France, Spain, Ireland and Lithuania · update from 2024 to 2025 · 17–19 Nov 2026</text>
<rect x="24" y="110" width="13" height="13" rx="2" fill="#2a78d6"/><text x="44" y="121.5" font-size="13" fill="#52514e">Ready to accept: right value with its legal quote</text>
<rect x="408" y="110" width="13" height="13" rx="2" fill="#d03b3b"/><text x="428" y="121.5" font-size="13" fill="#52514e">Wrong proposal</text>
<rect x="550" y="110" width="13" height="13" rx="2" fill="#c3c2b7"/><text x="570" y="121.5" font-size="13" fill="#52514e">Left to the analyst</text>
<text x="24" y="170" font-size="16" font-weight="600" fill="#0b0b0b">GPT (baseline)</text>
<text x="24" y="189" font-size="12.5" fill="#52514e">Reference. Not usable at JRC.</text>
<rect x="300.0" y="150" width="393.8" height="46" rx="4" fill="#2a78d6"><title>GPT (baseline): 126 of 192 ready to accept</title></rect>
<text x="496.9" y="182.4" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">66</text>
<rect x="695.8" y="150" width="32.4" height="46" rx="4" fill="#d03b3b"><title>GPT (baseline): 11 of 192 wrong</title></rect>
<text x="711.9" y="178.4" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">6</text>
<rect x="730.1" y="150" width="169.9" height="46" rx="4" fill="#c3c2b7"><title>GPT (baseline): 55 of 192 left to the analyst</title></rect>
<text x="815.1" y="178.4" font-size="15" font-weight="400" fill="#0b0b0b" text-anchor="middle">29</text>
<text x="24" y="248" font-size="16" font-weight="600" fill="#0b0b0b">MiniMax M2.7</text>
<text x="24" y="267" font-size="12.5" fill="#52514e">JRC&#x27;s current model.</text>
<rect x="300.0" y="228" width="396.9" height="46" rx="4" fill="#2a78d6"><title>MiniMax M2.7: 127 of 192 ready to accept</title></rect>
<text x="498.4" y="260.4" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">66</text>
<rect x="698.9" y="228" width="35.5" height="46" rx="4" fill="#d03b3b"><title>MiniMax M2.7: 12 of 192 wrong</title></rect>
<text x="716.6" y="256.4" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">6</text>
<rect x="736.4" y="228" width="163.6" height="46" rx="4" fill="#c3c2b7"><title>MiniMax M2.7: 53 of 192 left to the analyst</title></rect>
<text x="818.2" y="256.4" font-size="15" font-weight="400" fill="#0b0b0b" text-anchor="middle">28</text>
<text x="24" y="326" font-size="16" font-weight="600" fill="#0b0b0b">DeepSeek V4 Flash</text>
<text x="24" y="345" font-size="12.5" fill="#52514e">Candidate. MIT licence, smaller.</text>
<rect x="300.0" y="306" width="387.5" height="46" rx="4" fill="#2a78d6"><title>DeepSeek V4 Flash: 124 of 192 ready to accept</title></rect>
<text x="493.8" y="338.4" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">65</text>
<rect x="689.5" y="306" width="32.4" height="46" rx="4" fill="#d03b3b"><title>DeepSeek V4 Flash: 11 of 192 wrong</title></rect>
<text x="705.7" y="334.4" font-size="15" font-weight="400" fill="#ffffff" text-anchor="middle">6</text>
<rect x="723.9" y="306" width="176.1" height="46" rx="4" fill="#c3c2b7"><title>DeepSeek V4 Flash: 57 of 192 left to the analyst</title></rect>
<text x="811.9" y="334.4" font-size="15" font-weight="400" fill="#0b0b0b" text-anchor="middle">30</text>
<line x1="24" y1="390" x2="916" y2="390" stroke="#e1e0d9"/>
<text x="24" y="414" font-size="12.5" fill="#52514e">The three models are within 2 points of each other: with 192 parameters, that is inside the run-to-run variation.</text>
<text x="24" y="432" font-size="12.5" fill="#898781">Ready to accept = the proposal has the right value and a quote checked word for word in the law. Wrong = a different value passed the checks.</text>
<text x="24" y="450" font-size="12.5" fill="#898781">The result differs a lot between countries: see the per-country chart.</text>
</svg>
