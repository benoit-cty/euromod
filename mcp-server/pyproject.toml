[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nomotheca-legislation-mcp"
version = "0.1.0"
description = "Read-only MCP tools for hybrid retrieval over the EUROMOD legislation database."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=1.28,<2",
  "psycopg[binary]>=3.2",
  "nomotheca-legislation-ingest[embeddings]",
]

[project.scripts]
nomotheca-legislation-mcp = "nomotheca_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nomotheca_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
nomotheca-legislation-ingest = { path = "../Nomotheca-RAG/ingest", editable = true }
