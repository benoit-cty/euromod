[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nomos-llm"
version = "0.1.0"
description = "Shared base of the Nómos packages: provider-prefixed LLM access and the repo-root .env."
license = {text = "EUPL-1.2"}
requires-python = ">=3.12"
dependencies = [
  "pydantic-ai-slim[anthropic,openai]>=1.0",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/nomos_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
