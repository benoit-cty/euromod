te\nNous autorisons la cr\u00e9ation sans demande pr\u00e9alable de liens en surface (surface linking) qui renvoient \u00e0 la page d&#039;accueil du site ou \u00e0 toute autre page dans sa globalit\u00e9. Par contre, le recours \u00e0 toutes techniques visant \u00e0 inclure tout ou partie du site portail dans un site Internet en masquant ne serait-ce que partiellement l&#039;origine exacte de l&#039;information ou pouvant pr\u00eater \u00e0 confusion sur l&#039;origine de l&#039;information, telle que le framing ou l&#039;in-lining, requiert une autorisation \u00e9crite. Toute demande en ce sens doit \u00eatre adress\u00e9e \u00e0 web.territoire@spw.wallonie.be.&quot;,&quot;site_id&quot;:3}}},{&quot;id&quot;:236,&quot;type&quot;:&quot;footer-bottom-links&quot;,&quot;landingpage&quot;:&quot;home&quot;,&quot;content_id&quot;:62,&quot;title&quot;:&quot;Vie priv\u00e9e&quot;,&quot;slug&quot;:&quot;page\/vie-privee&quot;,&quot;lang&quot;:&quot;fr&quot;,&quot;order&quot;:&quot;3&quot;,&quot;image&quot;:null,&quot;created_at&quot;:&quot;2024-07-16T08:38:51.000000Z&quot;,&quot;updated_at&quot;:&quot;2024-07-16T08:38:51.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;site_id&quot;:3,&quot;description&quot;:null,&quot;content&quot;:{&quot;id&quot;:62,&quot;name&quot;:&quot;vie-privee&quot;,&quot;slug&quot;:&quot;vie-privee&quot;,&quot;title&quot;:&quot;Vie priv\u00e9e&quot;,&quot;lang&quot;:&quot;fr&quot;,&quot;status&quot;:&quot;P&quot;,&quot;meta_description&quot;:null,&quot;meta_keywords&quot;:null,&quot;contentable_type&quot;:&quot;page&quot;,&quot;contentable_id&quot;:10,&quot;created_at&quot;:&quot;2022-01-12T09:42:42.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-01-26T15:21:10.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;publish_date&quot;:null,&quot;unpublish_date&quot;:null,&quot;author_id&quot;:&quot;1&quot;,&quot;editor_id&quot;:&quot;5&quot;,&quot;path&quot;:&quot;page\/vie-privee&quot;,&quot;sorting_date&quot;:&quot;2023-01-31 11:45:47&quot;,&quot;contentable&quot;:{&quot;id&quot;:10,&quot;content_html&quot;:&quot;&lt;p&gt;&lt;strong&gt;Le Service public de Wallonie travaille depuis f\u00e9vrier 2017 \u00e0 la mise en conformit\u00e9 au R\u00e8glement g\u00e9n\u00e9ral sur la protection des donn\u00e9es (RGPD) qui est entr\u00e9 en application le 25 mai 2018.&lt;\/strong&gt;&lt;\/p&gt;\n&lt;p&gt;La politique de protection des donn\u00e9es d\u00e9j\u00e0 en place, conform\u00e9ment \u00e0 la loi du 8 d\u00e9cembre 1992 relative \u00e0 la protection de la vie priv\u00e9e, a d\u00e8s lors \u00e9t\u00e9 renforc\u00e9e.&lt;\/p&gt;\n&lt;h2&gt;Responsable des traitements&lt;\/h2&gt;\n&lt;p&gt;Le responsable des traitements de donn\u00e9es \u00e0 caract\u00e8re personnel se rapportant au pr\u00e9sent site est S\u00e9bastien PRADELLA, Directeur g\u00e9n\u00e9ral du Service public de Wallonie, Territoire, Logement, Patrimoine et Energie.&lt;\/p&gt;\n&lt;p&gt;Vous pouvez, dans certains cas sp\u00e9cifiques, rectifier ou demander \u00e0 faire effacer vos donn\u00e9es, limiter ou vous opposer au traitement en le contactant \u00e0 l&#039;adresse postale suivante: Service public de Wallonie, Territoire, Logement, Patrimoine et Energie, Rue des Brigades d&#039;Irlande, 1 \u00e0 5100 Jambes, ainsi que par courrier \u00e9lectronique \u00e0 &lt;a class=\&quot;article-link\&quot; title=\&quot;Envoyer un e-mail au SPW TLPE\&quot; href=\&quot;mailto:territoire@spw.wallonie.be\&quot;&gt;territoire@spw.wallonie.be&lt;\/a&gt;.&lt;\/p&gt;\n&lt;p&gt;Pour toute autre question ou l&#039;exercice du droit d&#039;acc\u00e8s, contactez le D\u00e9l\u00e9gu\u00e9 \u00e0 la protection des donn\u00e9es, Olivier EVRARD, \u00e0 l&#039;adresse e-mail suivante : &lt;a class=\&quot;article-link\&quot; title=\&quot;Envoyer un e-mail au D\u00e9l\u00e9gu\u00e9 \u00e0 la protection des donn\u00e9es\&quot; href=\&quot;mailto:dpo@spw.wallonie.be\&quot;&gt;dpo@spw.wallonie.be&lt;\/a&gt;&lt;\/p&gt;\n&lt;h2&gt;Principes relatifs \u00e0 la collecte de donn\u00e9es \u00e0 caract\u00e8re personnel&lt;\/h2&gt;\n&lt;p&gt;En principe, l&#039;acc\u00e8s aux informations disponibles sur ou via le site s&#039;op\u00e8re sans devoir fournir des donn\u00e9es \u00e0 caract\u00e8re personnel, telles nom, adresse postale, adresse de courrier \u00e9lectronique...&lt;\/p&gt;\n&lt;p&gt;Exceptionnellement, en vue d&#039;obtenir des services compl\u00e9mentaires (commande de documents, abonnement \u00e0 une lettre d&#039;information, questions pos\u00e9es par mail ou via le 1718,...), il est possible que des informations personnelles, essentiellement des coordonn\u00e9es, soient demand\u00e9es \u00e0 l&#039;utilisateur. Dans ce cas, l&#039;utilisateur est averti pr\u00e9alablement et les donn\u00e9es sont trait\u00e9es conform\u00e9ment \u00e0 la r\u00e9glementation relative \u00e0 la protection des donn\u00e9es \u00e0 caract\u00e8re personnel (RGPD).&lt;\/p&gt;\n&lt;p&gt;Concr\u00e8tement, cela signifie notamment que :&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;Vos donn\u00e9es \u00e0 caract\u00e8re personnel ne pourront \u00eatre recueillies ettrait\u00e9es que conform\u00e9ment aux finalit\u00e9s indiqu\u00e9es lors de leur collecte ;&lt;\/p&gt;\n&lt;\/li&gt;\n&lt;li&gt;\n&lt;p&gt;Vous disposerez du droit de v\u00e9rifier aupr\u00e8s du SPW, via l&#039;adresse &lt;a class=\&quot;article-link\&quot; title=\&quot;Envoyer un e-mail au D\u00e9l\u00e9gu\u00e9 \u00e0 la protection des donn\u00e9es\&quot; href=\&quot;mailto:dpo@spw.wallonie.be\&quot;&gt;dpo@spw.wallonie.be&lt;\/a&gt;, si vos donn\u00e9es sont trait\u00e9es.&lt;\/p&gt;\n&lt;\/li&gt;\n&lt;li&gt;\n&lt;p&gt;Vous disposerez du droit de consulter vos donn\u00e9es personnelles, le cas \u00e9ch\u00e9ant, afin de v\u00e9rifier leur exactitude et de faire corriger les \u00e9ventuelles erreurs les concernant aupr\u00e8s du responsable du traitement de vos donn\u00e9es dont les coordonn\u00e9es figurent ci-dessus ;&lt;\/p&gt;\n&lt;\/li&gt;\n&lt;li&gt;\n&lt;p&gt;Le SPW s&#039;engage \u00e0 prendre les meilleures mesures de s\u00e9curit\u00e9 afin d&#039;\u00e9viter que des tiers n&#039;abusent des donn\u00e9es \u00e0 caract\u00e8re personnel que vous auriez communiqu\u00e9es.&lt;\/p&gt;\n&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;h2&gt;Utilisation \u00e0 des fins statistiques d&#039;informations relatives \u00e0 la navigation&lt;\/h2&gt;\n&lt;p&gt;Lorsque vous acc\u00e9dez au site, les serveurs consult\u00e9s collectent automatiquement les donn\u00e9es suivantes :&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;\n&lt;p&gt;l&#039;adresse IP qui vous est attribu\u00e9e lors de votre connexion;&lt;\/p&gt;\n&lt;\/li&gt;\n&lt;li&gt;\n&lt;p&gt;la date et l&#039;heure d&#039;acc\u00e8s au site;&lt;\/p&gt;\n&lt;\/li&gt;\n&lt;li&gt;\n&lt;p&gt;les pages consult\u00e9es;&lt;\/p&gt;\n&lt;\/li&gt;\n&lt;li&gt;\n&lt;p&gt;le type de navigateur (browser) utilis\u00e9;&lt;\/p&gt;\n&lt;\/li&gt;\n&lt;li&gt;\n&lt;p&gt;la plate-forme et\/ou le syst\u00e8me d&#039;exploitation install\u00e9 sur le PC;&lt;\/p&gt;\n&lt;\/li&gt;\n&lt;li&gt;\n&lt;p&gt;le moteur de recherche ainsi que les mots-cl\u00e9s utilis\u00e9s pour retrouver le site portail les fichiers t\u00e9l\u00e9charg\u00e9s.&lt;\/p&gt;\n&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Ces informations ne sont conserv\u00e9es qu&#039;\u00e0 la seule fin de mesurer le nombre de visiteurs dans les diff\u00e9rentes sections du site portail et d&#039;y apporter des am\u00e9liorations. Les rapports que nous en tirons ne font plus \u00e9tat que de donn\u00e9es anonymis\u00e9es alors que les donn\u00e9es r\u00e9colt\u00e9es sont d\u00e9truites.&lt;\/p&gt;\n&lt;h2&gt;Utilisation de cookies&lt;\/h2&gt;\n&lt;p&gt;Dans le but de faciliter votre navigation sur le site (enregistrer vos pr\u00e9f\u00e9rences ou vous \u00e9viter de devoir r\u00e9p\u00e9ter les m\u00eames saisies \u00e0 chaque visite) ainsi que d&#039;optimaliser la gestion technique du site, le Service public de Wallonie peut \u00eatre occasionnellement amen\u00e9 \u00e0 utiliser des \&quot;cookies\&quot;, le temps d&#039;une visite la plupart du temps.&lt;\/p&gt;\n&lt;p&gt;Un \&quot;cookie\&quot; est une petite pi\u00e8ce d&#039;information sauvegard\u00e9e par un site web au sein du navigateur Internet de votre ordinateur. Ce \&quot;cookie\&quot; peut \u00eatre r\u00e9cup\u00e9r\u00e9 lors d&#039;une visite ult\u00e9rieure sur ce m\u00eame site. Le \&quot;cookie\&quot; ne peut \u00eatre lu par un autre site web que celui qui l&#039;a cr\u00e9\u00e9.&lt;\/p&gt;\n&lt;p&gt;Aucun d&#039;entre eux ne contient d&#039;informations vous rendant susceptible de pouvoir \u00eatre contact\u00e9 par t\u00e9l\u00e9phone, courrier \u00e9lectronique ou postal. Il vous est \u00e9galement possible de configurer votre navigateur pour vous informer lors de chaque cr\u00e9ation de \&quot;cookie\&quot; ou pour emp\u00eacher leur enregistrement.&lt;\/p&gt;\n&lt;h2&gt;Utilisation des messageries \u00e9lectroniques&lt;\/h2&gt;\n&lt;p&gt;Les bo\u00eetes \u00e0 messages \u00e9lectroniques mises \u00e0 votre disposition sont g\u00e9r\u00e9es par les diff\u00e9rentes cellules ou directions du SPW Territoire, Logement, Patrimoine et Energie.&lt;\/p&gt;\n&lt;p&gt;Les donn\u00e9es \u00e0 caract\u00e8re personnel r\u00e9colt\u00e9es suite \u00e0 votre prise de contact ne seront utilis\u00e9es que pour assurer le suivi de votre dossier ou pour vous orienter vers les informations disponibles sur les sites publics ou vers les services comp\u00e9tents de l&#039;administration. Les messages \u00e0 caract\u00e8re politique sont r\u00e9orient\u00e9s vers les sites du Gouvernement ou du Ministre fonctionnel.&lt;\/p&gt;\n&lt;p&gt;Il est r\u00e9pondu aux messages dans un d\u00e9lai de deux jours ouvrables \u00e0 l&#039;exception des demandes qui ne trouvent pas de r\u00e9ponse directe sur un site web public.&lt;\/p&gt;\n&lt;h2&gt;Contact relatif \u00e0 la protection de vos donn\u00e9es \u00e0 caract\u00e8re personnel&lt;\/h2&gt;\n&lt;p&gt;Un D\u00e9l\u00e9gu\u00e9 \u00e0 la protection des donn\u00e9es a \u00e9t\u00e9 d\u00e9sign\u00e9 pour conseiller le SPW sur les r\u00e8gles en mati\u00e8re de protection des donn\u00e9es \u00e0 caract\u00e8re personnel et veiller au respect de celles-ci.&lt;\/p&gt;\n&lt;p&gt;Il est \u00e9galement le point de contact avec les usagers du SPW et l&#039;Autorit\u00e9 de protection des donn\u00e9es. Pour plus d&#039;informations sur les droits que vous pouvez exercer, consultez la page de l&#039;&lt;a class=\&quot;article-link\&quot; title=\&quot;Autorit\u00e9 de protection des donn\u00e9es [ce lien ouvre une nouvelle fen\u00eatre]\&quot; href=\&quot;https:\/\/www.autoriteprotectiondonnees.be\/citoyen\/vie-privee\/quels-sont-mes-droits-\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener\&quot;&gt;Autorit\u00e9 de protection des donn\u00e9es&lt;\/a&gt;. Le D\u00e9l\u00e9gu\u00e9 \u00e0 la protection des donn\u00e9es r\u00e9pond \u00e0 vos questions via l&#039;adresse &lt;a class=\&quot;article-link\&quot; title=\&quot;Envoyer un e-mail au D\u00e9l\u00e9gu\u00e9 \u00e0 la protection des donn\u00e9es\&quot; href=\&quot;mailto:dpo@spw.wallonie.be\&quot;&gt;dpo@spw.wallonie.be&lt;\/a&gt;&lt;\/p&gt;\n&lt;p&gt;\u00a0&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2022-01-12T09:42:42.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-01-26T15:21:10.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;content_text&quot;:&quot;Le Service public de Wallonie travaille depuis f\u00e9vrier 2017 \u00e0 la mise en conformit\u00e9 au R\u00e8glement g\u00e9n\u00e9ral sur la protection des donn\u00e9es (RGPD) qui est entr\u00e9 en application le 25 mai 2018.\nLa politique de protection des donn\u00e9es d\u00e9j\u00e0 en place, conform\u00e9ment \u00e0 la loi du 8 d\u00e9cembre 1992 relative \u00e0 la protection de la vie priv\u00e9e, a d\u00e8s lors \u00e9t\u00e9 renforc\u00e9e.\nResponsable des traitements\nLe responsable des traitements de donn\u00e9es \u00e0 caract\u00e8re personnel se rapportant au pr\u00e9sent site est S\u00e9bastien PRADELLA, Directeur g\u00e9n\u00e9ral du Service public de Wallonie, Territoire, Logement, Patrimoine et Energie.\nVous pouvez, dans certains cas sp\u00e9cifiques, rectifier ou demander \u00e0 faire effacer vos donn\u00e9es, limiter ou vous opposer au traitement en le contactant \u00e0 l&#039;adresse postale suivante: Service public de Wallonie, Territoire, Logement, Patrimoine et Energie, Rue des Brigades d&#039;Irlande, 1 \u00e0 5100 Jambes, ainsi que par courrier \u00e9lectronique \u00e0 territoire@spw.wallonie.be.\nPour toute autre question ou l&#039;exercice du droit d&#039;acc\u00e8s, contactez le D\u00e9l\u00e9gu\u00e9 \u00e0 la protection des donn\u00e9es, Olivier EVRARD, \u00e0 l&#039;adresse e-mail suivante : dpo@spw.wallonie.be\nPrincipes relatifs \u00e0 la collecte de donn\u00e9es \u00e0 caract\u00e8re personnel\nEn principe, l&#039;acc\u00e8s aux informations disponibles sur ou via le site s&#039;op\u00e8re sans devoir fournir des donn\u00e9es \u00e0 caract\u00e8re personnel, telles nom, adresse postale, adresse de courrier \u00e9lectronique...\nExceptionnellement, en vue d&#039;obtenir des services compl\u00e9mentaires (commande de documents, abonnement \u00e0 une lettre d&#039;information, questions pos\u00e9es par mail ou via le 1718,...), il est possible que des informations personnelles, essentiellement des coordonn\u00e9es, soient demand\u00e9es \u00e0 l&#039;utilisateur. Dans ce cas, l&#039;utilisateur est averti pr\u00e9alablement et les donn\u00e9es sont trait\u00e9es conform\u00e9ment \u00e0 la r\u00e9glementation relative \u00e0 la protection des donn\u00e9es \u00e0 caract\u00e8re personnel (RGPD).\nConcr\u00e8tement, cela signifie notamment que :\nVos donn\u00e9es \u00e0 caract\u00e8re personnel ne pourront \u00eatre recueillies ettrait\u00e9es que conform\u00e9ment aux finalit\u00e9s indiqu\u00e9es lors de leur collecte ;\nVous disposerez du droit de v\u00e9rifier aupr\u00e8s du SPW, via l&#039;adresse dpo@spw.wallonie.be, si vos donn\u00e9es sont trait\u00e9es.\nVous disposerez du droit de consulter vos donn\u00e9es personnelles, le cas \u00e9ch\u00e9ant, afin de v\u00e9rifier leur exactitude et de faire corriger les \u00e9ventuelles erreurs les concernant aupr\u00e8s du responsable du traitement de vos donn\u00e9es dont les coordonn\u00e9es figurent ci-dessus ;\nLe SPW s&#039;engage \u00e0 prendre les meilleures mesures de s\u00e9curit\u00e9 afin d&#039;\u00e9viter que des tiers n&#039;abusent des donn\u00e9es \u00e0 caract\u00e8re personnel que vous auriez communiqu\u00e9es.\nUtilisation \u00e0 des fins statistiques d&#039;informations relatives \u00e0 la navigation\nLorsque vous acc\u00e9dez au site, les serveurs consult\u00e9s collectent automatiquement les donn\u00e9es suivantes :\nl&#039;adresse IP qui vous est attribu\u00e9e lors de votre connexion;\nla date et l&#039;heure d&#039;acc\u00e8s au site;\nles pages consult\u00e9es;\nle type de navigateur (browser) utilis\u00e9;\nla plate-forme et\/ou le syst\u00e8me d&#039;exploitation install\u00e9 sur le PC;\nle moteur de recherche ainsi que les mots-cl\u00e9s utilis\u00e9s pour retrouver le site portail les fichiers t\u00e9l\u00e9charg\u00e9s.\nCes informations ne sont conserv\u00e9es qu&#039;\u00e0 la seule fin de mesurer le nombre de visiteurs dans les diff\u00e9rentes sections du site portail et d&#039;y apporter des am\u00e9liorations. Les rapports que nous en tirons ne font plus \u00e9tat que de donn\u00e9es anonymis\u00e9es alors que les donn\u00e9es r\u00e9colt\u00e9es sont d\u00e9truites.\nUtilisation de cookies\nDans le but de faciliter votre navigation sur le site (enregistrer vos pr\u00e9f\u00e9rences ou vous \u00e9viter de devoir r\u00e9p\u00e9ter les m\u00eames saisies \u00e0 chaque visite) ainsi que d&#039;optimaliser la gestion technique du site, le Service public de Wallonie peut \u00eatre occasionnellement amen\u00e9 \u00e0 utiliser des \&quot;cookies\&quot;, le temps d&#039;une visite la plupart du temps.\nUn \&quot;cookie\&quot; est une petite pi\u00e8ce d&#039;information sauvegard\u00e9e par un site web au sein du navigateur Internet de votre ordinateur. Ce \&quot;cookie\&quot; peut \u00eatre r\u00e9cup\u00e9r\u00e9 lors d&#039;une visite ult\u00e9rieure sur ce m\u00eame site. Le \&quot;cookie\&quot; ne peut \u00eatre lu par un autre site web que celui qui l&#039;a cr\u00e9\u00e9.\nAucun d&#039;entre eux ne contient d&#039;informations vous rendant susceptible de pouvoir \u00eatre contact\u00e9 par t\u00e9l\u00e9phone, courrier \u00e9lectronique ou postal. Il vous est \u00e9galement possible de configurer votre navigateur pour vous informer lors de chaque cr\u00e9ation de \&quot;cookie\&quot; ou pour emp\u00eacher leur enregistrement.\nUtilisation des messageries \u00e9lectroniques\nLes bo\u00eetes \u00e0 messages \u00e9lectroniques mises \u00e0 votre disposition sont g\u00e9r\u00e9es par les diff\u00e9rentes cellules ou directions du SPW Territoire, Logement, Patrimoine et Energie.\nLes donn\u00e9es \u00e0 caract\u00e8re personnel r\u00e9colt\u00e9es suite \u00e0 votre prise de contact ne seront utilis\u00e9es que pour assurer le suivi de votre dossier ou pour vous orienter vers les informations disponibles sur les sites publics ou vers les services comp\u00e9tents de l&#039;administration. Les messages \u00e0 caract\u00e8re politique sont r\u00e9orient\u00e9s vers les sites du Gouvernement ou du Ministre fonctionnel.\nIl est r\u00e9pondu aux messages dans un d\u00e9lai de deux jours ouvrables \u00e0 l&#039;exception des demandes qui ne trouvent pas de r\u00e9ponse directe sur un site web public.\nContact relatif \u00e0 la protection de vos donn\u00e9es \u00e0 caract\u00e8re personnel\nUn D\u00e9l\u00e9gu\u00e9 \u00e0 la protection des donn\u00e9es a \u00e9t\u00e9 d\u00e9sign\u00e9 pour conseiller le SPW sur les r\u00e8gles en mati\u00e8re de protection des donn\u00e9es \u00e0 caract\u00e8re personnel et veiller au respect de celles-ci.\nIl est \u00e9galement le point de contact avec les usagers du SPW et l&#039;Autorit\u00e9 de protection des donn\u00e9es. Pour plus d&#039;informations sur les droits que vous pouvez exercer, consultez la page de l&#039;Autorit\u00e9 de protection des donn\u00e9es. Le D\u00e9l\u00e9gu\u00e9 \u00e0 la protection des donn\u00e9es r\u00e9pond \u00e0 vos questions via l&#039;adresse dpo@spw.wallonie.be\n\u00a0&quot;,&quot;site_id&quot;:3}}},{&quot;id&quot;:237,&quot;type&quot;:&quot;footer-bottom-links&quot;,&quot;landingpage&quot;:&quot;home&quot;,&quot;content_id&quot;:66,&quot;title&quot;:&quot;M\u00e9diateur&quot;,&quot;slug&quot;:&quot;page\/mediateur&quot;,&quot;lang&quot;:&quot;fr&quot;,&quot;order&quot;:&quot;4&quot;,&quot;image&quot;:null,&quot;created_at&quot;:&quot;2024-07-16T08:39:10.000000Z&quot;,&quot;updated_at&quot;:&quot;2024-07-16T08:39:10.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;site_id&quot;:3,&quot;description&quot;:null,&quot;content&quot;:{&quot;id&quot;:66,&quot;name&quot;:&quot;mediateur&quot;,&quot;slug&quot;:&quot;mediateur&quot;,&quot;title&quot;:&quot;M\u00e9diateur&quot;,&quot;lang&quot;:&quot;fr&quot;,&quot;status&quot;:&quot;P&quot;,&quot;meta_description&quot;:null,&quot;meta_keywords&quot;:null,&quot;contentable_type&quot;:&quot;page&quot;,&quot;contentable_id&quot;:14,&quot;created_at&quot;:&quot;2022-01-12T09:42:42.000000Z&quot;,&quot;updated_at&quot;:&quot;2025-11-25T15:48:22.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;publish_date&quot;:null,&quot;unpublish_date&quot;:null,&quot;author_id&quot;:&quot;1&quot;,&quot;editor_id&quot;:&quot;8&quot;,&quot;path&quot;:&quot;page\/mediateur&quot;,&quot;sorting_date&quot;:&quot;2023-01-31 11:36:12&quot;,&quot;contentable&quot;:{&quot;id&quot;:14,&quot;content_html&quot;:&quot;&lt;p&gt;Le M\u00e9diateur de la Wallonie et de la F\u00e9d\u00e9ration Wallonie-Bruxelles traite les r\u00e9clamations qui concernent le fonctionnement des autorit\u00e9s administratives r\u00e9gionales et\/ou communautaires.&lt;\/p&gt;\n&lt;p&gt;Toute personne physique ou morale qui estime, \u00e0 l&#039;occasion d&#039;une affaire la concernant, qu&#039;une autorit\u00e9 administrative wallonne ou de la F\u00e9d\u00e9ration Wallonie-Bruxelles n&#039;a pas agi conform\u00e9ment \u00e0 la mission de service public qu&#039;elle doit assurer, peut introduire une r\u00e9clamation individuelle, par \u00e9crit ou sur place, aupr\u00e8s du M\u00e9diateur de la Wallonie et de la F\u00e9d\u00e9ration Wallonie-Bruxelles : &lt;br \/&gt;&lt;br \/&gt;Monsieur Nicolas LAGASSE&lt;br \/&gt;Rue Lucien Nam\u00eache, 54&lt;br \/&gt;5000 NAMUR &lt;br \/&gt;T\u00e9l(num\u00e9ro vert): 0800-19199 &lt;br \/&gt;Fax: 081\/32.19.00&lt;br \/&gt;&lt;a class=\&quot;article-link\&quot; title=\&quot;Site web du m\u00e9diateur [ce lien ouvre une nouvelle fen\u00eatre]\&quot; href=\&quot;http:\/\/www.le-mediateur.be\/\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener\&quot;&gt;Site web du m\u00e9diateur&lt;\/a&gt;&lt;br \/&gt;&lt;a class=\&quot;article-link\&quot; href=\&quot;mailto:reclamation@le-mediateur.be\&quot;&gt;reclamation@le-mediateur.be&lt;\/a&gt; &lt;br \/&gt;&lt;br \/&gt;D\u00e9p\u00f4t de r\u00e9clamation en ligne possible ici : &lt;a class=\&quot;article-link\&quot; title=\&quot;D\u00e9p\u00f4t de r\u00e9clamation en ligne [ce lien ouvre une nouvelle fen\u00eatre]\&quot; href=\&quot;http:\/\/www.le-mediateur.be\/page\/introduction-d-une-reclamation.html\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener\&quot;&gt;D\u00e9p\u00f4t de r\u00e9clamation en ligne&lt;\/a&gt;.&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2022-01-12T09:42:42.000000Z&quot;,&quot;updated_at&quot;:&quot;2025-11-25T15:48:22.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;content_text&quot;:&quot;Le M\u00e9diateur de la Wallonie et de la F\u00e9d\u00e9ration Wallonie-Bruxelles traite les r\u00e9clamations qui concernent le fonctionnement des autorit\u00e9s administratives r\u00e9gionales et\/ou communautaires.\nToute personne physique ou morale qui estime, \u00e0 l&#039;occasion d&#039;une affaire la concernant, qu&#039;une autorit\u00e9 administrative wallonne ou de la F\u00e9d\u00e9ration Wallonie-Bruxelles n&#039;a pas agi conform\u00e9ment \u00e0 la mission de service public qu&#039;elle doit assurer, peut introduire une r\u00e9clamation individuelle, par \u00e9crit ou sur place, aupr\u00e8s du M\u00e9diateur de la Wallonie et de la F\u00e9d\u00e9ration Wallonie-Bruxelles : Monsieur Nicolas LAGASSERue Lucien Nam\u00eache, 545000 NAMUR T\u00e9l(num\u00e9ro vert): 0800-19199 Fax: 081\/32.19.00Site web du m\u00e9diateurreclamation@le-mediateur.be D\u00e9p\u00f4t de r\u00e9clamation en ligne possible ici : D\u00e9p\u00f4t de r\u00e9clamation en ligne.&quot;,&quot;site_id&quot;:3}}},{&quot;id&quot;:238,&quot;type&quot;:&quot;footer-bottom-links&quot;,&quot;landingpage&quot;:&quot;home&quot;,&quot;content_id&quot;:70,&quot;title&quot;:&quot;Accessibilit\u00e9&quot;,&quot;slug&quot;:&quot;page\/accessibilite&quot;,&quot;lang&quot;:&quot;fr&quot;,&quot;order&quot;:&quot;5&quot;,&quot;image&quot;:null,&quot;created_at&quot;:&quot;2024-07-16T08:39:30.000000Z&quot;,&quot;updated_at&quot;:&quot;2024-07-16T08:39:30.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;site_id&quot;:3,&quot;description&quot;:null,&quot;content&quot;:{&quot;id&quot;:70,&quot;name&quot;:&quot;accessibilite&quot;,&quot;slug&quot;:&quot;accessibilite&quot;,&quot;title&quot;:&quot;Accessibilit\u00e9&quot;,&quot;lang&quot;:&quot;fr&quot;,&quot;status&quot;:&quot;P&quot;,&quot;meta_description&quot;:null,&quot;meta_keywords&quot;:null,&quot;contentable_type&quot;:&quot;page&quot;,&quot;contentable_id&quot;:18,&quot;created_at&quot;:&quot;2022-01-12T09:42:42.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-02-16T15:16:58.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;publish_date&quot;:null,&quot;unpublish_date&quot;:null,&quot;author_id&quot;:&quot;1&quot;,&quot;editor_id&quot;:&quot;5&quot;,&quot;path&quot;:&quot;page\/accessibilite&quot;,&quot;sorting_date&quot;:&quot;2023-01-31 11:37:53&quot;,&quot;contentable&quot;:{&quot;id&quot;:18,&quot;content_html&quot;:&quot;&lt;p&gt;Le Service public de Wallonie - Logement (SPW Logement) s&#039;efforce de rendre son site internet le plus accessible notamment aux personnes souffrant d&#039;un handicap. Nous am\u00e9liorons sans rel\u00e2che l&#039;exp\u00e9rience de l&#039;utilisateur en respectant les normes d&#039;accessibilit\u00e9 pertinentes conform\u00e9ment au &lt;a class=\&quot;article-link\&quot; title=\&quot;Wallex - D\u00e9cret du Gouvernement wallon du 02 mai 2019 [ce lien ouvre une nouvelle fen\u00eatre]\&quot; href=\&quot;https:\/\/wallex.wallonie.be\/eli\/loi-decret\/2019\/05\/02\/2019203962\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener\&quot;&gt;d\u00e9cret du Gouvernement wallon du 02 mai 2019&lt;\/a&gt; relatif \u00e0 l&#039;accessibilit\u00e9 des sites internet et des applications mobiles des organismes du secteur public visant \u00e0 transposer la &lt;a class=\&quot;article-link\&quot; title=\&quot;EUR-Lex - Directive europ\u00e9enne (UE) 2016\/2102 [ce lien ouvre une nouvelle fen\u00eatre]\&quot; href=\&quot;https:\/\/eur-lex.europa.eu\/legal-content\/FR\/TXT\/?uri=CELEX:32016L2102\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener\&quot;&gt;directive europ\u00e9enne (UE) 2016\/2102&lt;\/a&gt; relative \u00e0 l&#039;accessibilit\u00e9 des sites internet et des applications mobiles des organismes du secteur public .&lt;\/p&gt;\n&lt;p&gt;La pr\u00e9sente d\u00e9claration sur l&#039;accessibilit\u00e9 s&#039;applique au site &lt;strong&gt;logement.wallonie.be&lt;\/strong&gt;.&lt;\/p&gt;\n&lt;p&gt;Cette d\u00e9claration d&#039;accessibilit\u00e9 a \u00e9t\u00e9 r\u00e9dig\u00e9e le 21 juin 2024 (mise \u00e0 jour le 2 f\u00e9vrier 2026). L&#039;\u00e9valuation du site web par rapport au respect des exigences de la directive europ\u00e9enne (UE) 2016\/2102 a \u00e9t\u00e9 r\u00e9alis\u00e9e sur la base de l&#039;&lt;a class=\&quot;article-link\&quot; title=\&quot;Accessibility Check du SPF BOSA [ce lien ouvre une nouvelle fen\u00eatre]\&quot; href=\&quot;https:\/\/accessibility.belgium.be\/fr\/tools\/bosa-accessibility-check\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener\&quot;&gt;Accessibility Check du SPF BOSA&lt;\/a&gt; et d&#039;une auto-\u00e9valuation du SPW.&lt;\/p&gt;\n&lt;h2&gt;Niveau de conformit\u00e9 \u00e0 la norme accessibilit\u00e9&lt;\/h2&gt;\n&lt;p&gt;Les &lt;a class=\&quot;article-link\&quot; title=\&quot;W3C - Web Content Accessibility Guidelines (WCAG) [ce lien ouvre une nouvelle fen\u00eatre]\&quot; href=\&quot;https:\/\/www.w3.org\/WAI\/standards-guidelines\/wcag\/\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener\&quot;&gt;Web Content Accessibility Guidelines (WCAG)&lt;\/a&gt; rassemblent les normes applicables en mati\u00e8re d&#039;exigences d&#039;accessibilit\u00e9 pour les personnes souffrant d&#039;un handicap. Ces r\u00e8gles peuvent \u00eatre mises en \u0153uvre \u00e0 trois niveaux : niveau A, niveau AA et niveau AAA. La norme europ\u00e9enne pr\u00e9conise le respect du niveau AA.&lt;\/p&gt;\n&lt;p&gt;La transposition de la directive europ\u00e9enne dans la l\u00e9gislation wallonne stipule que l&#039;organisme public rend ses sites internet et applications mobiles accessibles en se conformant aux principes suivants :&lt;\/p&gt;\n&lt;ol&gt;\n&lt;li&gt;les informations et les composants des interfaces utilisateurs sont pr\u00e9sent\u00e9es aux utilisateurs de mani\u00e8re \u00e0 ce qu&#039;ils les per\u00e7oivent ;&lt;\/li&gt;\n&lt;li&gt;les composants des interfaces utilisateurs et la navigation sont utilisables ;&lt;\/li&gt;\n&lt;li&gt;les informations et l&#039;utilisation des interfaces utilisateurs sont compr\u00e9hensibles ;&lt;\/li&gt;\n&lt;li&gt;leur contenu est suffisamment robuste pour \u00eatre interpr\u00e9t\u00e9 de mani\u00e8re fiable par une grande diversit\u00e9 d&#039;agents utilisateurs, y compris des technologies d&#039;assistance.&lt;\/li&gt;\n&lt;\/ol&gt;\n&lt;p&gt;En accord avec ces recommandations, le site &lt;strong&gt;logement.wallonie.be&lt;\/strong&gt; est &lt;span style=\&quot;text-decoration: underline;\&quot;&gt;partiellement accessible&lt;\/span&gt; et respecte les exigences suivantes :&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Une largeur de site suffisante afin de permettre des zooms cons\u00e9quents ;&lt;\/li&gt;\n&lt;li&gt;Un contenu identique en version mobile et en version ordinateur ;&lt;\/li&gt;\n&lt;li&gt;Des couleurs globalement suffisamment contrast\u00e9es ;&lt;\/li&gt;\n&lt;li&gt;La contribution de textes alternatifs aux images lorsque celles-ci ne sont pas d\u00e9coratives ;&lt;\/li&gt;\n&lt;li&gt;Des balises s\u00e9mantiques de titre utilis\u00e9es de mani\u00e8re appropri\u00e9e ;&lt;\/li&gt;\n&lt;li&gt;Des tableaux utilis\u00e9s pour les donn\u00e9es tabulaires et les cellules de donn\u00e9es associ\u00e9es \u00e0 leurs en-t\u00eates;&lt;\/li&gt;\n&lt;li&gt;La couleur n&#039;est pas utilis\u00e9e comme seule fa\u00e7on de v\u00e9hiculer l&#039;information ;&lt;\/li&gt;\n&lt;li&gt;Lorsqu&#039;une information est v\u00e9hicul\u00e9e par une image non d\u00e9corative ou un graphique, une alternative textuelle sous format web est propos\u00e9e ;&lt;\/li&gt;\n&lt;li&gt;Les fonctionnalit\u00e9s d&#039;une page sont utilisables \u00e0 l&#039;aide du clavier \u00e0 l&#039;exception des cartes ;&lt;\/li&gt;\n&lt;li&gt;Les pages n&#039;ont pas de limite de temps et si le site contient des contenus en mouvement, ces derniers peuvent \u00eatre ais\u00e9ment arr\u00eat\u00e9s ;&lt;\/li&gt;\n&lt;li&gt;Les pages ont un titre de page informatif et descriptif ;&lt;\/li&gt;\n&lt;li&gt;Le site propose un plan de site ;&lt;\/li&gt;\n&lt;li&gt;La fonction de chaque lien peut \u00eatre d\u00e9termin\u00e9e \u00e0 partir du texte du lien seul ;&lt;\/li&gt;\n&lt;li&gt;La langue du site est d\u00e9finie ;&lt;\/li&gt;\n&lt;li&gt;Une majorit\u00e9 des documents PDF ont \u00e9t\u00e9 retravaill\u00e9s pour r\u00e9pondre aux exigences d&#039;accessibilit\u00e9 comme la redistribution du texte, l&#039;utilisation de listes \u00e0 puce, un contraste de texte suffisant, des textes alternatifs aux images, l&#039;utilisation de balises.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;h2&gt;Limitations et alternatives&lt;\/h2&gt;\n&lt;p&gt;Nous faisons le maximum pour que l&#039;ensemble de notre site soit accessible \u00e0 tous. N\u00e9anmoins, certains \u00e9l\u00e9ments du site ne sont pas encore pleinement accessibles ce qui explique qu&#039;il soit actuellement &lt;span style=\&quot;text-decoration: underline;\&quot;&gt;partiellement accessible&lt;\/span&gt;. Voici un aper\u00e7u des probl\u00e8mes \u00e0 r\u00e9soudre :&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Sous-titrages de vid\u00e9os : certaines vid\u00e9os publi\u00e9es sur notre site ont \u00e9t\u00e9 r\u00e9alis\u00e9es avant l&#039;application de la directive europ\u00e9enne ou par des partenaires. Nous ne pouvons donc malheureusement pas y int\u00e9grer de sous-titrages. Les vid\u00e9os r\u00e9centes sont sous-titr\u00e9es et nous mettons tout en oeuvre pour que les vid\u00e9os plus anciennes contiennent des sous-titrages.&lt;\/li&gt;\n&lt;li&gt;PDF : dans tous les cas o\u00f9 cela \u00e9tait possible, les documents PDF ont \u00e9t\u00e9 transpos\u00e9s en format HTML. Toutefois, certains formulaires PDF doivent conserver ce format pour pouvoir \u00eatre t\u00e9l\u00e9charg\u00e9s et sign\u00e9s par nos usagers. Ils ont \u00e9t\u00e9 malgr\u00e9 tout retravaill\u00e9s dans leur forme pour les rendre plus accessibles. Notre administration s&#039;engage dans un processus de d\u00e9mat\u00e9rialisation progressive de ses formulaires.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;h2&gt;Retour d&#039;information et coordonn\u00e9es de contact&lt;\/h2&gt;\n&lt;p&gt;Si vous n&#039;arrivez pas \u00e0 acc\u00e9der \u00e0 un contenu ou \u00e0 un service, si vous constatez une absence de conformit\u00e9 ou souhaitez nous interroger sur les efforts que nous d\u00e9ployons afin de rendre notre site web plus accessible, vous pouvez contacter le &lt;a class=\&quot;article-link\&quot; title=\&quot;Formulaire de contact - Envoyer un e-mail \u00e0 la cellule web du SPW TLPE\&quot; href=\&quot;\/fr\/formulaire-de-contact?theme=general-spw-tlpe&amp;amp;soustheme=cellule-web\&quot;&gt;webmaster du site&lt;\/a&gt; pour \u00eatre orient\u00e9 vers une alternative accessible ou obtenir le contenu sous une autre forme.&lt;\/p&gt;\n&lt;h2&gt;Proc\u00e9dure permettant d&#039;assurer le respect des dispositions&lt;\/h2&gt;\n&lt;p&gt;Cette proc\u00e9dure est \u00e0 utiliser dans le cas suivant : vous avez signal\u00e9 au responsable du site internet un d\u00e9faut d&#039;accessibilit\u00e9 qui vous emp\u00eache d&#039;acc\u00e9der \u00e0 un contenu ou \u00e0 un des services du portail et vous n&#039;avez pas obtenu de r\u00e9ponse ou de r\u00e9ponse satisfaisante. Dans ce cas, compl\u00e9tez notre &lt;a class=\&quot;article-link\&quot; title=\&quot;Wallonie.be - Formulaire de plainte [ce lien ouvre une nouvelle fen\u00eatre]\&quot; href=\&quot;https:\/\/www.wallonie.be\/fr\/introduire-une-plainte-spw\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener\&quot;&gt;formulaire de plainte&lt;\/a&gt; en s\u00e9lectionnant comme th\u00e9matique : informations g\u00e9n\u00e9rales et services en ligne. Si vous n&#039;avez obtenu aucune r\u00e9ponse satisfaisante suite \u00e0 votre contact avec le responsable du site et \u00e0 votre d\u00e9p\u00f4t de plainte, vous pouvez contacter le &lt;a class=\&quot;article-link\&quot; title=\&quot;M\u00e9diateur de la Wallonie et de la F\u00e9d\u00e9ration Wallonie-Bruxelles [ce lien ouvre une nouvelle fen\u00eatre]\&quot; href=\&quot;https:\/\/www.wallonie.be\/fr\/mediateur\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener\&quot;&gt;M\u00e9diateur de la Wallonie et de la F\u00e9d\u00e9ration Wallonie-Bruxelles&lt;\/a&gt;.&lt;\/p&gt;&quot;,&quot;created_at&quot;:&quot;2022-01-12T09:42:42.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-02-16T15:16:58.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;content_text&quot;:&quot;Le Service public de Wallonie - Logement (SPW Logement) s&#039;efforce de rendre son site internet le plus accessible notamment aux personnes souffrant d&#039;un handicap. Nous am\u00e9liorons sans rel\u00e2che l&#039;exp\u00e9rience de l&#039;utilisateur en respectant les normes d&#039;accessibilit\u00e9 pertinentes conform\u00e9ment au d\u00e9cret du Gouvernement wallon du 02 mai 2019 relatif \u00e0 l&#039;accessibilit\u00e9 des sites internet et des applications mobiles des organismes du secteur public visant \u00e0 transposer la directive europ\u00e9enne (UE) 2016\/2102 relative \u00e0 l&#039;accessibilit\u00e9 des sites internet et des applications mobiles des organismes du secteur public .\nLa pr\u00e9sente d\u00e9claration sur l&#039;accessibilit\u00e9 s&#039;applique au site logement.wallonie.be.\nCette d\u00e9claration d&#039;accessibilit\u00e9 a \u00e9t\u00e9 r\u00e9dig\u00e9e le 21 juin 2024 (mise \u00e0 jour le 2 f\u00e9vrier 2026). L&#039;\u00e9valuation du site web par rapport au respect des exigences de la directive europ\u00e9enne (UE) 2016\/2102 a \u00e9t\u00e9 r\u00e9alis\u00e9e sur la base de l&#039;Accessibility Check du SPF BOSA et d&#039;une auto-\u00e9valuation du SPW.\nNiveau de conformit\u00e9 \u00e0 la norme accessibilit\u00e9\nLes Web Content Accessibility Guidelines (WCAG) rassemblent les normes applicables en mati\u00e8re d&#039;exigences d&#039;accessibilit\u00e9 pour les personnes souffrant d&#039;un handicap. Ces r\u00e8gles peuvent \u00eatre mises en \u0153uvre \u00e0 trois niveaux : niveau A, niveau AA et niveau AAA. La norme europ\u00e9enne pr\u00e9conise le respect du niveau AA.\nLa transposition de la directive europ\u00e9enne dans la l\u00e9gislation wallonne stipule que l&#039;organisme public rend ses sites internet et applications mobiles accessibles en se conformant aux principes suivants :\nles informations et les composants des interfaces utilisateurs sont pr\u00e9sent\u00e9es aux utilisateurs de mani\u00e8re \u00e0 ce qu&#039;ils les per\u00e7oivent ;\nles composants des interfaces utilisateurs et la navigation sont utilisables ;\nles informations et l&#039;utilisation des interfaces utilisateurs sont compr\u00e9hensibles ;\nleur contenu est suffisamment robuste pour \u00eatre interpr\u00e9t\u00e9 de mani\u00e8re fiable par une grande diversit\u00e9 d&#039;agents utilisateurs, y compris des technologies d&#039;assistance.\nEn accord avec ces recommandations, le site logement.wallonie.be est partiellement accessible et respecte les exigences suivantes :\nUne largeur de site suffisante afin de permettre des zooms cons\u00e9quents ;\nUn contenu identique en version mobile et en version ordinateur ;\nDes couleurs globalement suffisamment contrast\u00e9es ;\nLa contribution de textes alternatifs aux images lorsque celles-ci ne sont pas d\u00e9coratives ;\nDes balises s\u00e9mantiques de titre utilis\u00e9es de mani\u00e8re appropri\u00e9e ;\nDes tableaux utilis\u00e9s pour les donn\u00e9es tabulaires et les cellules de donn\u00e9es associ\u00e9es \u00e0 leurs en-t\u00eates;\nLa couleur n&#039;est pas utilis\u00e9e comme seule fa\u00e7on de v\u00e9hiculer l&#039;information ;\nLorsqu&#039;une information est v\u00e9hicul\u00e9e par une image non d\u00e9corative ou un graphique, une alternative textuelle sous format web est propos\u00e9e ;\nLes fonctionnalit\u00e9s d&#039;une page sont utilisables \u00e0 l&#039;aide du clavier \u00e0 l&#039;exception des cartes ;\nLes pages n&#039;ont pas de limite de temps et si le site contient des contenus en mouvement, ces derniers peuvent \u00eatre ais\u00e9ment arr\u00eat\u00e9s ;\nLes pages ont un titre de page informatif et descriptif ;\nLe site propose un plan de site ;\nLa fonction de chaque lien peut \u00eatre d\u00e9termin\u00e9e \u00e0 partir du texte du lien seul ;\nLa langue du site est d\u00e9finie ;\nUne majorit\u00e9 des documents PDF ont \u00e9t\u00e9 retravaill\u00e9s pour r\u00e9pondre aux exigences d&#039;accessibilit\u00e9 comme la redistribution du texte, l&#039;utilisation de listes \u00e0 puce, un contraste de texte suffisant, des textes alternatifs aux images, l&#039;utilisation de balises.\nLimitations et alternatives\nNous faisons le maximum pour que l&#039;ensemble de notre site soit accessible \u00e0 tous. N\u00e9anmoins, certains \u00e9l\u00e9ments du site ne sont pas encore pleinement accessibles ce qui explique qu&#039;il soit actuellement partiellement accessible. Voici un aper\u00e7u des probl\u00e8mes \u00e0 r\u00e9soudre :\nSous-titrages de vid\u00e9os : certaines vid\u00e9os publi\u00e9es sur notre site ont \u00e9t\u00e9 r\u00e9alis\u00e9es avant l&#039;application de la directive europ\u00e9enne ou par des partenaires. Nous ne pouvons donc malheureusement pas y int\u00e9grer de sous-titrages. Les vid\u00e9os r\u00e9centes sont sous-titr\u00e9es et nous mettons tout en oeuvre pour que les vid\u00e9os plus anciennes contiennent des sous-titrages.\nPDF : dans tous les cas o\u00f9 cela \u00e9tait possible, les documents PDF ont \u00e9t\u00e9 transpos\u00e9s en format HTML. Toutefois, certains formulaires PDF doivent conserver ce format pour pouvoir \u00eatre t\u00e9l\u00e9charg\u00e9s et sign\u00e9s par nos usagers. Ils ont \u00e9t\u00e9 malgr\u00e9 tout retravaill\u00e9s dans leur forme pour les rendre plus accessibles. Notre administration s&#039;engage dans un processus de d\u00e9mat\u00e9rialisation progressive de ses formulaires.\nRetour d&#039;information et coordonn\u00e9es de contact\nSi vous n&#039;arrivez pas \u00e0 acc\u00e9der \u00e0 un contenu ou \u00e0 un service, si vous constatez une absence de conformit\u00e9 ou souhaitez nous interroger sur les efforts que nous d\u00e9ployons afin de rendre notre site web plus accessible, vous pouvez contacter le webmaster du site pour \u00eatre orient\u00e9 vers une alternative accessible ou obtenir le contenu sous une autre forme.\nProc\u00e9dure permettant d&#039;assurer le respect des dispositions\nCette proc\u00e9dure est \u00e0 utiliser dans le cas suivant : vous avez signal\u00e9 au responsable du site internet un d\u00e9faut d&#039;accessibilit\u00e9 qui vous emp\u00eache d&#039;acc\u00e9der \u00e0 un contenu ou \u00e0 un des services du portail et vous n&#039;avez pas obtenu de r\u00e9ponse ou de r\u00e9ponse satisfaisante. Dans ce cas, compl\u00e9tez notre formulaire de plainte en s\u00e9lectionnant comme th\u00e9matique : informations g\u00e9n\u00e9rales et services en ligne. Si vous n&#039;avez obtenu aucune r\u00e9ponse satisfaisante suite \u00e0 votre contact avec le responsable du site et \u00e0 votre d\u00e9p\u00f4t de plainte, vous pouvez contacter le M\u00e9diateur de la Wallonie et de la F\u00e9d\u00e9ration Wallonie-Bruxelles.&quot;,&quot;site_id&quot;:3}}}]},&quot;locale&quot;:&quot;fr&quot;,&quot;language&quot;:{&quot;\u00e0&quot;:&quot;\u00e0&quot;,&quot;Abandonner&quot;:&quot;Abandonner&quot;,&quot;Acc\u00e8s rapides&quot;:&quot;Acc\u00e8s rapides&quot;,&quot;Accueil&quot;:&quot;Accueil&quot;,&quot;Actions&quot;:&quot;Actions&quot;,&quot;Activer&quot;:&quot;Activer&quot;,&quot;Activer\/Mettre en pause la vid\u00e9o&quot;:&quot;Activer\/Mettre en pause la vid\u00e9o&quot;,&quot;Actualit\u00e9s&quot;:&quot;Actualit\u00e9s&quot;,&quot;Actuellement aucun document ne nous a ont \u00e9t\u00e9 transmis par la commune&quot;:&quot;Actuellement aucun document ne nous a ont \u00e9t\u00e9 transmis par la commune&quot;,&quot;Administration&quot;:&quot;Administration&quot;,&quot;Adresse&quot;:&quot;Adresse&quot;,&quot;Adresse de facturation&quot;:&quot;Adresse de facturation&quot;,&quot;Adresse e-mail&quot;:&quot;Adresse e-mail&quot;,&quot;Adresse et n\u00b0&quot;:&quot;Adresse et n\u00b0&quot;,&quot;a \u00e9t\u00e9 attribu\u00e9&quot;:&quot;a \u00e9t\u00e9 attribu\u00e9&quot;,&quot;a \u00e9t\u00e9 demand\u00e9 et est \u00e0 valider par un administrateur du&quot;:&quot;a \u00e9t\u00 ,&quot;meta_keywords&quot;:null,&quot;contentable_type&quot;:&quot;assistance&quot;,&quot;contentable_id&quot;:4,&quot;created_at&quot;:&quot;2022-09-05T13:26:29.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-01-13T11:05:54.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;publish_date&quot;:null,&quot;unpublish_date&quot;:null,&quot;author_id&quot;:&quot;7&quot;,&quot;editor_id&quot;:&quot;7&quot;,&quot;path&quot;:&quot;aide\/le-cheque-habitat&quot;,&quot;sorting_date&quot;:&quot;2022-09-05 15:34:18&quot;,&quot;contentable&quot;:{&quot;id&quot;:4,&quot;header_image&quot;:&quot;w-image-cheque-habitat-2022-09-06-14-17-28&quot;,&quot;content_html&quot;:&quot;&lt;blockquote class=\&quot;alert-format\&quot;&gt;&lt;span style=\&quot;text-decoration: underline;\&quot;&gt;&lt;strong&gt;Attention&lt;\/strong&gt;&lt;\/span&gt; : \u00e0 partir du &lt;strong&gt;1er janvier 2025,&lt;\/strong&gt; le taux des droits d&#039;enregistrement applicable au bien immobilier destin\u00e9 \u00e0 devenir l&#039;habitation propre et unique est fortement r\u00e9duit. Il passe de 12,5 % (taux ordinaire actuel) \u00e0 3 %.&lt;\/blockquote&gt;\n&lt;blockquote class=\&quot;alert-format\&quot;&gt;En parall\u00e8le de cette r\u00e9duction des taux,\u00a0&lt;strong&gt;les divers r\u00e9gimes qui coexistaient jusqu&#039;\u00e0 pr\u00e9sent sont supprim\u00e9s&lt;\/strong&gt;\u00a0:&lt;\/blockquote&gt;\n&lt;blockquote class=\&quot;alert-format\&quot;&gt;\n&lt;ul&gt;\n&lt;li&gt;L&#039;abattement primo-acqu\u00e9rant\u00a0&lt;\/li&gt;\n&lt;li&gt;Le\u00a0ch\u00e8que-habitat&lt;\/li&gt;\n&lt;li&gt;Le taux r\u00e9duit \u00e0 6% pour habitation modeste\u00a0&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;\/blockquote&gt;\n&lt;blockquote class=\&quot;alert-format\&quot;&gt;Pour plus d&#039;infos sur la continuit\u00e9 de votre avantage Ch\u00e8que Habitat, consultez la &lt;a class=\&quot;type_pdf_a\&quot; title=\&quot;FAQ (ce lien ouvrira une autre fen\u00eatre)\&quot; href=\&quot;\/storage\/logement\/documents\/content\/news\/fiscalite-wallonne\/pdf-reforme-droits-enregistrement-faq.pdf\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener\&quot;&gt;FAQ&lt;\/a&gt; aux points &lt;strong&gt;14, 15&lt;\/strong&gt; et &lt;strong&gt;16&lt;\/strong&gt;&lt;\/blockquote&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;\u00a0&lt;\/p&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;\u00a0&lt;\/p&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;Depuis le 1er janvier 2016, le Gouvernement wallon a mis en place un avantage fiscal en mati\u00e8re de cr\u00e9dit hypoth\u00e9caire baptis\u00e9 le \u00ab Ch\u00e8que Habitat \u00bb.&lt;\/p&gt;&quot;,&quot;content_text&quot;:&quot;Attention : \u00e0 partir du 1er janvier 2025, le taux des droits d&#039;enregistrement applicable au bien immobilier destin\u00e9 \u00e0 devenir l&#039;habitation propre et unique est fortement r\u00e9duit. Il passe de 12,5 % (taux ordinaire actuel) \u00e0 3 %.\nEn parall\u00e8le de cette r\u00e9duction des taux,\u00a0les divers r\u00e9gimes qui coexistaient jusqu&#039;\u00e0 pr\u00e9sent sont supprim\u00e9s\u00a0:\nL&#039;abattement primo-acqu\u00e9rant\u00a0\nLe\u00a0ch\u00e8que-habitat\nLe taux r\u00e9duit \u00e0 6% pour habitation modeste\u00a0\nPour plus d&#039;infos sur la continuit\u00e9 de votre avantage Ch\u00e8que Habitat, consultez la FAQ aux points 14, 15 et 16\n\u00a0\n\u00a0\nDepuis le 1er janvier 2016, le Gouvernement wallon a mis en place un avantage fiscal en mati\u00e8re de cr\u00e9dit hypoth\u00e9caire baptis\u00e9 le \u00ab Ch\u00e8que Habitat \u00bb.&quot;,&quot;created_at&quot;:&quot;2022-09-05T13:26:29.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-01-13T11:05:54.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;site_id&quot;:3,&quot;subparts&quot;:[{&quot;id&quot;:20,&quot;title&quot;:&quot;Caract\u00e9ristiques g\u00e9n\u00e9rales de l&#039;avantage&quot;,&quot;content_html&quot;:&quot;&lt;p style=\&quot;text-align: justify;\&quot;&gt;Le Ch\u00e8que Habitat profite davantage aux citoyens qui ont r\u00e9ellement besoin de cette aide pour acqu\u00e9rir leur logement.&lt;\/p&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;En effet :&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li style=\&quot;text-align: justify;\&quot;&gt;le montant du Ch\u00e8que Habitat est plus important quand le revenu de l\u2019individu est plus faible ;&lt;\/li&gt;\n&lt;li style=\&quot;text-align: justify;\&quot;&gt;le montant du Ch\u00e8que Habitat est plus important en fonction du nombre d\u2019enfants \u00e0 charge (125 \u20ac\/enfant) et ce, d\u00e8s le premier enfant ;&lt;\/li&gt;\n&lt;li style=\&quot;text-align: justify;\&quot;&gt;le montant du Ch\u00e8que Habitat est de z\u00e9ro quand le revenu de l\u2019individu est suffisamment \u00e9lev\u00e9 (81.000 \u20ac de revenus net imposable - &lt;em&gt;index\u00e9s \u00e0 105.503 \u20ac en 2025, exercice d&#039;imposition 2026&lt;\/em&gt;) pour lui permettre d\u2019acqu\u00e9rir ais\u00e9ment son logement ;&lt;\/li&gt;\n&lt;li style=\&quot;text-align: justify;\&quot;&gt;le Ch\u00e8que Habitat soutient l\u2019achat de la 1\u00e8re habitation et non la construction d\u2019extension (v\u00e9randa, abris de jardin, \u2026) ;&lt;\/li&gt;\n&lt;li style=\&quot;text-align: justify;\&quot;&gt;le Ch\u00e8que Habitat est une r\u00e9duction d\u2019imp\u00f4t convertible en cr\u00e9dit d\u2019imp\u00f4t.&lt;\/li&gt;\n&lt;\/ul&gt;&quot;,&quot;content_text&quot;:&quot;Le Ch\u00e8que Habitat profite davantage aux citoyens qui ont r\u00e9ellement besoin de cette aide pour acqu\u00e9rir leur logement.\nEn effet :\nle montant du Ch\u00e8que Habitat est plus important quand le revenu de l\u2019individu est plus faible ;\nle montant du Ch\u00e8que Habitat est plus important en fonction du nombre d\u2019enfants \u00e0 charge (125 \u20ac\/enfant) et ce, d\u00e8s le premier enfant ;\nle montant du Ch\u00e8que Habitat est de z\u00e9ro quand le revenu de l\u2019individu est suffisamment \u00e9lev\u00e9 (81.000 \u20ac de revenus net imposable - index\u00e9s \u00e0 105.503 \u20ac en 2025, exercice d&#039;imposition 2026) pour lui permettre d\u2019acqu\u00e9rir ais\u00e9ment son logement ;\nle Ch\u00e8que Habitat soutient l\u2019achat de la 1\u00e8re habitation et non la construction d\u2019extension (v\u00e9randa, abris de jardin, \u2026) ;\nle Ch\u00e8que Habitat est une r\u00e9duction d\u2019imp\u00f4t convertible en cr\u00e9dit d\u2019imp\u00f4t.&quot;,&quot;part_type&quot;:&quot;sous_partie&quot;,&quot;assistance_id&quot;:4,&quot;order&quot;:1,&quot;created_at&quot;:&quot;2022-09-05T13:26:29.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-01-13T10:44:55.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;site_id&quot;:3},{&quot;id&quot;:21,&quot;title&quot;:&quot;Implications de la mise en \u0153uvre de cet avantage&quot;,&quot;content_html&quot;:&quot;&lt;p style=\&quot;text-align: justify;\&quot;&gt;L&#039;avantage vise \u00e0 faciliter l\u2019acc\u00e8s \u00e0 la propri\u00e9t\u00e9, en particulier pour ceux qui disposent de revenus moyens ou modestes.&lt;\/p&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;Cependant, il est n\u00e9cessaire de rassurer ceux qui b\u00e9n\u00e9ficaient du \u00ab bonus logement \u00bb (emprunts hypoth\u00e9caires conclus jusqu\u2019au 31 d\u00e9cembre 2015) :&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li style=\&quot;text-align: justify;\&quot;&gt;Le bonus logement est maintenu mais les plafonds restent d\u00e9sormais fix\u00e9s \u00e0 ceux du 1er janvier 2015 ;&lt;\/li&gt;\n&lt;li style=\&quot;text-align: justify;\&quot;&gt;Depuis le 1er novembre 2015, il n\u2019est plus possible de prolonger la dur\u00e9e du b\u00e9n\u00e9fice du bonus logement en allongeant la dur\u00e9e du remboursement de l\u2019emprunt.&lt;\/li&gt;\n&lt;\/ul&gt;&quot;,&quot;content_text&quot;:&quot;L&#039;avantage vise \u00e0 faciliter l\u2019acc\u00e8s \u00e0 la propri\u00e9t\u00e9, en particulier pour ceux qui disposent de revenus moyens ou modestes.\nCependant, il est n\u00e9cessaire de rassurer ceux qui b\u00e9n\u00e9ficaient du \u00ab bonus logement \u00bb (emprunts hypoth\u00e9caires conclus jusqu\u2019au 31 d\u00e9cembre 2015) :\nLe bonus logement est maintenu mais les plafonds restent d\u00e9sormais fix\u00e9s \u00e0 ceux du 1er janvier 2015 ;\nDepuis le 1er novembre 2015, il n\u2019est plus possible de prolonger la dur\u00e9e du b\u00e9n\u00e9fice du bonus logement en allongeant la dur\u00e9e du remboursement de l\u2019emprunt.&quot;,&quot;part_type&quot;:&quot;sous_partie&quot;,&quot;assistance_id&quot;:4,&quot;order&quot;:2,&quot;created_at&quot;:&quot;2022-09-05T13:26:29.000000Z&quot;,&quot;updated_at&quot;:&quot;2022-10-25T09:43:56.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;site_id&quot;:3},{&quot;id&quot;:22,&quot;title&quot;:&quot;Conditions d&#039;octroi&quot;,&quot;content_html&quot;:&quot;&lt;p style=\&quot;text-align: justify;\&quot;&gt;Les conditions d\u2019octroi reprises ci-dessous sont cumulatives :&lt;\/p&gt;\n&lt;ol style=\&quot;text-align: justify;\&quot;&gt;\n&lt;li&gt;Un &lt;strong&gt;emprunt&lt;\/strong&gt; relatif au financement de l\u2019habitation, d\u2019une dur\u00e9e minimale de &lt;strong&gt;10 ans&lt;\/strong&gt;, couvert par &lt;strong&gt;une inscription hypoth\u00e9caire &lt;\/strong&gt;;&lt;\/li&gt;\n&lt;li&gt;Acquisition d\u2019un bien immobilier (&lt;strong&gt;habitation&lt;\/strong&gt;) dont il faut devenir propri\u00e9taire m\u00eame \u00e0 titre partiel, attest\u00e9e par la passation d\u2019un acte de propri\u00e9t\u00e9 en principe au 31 d\u00e9cembre de l\u2019ann\u00e9e de la conclusion du cr\u00e9dit. Un emprunt hypoth\u00e9caire contract\u00e9 pour financer des travaux (1) n\u2019ouvre donc le droit au Ch\u00e8que Habitat que s\u2019ils sont \u00ab concomitants \u00bb \u00e0 l\u2019achat (2) ;&lt;br \/&gt;(1)(2) &lt;em&gt;dans ce cas, voyez le m\u00e9canisme de l&#039;Accesspack et des pr\u00eats \u00e0 taux z\u00e9ro appel\u00e9s R\u00e9nopack et R\u00e9nopr\u00eat sur le site de la &lt;a class=\&quot;article-link\&quot; title=\&quot;SWCS (ce lien ouvrira une nouvelle fen\u00eatre)\&quot; href=\&quot;https:\/\/www.swcs.be\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener\&quot;&gt;SWCS\u00a0&lt;\/a&gt; ou du &lt;a class=\&quot;article-link\&quot; title=\&quot;FLW (ce lien ouvrira une nouvelle fen\u00eatre)\&quot; href=\&quot;https:\/\/www.flw.be\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener\&quot;&gt;FLW&lt;\/a&gt; si vous avez 3 enfants et plus ;&lt;br \/&gt;&lt;\/em&gt;&lt;\/li&gt;\n&lt;li&gt;L\u2019habitation doit \u00eatre &lt;strong&gt;propre&lt;\/strong&gt; et le rester. Sur le plan fiscal, une habitation est consid\u00e9r\u00e9e comme \u00abpropre\u00bb si elle est &lt;strong&gt;occup\u00e9e personnellement par son propri\u00e9taire&lt;\/strong&gt;. Des exceptions existent et sont pr\u00e9vues par la l\u00e9gislation fiscale (ex : travaux, \u2026) ;&lt;\/li&gt;\n&lt;li&gt;L\u2019habitation doit \u00eatre &lt;strong&gt;unique&lt;\/strong&gt;. La notion habitation \u00ab unique \u00bb signifie que &lt;strong&gt;le propri\u00e9taire ne peut pas&lt;\/strong&gt;, \u00e0 c\u00f4t\u00e9 de l\u2019habitation en question, &lt;strong&gt;poss\u00e9der d\u2019autres habitations&lt;\/strong&gt; qu\u2019il soit (co)propri\u00e9taire, nu-propri\u00e9taire, usufruitier, superficiaire, emphyt\u00e9ote ou possesseur. Le moment auquel s\u2019appr\u00e9cie le caract\u00e8re unique de l\u2019habitation est le 31 d\u00e9cembre de l\u2019ann\u00e9e de la conclusion du cr\u00e9dit. Cependant, il existe des exceptions. Conform\u00e9ment \u00e0 la l\u00e9gislation fiscale actuelle, il n\u2019est pas tenu compte :&lt;\/li&gt;\n&lt;\/ol&gt;\n&lt;ul style=\&quot;text-align: justify;\&quot;&gt;\n&lt;li style=\&quot;list-style-type: none;\&quot;&gt;\n&lt;ul&gt;\n&lt;li&gt;d\u2019une autre habitation dont vous \u00eates copropri\u00e9taire, nu-propri\u00e9taire ou usufruitier par h\u00e9ritage ;&lt;\/li&gt;\n&lt;li&gt;d\u2019une autre habitation si celle-ci est mise en vente au 31 d\u00e9cembre de l\u2019ann\u00e9e de conclusion du cr\u00e9dit pour autant qu\u2019elle soit effectivement vendue au plus tard le 31 d\u00e9cembre de l\u2019ann\u00e9e suivante.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p style=\&quot;padding-left: 40px; text-align: justify;\&quot;&gt;Par ailleurs, dans le nouveau dispositif, les cas d\u2019exceptions pr\u00e9cit\u00e9s sont \u00e9tendus : on peut \u00e9galement ne pas tenir compte des habitations lou\u00e9es via une AIS ou une SLSP.&lt;\/p&gt;\n&lt;p style=\&quot;padding-left: 40px; text-align: justify;\&quot;&gt;Si l\u2019habitation ne reste pas unique (i.e. si l\u2019unicit\u00e9 est rencontr\u00e9e au moment de la conclusion du cr\u00e9dit, mais pas apr\u00e8s), l\u2019avantage est r\u00e9duit et port\u00e9 \u00e0 celui existant \u00e0 partir de la 11\u00e8me ann\u00e9e (50%).&lt;\/p&gt;&quot;,&quot;content_text&quot;:&quot;Les conditions d\u2019octroi reprises ci-dessous sont cumulatives :\nUn emprunt relatif au financement de l\u2019habitation, d\u2019une dur\u00e9e minimale de 10 ans, couvert par une inscription hypoth\u00e9caire ;\nAcquisition d\u2019un bien immobilier (habitation) dont il faut devenir propri\u00e9taire m\u00eame \u00e0 titre partiel, attest\u00e9e par la passation d\u2019un acte de propri\u00e9t\u00e9 en principe au 31 d\u00e9cembre de l\u2019ann\u00e9e de la conclusion du cr\u00e9dit. Un emprunt hypoth\u00e9caire contract\u00e9 pour financer des travaux (1) n\u2019ouvre donc le droit au Ch\u00e8que Habitat que s\u2019ils sont \u00ab concomitants \u00bb \u00e0 l\u2019achat (2) ;(1)(2) dans ce cas, voyez le m\u00e9canisme de l&#039;Accesspack et des pr\u00eats \u00e0 taux z\u00e9ro appel\u00e9s R\u00e9nopack et R\u00e9nopr\u00eat sur le site de la SWCS\u00a0 ou du FLW si vous avez 3 enfants et plus ;\nL\u2019habitation doit \u00eatre propre et le rester. Sur le plan fiscal, une habitation est consid\u00e9r\u00e9e comme \u00abpropre\u00bb si elle est occup\u00e9e personnellement par son propri\u00e9taire. Des exceptions existent et sont pr\u00e9vues par la l\u00e9gislation fiscale (ex : travaux, \u2026) ;\nL\u2019habitation doit \u00eatre unique. La notion habitation \u00ab unique \u00bb signifie que le propri\u00e9taire ne peut pas, \u00e0 c\u00f4t\u00e9 de l\u2019habitation en question, poss\u00e9der d\u2019autres habitations qu\u2019il soit (co)propri\u00e9taire, nu-propri\u00e9taire, usufruitier, superficiaire, emphyt\u00e9ote ou possesseur. Le moment auquel s\u2019appr\u00e9cie le caract\u00e8re unique de l\u2019habitation est le 31 d\u00e9cembre de l\u2019ann\u00e9e de la conclusion du cr\u00e9dit. Cependant, il existe des exceptions. Conform\u00e9ment \u00e0 la l\u00e9gislation fiscale actuelle, il n\u2019est pas tenu compte :\nd\u2019une autre habitation dont vous \u00eates copropri\u00e9taire, nu-propri\u00e9taire ou usufruitier par h\u00e9ritage ;\nd\u2019une autre habitation si celle-ci est mise en vente au 31 d\u00e9cembre de l\u2019ann\u00e9e de conclusion du cr\u00e9dit pour autant qu\u2019elle soit effectivement vendue au plus tard le 31 d\u00e9cembre de l\u2019ann\u00e9e suivante.\nPar ailleurs, dans le nouveau dispositif, les cas d\u2019exceptions pr\u00e9cit\u00e9s sont \u00e9tendus : on peut \u00e9galement ne pas tenir compte des habitations lou\u00e9es via une AIS ou une SLSP.\nSi l\u2019habitation ne reste pas unique (i.e. si l\u2019unicit\u00e9 est rencontr\u00e9e au moment de la conclusion du cr\u00e9dit, mais pas apr\u00e8s), l\u2019avantage est r\u00e9duit et port\u00e9 \u00e0 celui existant \u00e0 partir de la 11\u00e8me ann\u00e9e (50%).&quot;,&quot;part_type&quot;:&quot;sous_partie&quot;,&quot;assistance_id&quot;:4,&quot;order&quot;:3,&quot;created_at&quot;:&quot;2022-09-05T13:26:29.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-02-08T15:07:26.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;site_id&quot;:3},{&quot;id&quot;:23,&quot;title&quot;:&quot;Modalit\u00e9s d&#039;octroi&quot;,&quot;content_html&quot;:&quot;&lt;ol&gt;\n&lt;li style=\&quot;text-align: justify;\&quot;&gt;Octroi d\u2019un avantage fiscal, individualis\u00e9, sous la forme d\u2019une &lt;strong&gt;r\u00e9duction d\u2019imp\u00f4t convertible en cr\u00e9dit d\u2019imp\u00f4t&lt;\/strong&gt; ;&lt;\/li&gt;\n&lt;li style=\&quot;text-align: justify;\&quot;&gt;L\u2019avantage fiscal est accord\u00e9 &lt;strong&gt;d\u00e8s l\u2019exercice d\u2019imposition qui suit l\u2019ann\u00e9e de conclusion du cr\u00e9dit&lt;\/strong&gt; ;&lt;\/li&gt;\n&lt;li style=\&quot;text-align: justify;\&quot;&gt;Dur\u00e9e de l\u2019avantage : &lt;strong&gt;20 ans maximum&lt;\/strong&gt;. Le nombre de r\u00e9ductions (ou cr\u00e9dits) d\u2019imp\u00f4t auquel a droit le contribuable au cours de sa vie est fix\u00e9 \u00e0 maximum 20 r\u00e9ductions (= 20 \u00ab droits de tirage \u00bb) ;&lt;br \/&gt;Si la condition de propri\u00e9t\u00e9 n\u2019est plus rencontr\u00e9e, le droit est suspendu.&lt;br \/&gt;&lt;span style=\&quot;text-decoration: underline;\&quot;&gt;Exemple&lt;\/span&gt; : Thomas devient propri\u00e9taire. Il b\u00e9n\u00e9fice annuellement de l\u2019avantage. La 4\u00e8me ann\u00e9e, il n\u2019est plus propri\u00e9taire. La 5\u00e8me ann\u00e9e, il redevient propri\u00e9taire. Il r\u00e9cup\u00e8re son droit pour 17 ann\u00e9es, soit 20 droits de tirage au total.&lt;\/li&gt;\n&lt;li style=\&quot;text-align: justify;\&quot;&gt;&lt;strong&gt;Montants&lt;\/strong&gt; : l\u2019avantage n\u2019est octroy\u00e9 que pour les revenus inf\u00e9rieurs \u00e0 81.000 \u20ac (&lt;em&gt;index\u00e9s \u00e0 105.503 \u20ac en 2025, exercice d&#039;imposition 2026&lt;\/em&gt;). Par revenu, on entend ici le revenu net imposable (il se compose des revenus de biens immobiliers, des revenus de capitaux et biens mobiliers, des revenus nets professionnels et des revenus divers, d\u00e9ductions faites des charges professionnelles et des rentes alimentaires et constitue la base de calcul de l\u2019imp\u00f4t) ;&lt;\/li&gt;\n&lt;li style=\&quot;text-align: justify;\&quot;&gt;L\u2019avantage est compos\u00e9 de &lt;strong&gt;deux parties&lt;\/strong&gt; :&lt;\/li&gt;\n&lt;\/ol&gt;\n&lt;ul style=\&quot;text-align: justify;\&quot;&gt;\n&lt;li style=\&quot;list-style-type: none;\&quot;&gt;\n&lt;ul&gt;\n&lt;li&gt;un &lt;strong&gt;montant forfaitaire&lt;\/strong&gt; \u00ab enfant \u00bb, \u00e0 savoir 125 \u20ac\/enfant. Ce montant est accord\u00e9 1 seule fois par enfant et est r\u00e9parti entre les 2 parents ;&lt;\/li&gt;\n&lt;li&gt;un &lt;strong&gt;montant variable&lt;\/strong&gt;, fonction des revenus du contribuable.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p style=\&quot;padding-left: 80px; text-align: justify;\&quot;&gt;Le montant variable est d\u00e9termin\u00e9 de la mani\u00e8re suivante : le montant variable de r\u00e9f\u00e9rence (montant variable maximal = MVM = &lt;strong&gt;1520 \u20ac&lt;\/strong&gt;) est octroy\u00e9 pour les revenus nets imposables allant jusque 21.000 \u20ac (&lt;em&gt;index\u00e9s \u00e0 27.353 \u20ac en 2025, exercice d&#039;imposition 2026&lt;\/em&gt;) ;&lt;br \/&gt;Pour les revenus nets imposables sup\u00e9rieurs \u00e0 ce montant, l\u2019exc\u00e9dent par rapport \u00e0 21.000 \u20ac (&lt;em&gt;index\u00e9s \u00e0 27.353 \u20ac en 2025, exercice d&#039;imposition 2026&lt;\/em&gt;) est multipli\u00e9 par un coefficient (1,275%) et d\u00e9duit du montant variable maximal (=MVM)&lt;\/p&gt;\n&lt;p style=\&quot;padding-left: 80px; text-align: justify;\&quot;&gt;&lt;span style=\&quot;text-decoration: underline;\&quot;&gt;Exemple&lt;\/span&gt; : Eliane devient propri\u00e9taire mais son revenu est sup\u00e9rieur au plafond les trois premi\u00e8res ann\u00e9es. Son avantage est de 0\u20ac pendant ces trois premi\u00e8res ann\u00e9es. La 4\u00e8me ann\u00e9e et jusque la 20\u00e8me ann\u00e9e, son revenu est de 65.000 \u20ac. Elle obtient pendant 17 ans un avantage calcul\u00e9 en fonction de ce revenu de 65.000 \u20ac.&lt;\/p&gt;\n&lt;p style=\&quot;padding-left: 40px; text-align: justify;\&quot;&gt;L\u2019avantage est &lt;strong&gt;individuel&lt;\/strong&gt;. L\u2019avantage de Monsieur va donc s\u2019ajouter \u00e0 celui de Madame si les conditions pr\u00e9cit\u00e9es sont rencontr\u00e9es.&lt;\/p&gt;\n&lt;p style=\&quot;padding-left: 40px; text-align: justify;\&quot;&gt;L\u2019avantage tel que d\u00e9termin\u00e9 ci-dessus est octroy\u00e9 les 10 premi\u00e8res fois. &lt;strong&gt;Il est r\u00e9duit de 50% les 10 derni\u00e8res fois&lt;\/strong&gt; ;&lt;\/p&gt;\n&lt;p style=\&quot;padding-left: 40px; text-align: justify;\&quot;&gt;Le montant de l\u2019avantage est &lt;strong&gt;limit\u00e9 \u00e0 la somme des remboursements de l\u2019ann\u00e9e en int\u00e9r\u00eats et capital et de la prime d\u2019assurance vie&lt;\/strong&gt; individuelle li\u00e9e \u00e0 l\u2019emprunt hypoth\u00e9caire ;&lt;\/p&gt;\n&lt;p style=\&quot;padding-left: 80px; text-align: justify;\&quot;&gt;&lt;span style=\&quot;text-decoration: underline;\&quot;&gt;Exemple&lt;\/span&gt; : Isol\u00e9, Jean-Claude emprunte (emprunt hypoth\u00e9caire) 50.000 \u20ac. Son annuit\u00e9 pour un pr\u00eat de 30 ans \u00e0 du 4% est de 2.840 \u20ac. Son avantage sera complet.&lt;br \/&gt;&lt;span style=\&quot;text-decoration: underline;\&quot;&gt;Exemple&lt;\/span&gt; : Isol\u00e9, Ren\u00e9 emprunte 10.000 \u20ac (emprunt hypoth\u00e9caire) et 40.000 \u20ac (mandat hypoth\u00e9caire). Son annuit\u00e9 pour un pr\u00eat de 10.000 \u20ac de 30 ans \u00e0 du 4% est de 568 \u20ac. Son avantage sera limit\u00e9 \u00e0 568 \u20ac.&lt;\/p&gt;\n&lt;p style=\&quot;padding-left: 40px; text-align: justify;\&quot;&gt;L\u2019octroi de l\u2019avantage est ind\u00e9pendant du b\u00e9n\u00e9fice ou pas d\u2019un r\u00e9gime ant\u00e9rieur, mais cela suppose le respect de l\u2019ensemble des conditions.&lt;\/p&gt;\n&lt;p style=\&quot;padding-left: 40px; text-align: justify;\&quot;&gt;Il est proc\u00e9d\u00e9 \u00e0 une v\u00e9rification du respect des conditions annuellement.&lt;\/p&gt;&quot;,&quot;content_text&quot;:&quot;Octroi d\u2019un avantage fiscal, individualis\u00e9, sous la forme d\u2019une r\u00e9duction d\u2019imp\u00f4t convertible en cr\u00e9dit d\u2019imp\u00f4t ;\nL\u2019avantage fiscal est accord\u00e9 d\u00e8s l\u2019exercice d\u2019imposition qui suit l\u2019ann\u00e9e de conclusion du cr\u00e9dit ;\nDur\u00e9e de l\u2019avantage : 20 ans maximum. Le nombre de r\u00e9ductions (ou cr\u00e9dits) d\u2019imp\u00f4t auquel a droit le contribuable au cours de sa vie est fix\u00e9 \u00e0 maximum 20 r\u00e9ductions (= 20 \u00ab droits de tirage \u00bb) ;Si la condition de propri\u00e9t\u00e9 n\u2019est plus rencontr\u00e9e, le droit est suspendu.Exemple : Thomas devient propri\u00e9taire. Il b\u00e9n\u00e9fice annuellement de l\u2019avantage. La 4\u00e8me ann\u00e9e, il n\u2019est plus propri\u00e9taire. La 5\u00e8me ann\u00e9e, il redevient propri\u00e9taire. Il r\u00e9cup\u00e8re son droit pour 17 ann\u00e9es, soit 20 droits de tirage au total.\nMontants : l\u2019avantage n\u2019est octroy\u00e9 que pour les revenus inf\u00e9rieurs \u00e0 81.000 \u20ac (index\u00e9s \u00e0 105.503 \u20ac en 2025, exercice d&#039;imposition 2026). Par revenu, on entend ici le revenu net imposable (il se compose des revenus de biens immobiliers, des revenus de capitaux et biens mobiliers, des revenus nets professionnels et des revenus divers, d\u00e9ductions faites des charges professionnelles et des rentes alimentaires et constitue la base de calcul de l\u2019imp\u00f4t) ;\nL\u2019avantage est compos\u00e9 de deux parties :\nun montant forfaitaire \u00ab enfant \u00bb, \u00e0 savoir 125 \u20ac\/enfant. Ce montant est accord\u00e9 1 seule fois par enfant et est r\u00e9parti entre les 2 parents ;\nun montant variable, fonction des revenus du contribuable.\nLe montant variable est d\u00e9termin\u00e9 de la mani\u00e8re suivante : le montant variable de r\u00e9f\u00e9rence (montant variable maximal = MVM = 1520 \u20ac) est octroy\u00e9 pour les revenus nets imposables allant jusque 21.000 \u20ac (index\u00e9s \u00e0 27.353 \u20ac en 2025, exercice d&#039;imposition 2026) ;Pour les revenus nets imposables sup\u00e9rieurs \u00e0 ce montant, l\u2019exc\u00e9dent par rapport \u00e0 21.000 \u20ac (index\u00e9s \u00e0 27.353 \u20ac en 2025, exercice d&#039;imposition 2026) est multipli\u00e9 par un coefficient (1,275%) et d\u00e9duit du montant variable maximal (=MVM)\nExemple : Eliane devient propri\u00e9taire mais son revenu est sup\u00e9rieur au plafond les trois premi\u00e8res ann\u00e9es. Son avantage est de 0\u20ac pendant ces trois premi\u00e8res ann\u00e9es. La 4\u00e8me ann\u00e9e et jusque la 20\u00e8me ann\u00e9e, son revenu est de 65.000 \u20ac. Elle obtient pendant 17 ans un avantage calcul\u00e9 en fonction de ce revenu de 65.000 \u20ac.\nL\u2019avantage est individuel. L\u2019avantage de Monsieur va donc s\u2019ajouter \u00e0 celui de Madame si les conditions pr\u00e9cit\u00e9es sont rencontr\u00e9es.\nL\u2019avantage tel que d\u00e9termin\u00e9 ci-dessus est octroy\u00e9 les 10 premi\u00e8res fois. Il est r\u00e9duit de 50% les 10 derni\u00e8res fois ;\nLe montant de l\u2019avantage est limit\u00e9 \u00e0 la somme des remboursements de l\u2019ann\u00e9e en int\u00e9r\u00eats et capital et de la prime d\u2019assurance vie individuelle li\u00e9e \u00e0 l\u2019emprunt hypoth\u00e9caire ;\nExemple : Isol\u00e9, Jean-Claude emprunte (emprunt hypoth\u00e9caire) 50.000 \u20ac. Son annuit\u00e9 pour un pr\u00eat de 30 ans \u00e0 du 4% est de 2.840 \u20ac. Son avantage sera complet.Exemple : Isol\u00e9, Ren\u00e9 emprunte 10.000 \u20ac (emprunt hypoth\u00e9caire) et 40.000 \u20ac (mandat hypoth\u00e9caire). Son annuit\u00e9 pour un pr\u00eat de 10.000 \u20ac de 30 ans \u00e0 du 4% est de 568 \u20ac. Son avantage sera limit\u00e9 \u00e0 568 \u20ac.\nL\u2019octroi de l\u2019avantage est ind\u00e9pendant du b\u00e9n\u00e9fice ou pas d\u2019un r\u00e9gime ant\u00e9rieur, mais cela suppose le respect de l\u2019ensemble des conditions.\nIl est proc\u00e9d\u00e9 \u00e0 une v\u00e9rification du respect des conditions annuellement.&quot;,&quot;part_type&quot;:&quot;sous_partie&quot;,&quot;assistance_id&quot;:4,&quot;order&quot;:4,&quot;created_at&quot;:&quot;2022-09-05T13:26:29.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-01-13T10:44:55.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;site_id&quot;:3},{&quot;id&quot;:24,&quot;title&quot;:&quot;Calcul&quot;,&quot;content_html&quot;:&quot;&lt;p style=\&quot;text-align: justify;\&quot;&gt;&lt;span style=\&quot;text-decoration: underline;\&quot;&gt;Rappel :&lt;\/span&gt;&lt;\/p&gt;\n&lt;ul style=\&quot;text-align: justify;\&quot;&gt;\n&lt;li&gt;L\u2019avantage est\u00a0&lt;strong&gt;individuel&lt;\/strong&gt;. Son montant qui va varier en fonction des revenus est bas\u00e9 sur un calcul dont les r\u00e9sultats sont repris dans un\u00a0tableau.&lt;\/li&gt;\n&lt;li&gt;&lt;strong&gt;Le montant variable maximal est de 1520 \u20ac, hors forfait par enfant&lt;\/strong&gt;. Il est octroy\u00e9 pour les revenus nets imposables allant jusque 21 000 \u20ac (&lt;em&gt;index\u00e9s \u00e0 27.353 \u20ac en 2025, exercice d&#039;imposition 2026&lt;\/em&gt;). Pour les revenus sup\u00e9rieurs \u00e0 ce montant, l\u2019exc\u00e9dent par rapport \u00e0 21 000 \u20ac (&lt;em&gt;index\u00e9s \u00e0 27.353 \u20ac en 2025, exercice d&#039;imposition 2026&lt;\/em&gt;) est multipli\u00e9 par un coefficient (1,275 %) et d\u00e9duit du montant variable maximal.&lt;\/li&gt;\n&lt;li&gt;Si vous avez des enfants, &lt;strong&gt;on ajoutera 125 \u20ac par enfant&lt;\/strong&gt;. Ce montant est accord\u00e9 une fois pour les deux parents.&lt;\/li&gt;\n&lt;li&gt;Pour les revenus nets imposables sup\u00e9rieurs \u00e0 81.000 \u20ac (index\u00e9s \u00e0 105.503 \u20ac en 2025, exercice d&#039;imposition 2026), le montant de l\u2019avantage est de z\u00e9ro.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;&lt;br \/&gt;Voici comment faire &lt;strong&gt;votre calcul&lt;\/strong&gt;. Munissez-vous pour ce faire de vos revenus nets imposables figurant sur votre avertissement extrait de r\u00f4le\u00a0(et de ceux des personnes ayant conclu le pr\u00eat avec vous, le cas \u00e9ch\u00e9ant) et du tableau\u00a0:&lt;\/p&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;Calcul du montant variable pour X\u00a0:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li style=\&quot;text-align: justify;\&quot;&gt;Revenus nets imposables de X = 35.000 \u20ac.&lt;\/li&gt;\n&lt;li style=\&quot;text-align: justify;\&quot;&gt;Vous effectuez le calcul suivant :&lt;br \/&gt;1520 - ((diff\u00e9rence entre votre revenu, soit 35.000 \u20ac et 27.353 \u20ac) x 1,275%), ce qui donne :&lt;br \/&gt;1520-((30.000 - 27.353) x 1,275%) = 1.422,50 \u20ac&lt;\/li&gt;\n&lt;li style=\&quot;text-align: justify;\&quot;&gt;Si vous avez un partenaire, vous refaites le m\u00eame calcul en tenant compte de ses revenus net imposables&lt;\/li&gt;\n&lt;li style=\&quot;text-align: justify;\&quot;&gt;Vous ajoutez au r\u00e9sultat le\u00a0montant forfaitaire\u00a0de 125 \u20ac par enfant, une seul fois.&lt;\/li&gt;\n&lt;\/ul&gt;&quot;,&quot;content_text&quot;:&quot;Rappel :\nL\u2019avantage est\u00a0individuel. Son montant qui va varier en fonction des revenus est bas\u00e9 sur un calcul dont les r\u00e9sultats sont repris dans un\u00a0tableau.\nLe montant variable maximal est de 1520 \u20ac, hors forfait par enfant. Il est octroy\u00e9 pour les revenus nets imposables allant jusque 21 000 \u20ac (index\u00e9s \u00e0 27.353 \u20ac en 2025, exercice d&#039;imposition 2026). Pour les revenus sup\u00e9rieurs \u00e0 ce montant, l\u2019exc\u00e9dent par rapport \u00e0 21 000 \u20ac (index\u00e9s \u00e0 27.353 \u20ac en 2025, exercice d&#039;imposition 2026) est multipli\u00e9 par un coefficient (1,275 %) et d\u00e9duit du montant variable maximal.\nSi vous avez des enfants, on ajoutera 125 \u20ac par enfant. Ce montant est accord\u00e9 une fois pour les deux parents.\nPour les revenus nets imposables sup\u00e9rieurs \u00e0 81.000 \u20ac (index\u00e9s \u00e0 105.503 \u20ac en 2025, exercice d&#039;imposition 2026), le montant de l\u2019avantage est de z\u00e9ro.\nVoici comment faire votre calcul. Munissez-vous pour ce faire de vos revenus nets imposables figurant sur votre avertissement extrait de r\u00f4le\u00a0(et de ceux des personnes ayant conclu le pr\u00eat avec vous, le cas \u00e9ch\u00e9ant) et du tableau\u00a0:\nCalcul du montant variable pour X\u00a0:\nRevenus nets imposables de X = 35.000 \u20ac.\nVous effectuez le calcul suivant :1520 - ((diff\u00e9rence entre votre revenu, soit 35.000 \u20ac et 27.353 \u20ac) x 1,275%), ce qui donne :1520-((30.000 - 27.353) x 1,275%) = 1.422,50 \u20ac\nSi vous avez un partenaire, vous refaites le m\u00eame calcul en tenant compte de ses revenus net imposables\nVous ajoutez au r\u00e9sultat le\u00a0montant forfaitaire\u00a0de 125 \u20ac par enfant, une seul fois.&quot;,&quot;part_type&quot;:&quot;sous_partie&quot;,&quot;assistance_id&quot;:4,&quot;order&quot;:5,&quot;created_at&quot;:&quot;2022-09-05T13:26:29.000000Z&quot;,&quot;updated_at&quot;:&quot;2026-01-13T10:44:55.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;site_id&quot;:3},{&quot;id&quot;:25,&quot;title&quot;:&quot;Proc\u00e9dure&quot;,&quot;content_html&quot;:&quot;&lt;p style=\&quot;text-align: justify;\&quot;&gt;Si vous avez contract\u00e9 un emprunt hypoth\u00e9caire en 2023 pour acheter-construire votre logement propre et unique, c&#039;est lors de l&#039;exercice d&#039;imposition 2024 que vous devrez d\u00e9clarer (via la d\u00e9claration de revenus) celui-ci pour pouvoir b\u00e9n\u00e9ficier du Ch\u00e8que Habitat, pour autant bien entendu que toutes les conditions soient r\u00e9unies.&lt;\/p&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;L\u2019arr\u00eat\u00e9 du 24 novembre 2016 d\u00e9termine les attestations n\u00e9cessaires pour l\u2019octroi de l&#039;avantage fiscal pour l\u2019acquisition de l\u2019habitation propre :&lt;\/p&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;&lt;span style=\&quot;text-decoration: underline;\&quot;&gt;A\/ en ce qui concerne les int\u00e9r\u00eats et les sommes affect\u00e9es \u00e0 l\u2019amortissement ou \u00e0 la reconstitution de l\u2019emprunt hypoth\u00e9caire&lt;\/span&gt;\u00a0:&lt;\/p&gt;\n&lt;ul style=\&quot;text-align: justify;\&quot;&gt;\n&lt;li&gt;Une attestation de base unique par laquelle l\u2019institution qui a octroy\u00e9 l\u2019emprunt communique les \u00e9l\u00e9ments qui d\u00e9montrent que le contrat d\u2019emprunt peut \u00eatre pris en consid\u00e9ration ;&lt;\/li&gt;\n&lt;li&gt;Une attestation de paiement annuelle par laquelle l\u2019institution communique le montant des paiements effectu\u00e9s par le contribuable durant la p\u00e9riode imposable.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p style=\&quot;text-align: justify;\&quot;&gt;&lt;span style=\&quot;text-decoration: underline;\&quot;&gt;B\/ en ce qui concerne les primes d\u2019assurance-vie&lt;\/span&gt;\u00a0:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li style=\&quot;text-align: justify;\&quot;&gt;Une attestation de base unique par laquelle l\u2019assureur communique les \u00e9l\u00e9ments qui d\u00e9montrent que le contrat d\u2019assurance-vie peut \u00eatre pris en consid\u00e9ration ;&lt;\/li&gt;\n&lt;li style=\&quot;text-align: justify;\&quot;&gt;Une attestation de paiement annuelle par laquelle l\u2019assureur communique le montant des primes pay\u00e9es par le contribuable durant la p\u00e9riode imposable.&lt;\/li&gt;\n&lt;\/ul&gt;&quot;,&quot;content_text&quot;:&quot;Si vous avez contract\u00e9 un emprunt hypoth\u00e9caire en 2023 pour acheter-construire votre logement propre et unique, c&#039;est lors de l&#039;exercice d&#039;imposition 2024 que vous devrez d\u00e9clarer (via la d\u00e9claration de revenus) celui-ci pour pouvoir b\u00e9n\u00e9ficier du Ch\u00e8que Habitat, pour autant bien entendu que toutes les conditions soient r\u00e9unies.\nL\u2019arr\u00eat\u00e9 du 24 novembre 2016 d\u00e9termine les attestations n\u00e9cessaires pour l\u2019octroi de l&#039;avantage fiscal pour l\u2019acquisition de l\u2019habitation propre :\nA\/ en ce qui concerne les int\u00e9r\u00eats et les sommes affect\u00e9es \u00e0 l\u2019amortissement ou \u00e0 la reconstitution de l\u2019emprunt hypoth\u00e9caire\u00a0:\nUne attestation de base unique par laquelle l\u2019institution qui a octroy\u00e9 l\u2019emprunt communique les \u00e9l\u00e9ments qui d\u00e9montrent que le contrat d\u2019emprunt peut \u00eatre pris en consid\u00e9ration ;\nUne attestation de paiement annuelle par laquelle l\u2019institution communique le montant des paiements effectu\u00e9s par le contribuable durant la p\u00e9riode imposable.\nB\/ en ce qui concerne les primes d\u2019assurance-vie\u00a0:\nUne attestation de base unique par laquelle l\u2019assureur communique les \u00e9l\u00e9ments qui d\u00e9montrent que le contrat d\u2019assurance-vie peut \u00eatre pris en consid\u00e9ration ;\nUne attestation de paiement annuelle par laquelle l\u2019assureur communique le montant des primes pay\u00e9es par le contribuable durant la p\u00e9riode imposable.&quot;,&quot;part_type&quot;:&quot;sous_partie&quot;,&quot;assistance_id&quot;:4,&quot;order&quot;:6,&quot;created_at&quot;:&quot;2022-09-05T13:26:29.000000Z&quot;,&quot;updated_at&quot;:&quot;2023-10-13T13:48:34.000000Z&quot;,&quot;deleted_at&quot;:null,&quot;site_id&quot;:3},{&quot;id&quot;:26,&quot;title&quot;:&quot;Contact&quot;,&quot;content_html&quot;:&quot;&lt;p&gt;Au SPW Logement, dans les &lt;a class=\&quot;article-link\&quot; title=\&quot;Info-Conseils Logement\&quot; href=\&quot;\/fr\/page\/info-conseils-logement\&quot;&gt;Info-Conseils Logement&lt;\/a&gt; et dans les &lt;a class=\&quot;article-link\&quot; title=\&quot;Les Espaces Wallonie [ce lien ouvre une nouvelle fen\u00eatre]\&quot; href=\&quot;https:\/\/www.wallonie.be\/fr\/les-espaces-wallonie\&quot; target=\&quot;_blank\&quot; rel=\&quot;noopener\&qu
