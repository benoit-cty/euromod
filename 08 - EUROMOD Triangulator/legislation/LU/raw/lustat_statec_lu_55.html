 current selection ({totalCells, number} table cells) is above the defined limit ({cellsLimit, number}) resulting in an incomplete table.{br}All selected data points can still be downloaded in tabular text (CSV).","incomplete.vis.data.total.limit":"Your current selection ({total, number} data points) is above the defined limit ({cellsLimit, number}) resulting in an incomplete {type, select, table {table} other {chart}}.{br}All selected data points can still be downloaded in tabular text (CSV).","it":"Italiano","km":"ភាសារខ្មែរ","log.error.sdmx.404":"There is no data available.","log.error.sdmx.40x":"You are not permitted to see this data. Please try again after logging in with another account.","log.error.sdmx.invalid.space":"The space \u003cb\u003e{space}\u003c/b\u003e is invalid.","log.error.sdmx.xxx":"Whoops, something went wrong on our side. We are working to solve this. Please try again later.","metadata.advanced.attributes":"Data Characteristics","metadata.collapse.all":"Collapse all","metadata.download":"Download the selection in CSV","metadata.download.csv.all":"Unfiltered reference information in tabular text (CSV)","metadata.expand.all":"Expand all","metadata.information.title":"Information","metadata.no.value":"[Information is not available in the current language]","microdata.count":"{count} microdata total","microdata.download.csv.all":"Unfiltered microdata in tabular text (CSV)","microdata.download.csv.selection":"Filtered microdata in tabular text (CSV)","microdata.download.excel.selection":"Microdata table in Excel","microdata.title":"Microdata for {label}","microdata.value":"Value","nl":"Nederlands","ru":"русский","scopelist.selection.current":"Entire currently displayed list","scopelist.selection.level":"Entire hierarchy level","scopelist.selection.title":"Bulk selection","sdmx.data.false":"No","sdmx.data.true":"Yes","share.action":"Request URL and embed code","share.disclaimer":"To share and embed our content safely, we will send you the necessary information by email. Your email address is only used to enable you to access this service, and will be protected consistent with our {link}.","share.error.message":"Something went wrong on our side","share.error.title":"Error","share.latest":"Use most up-to-date data within the time period defined","share.mail":"Your email address (required)","share.policy.label":"privacy policy","share.policy.link":"https://www.oecd.org/privacy/","share.snapshot":"Use snapshot of data (data will not change even if updated on the site)","share.success.message":"We will send you the requested content shortly","share.success.title":"Thank you!","share.title":"Shared data view options:","space.auth.anonymous":"Connect anonymously instead","space.auth.failed":"Unauthorized: please enter a valid username and password","space.auth.header":"Login to {space}","space.auth.login":"Login","space.auth.password":"Password","space.auth.user":"Username","th":"ภาษาไทย","used.filters.reducing":"Items","user.login":"Log in","user.logout":"Log out","viewer.guidance.bar":"\u003cb\u003eAll columns are grey and cannot be distinguished?\u003c/b\u003e{br}Columns are only coloured if especially highlighted, otherwise their purpose is to provide a general size overview of all the categories. Use the highlight feature under the 'Customise' menu to choose the columns for which you would like to apply colours. There is a predefined colour sequence (maximum 8 repeated colours) thus the order of the highlight selection is significant.{br}{br}\u003cb\u003eThe columns are not labelled?\u003c/b\u003e{br}Columns are only labelled if there is enough space for those labels. The minimum required vertical space for labels is 50% of the chart size. Increase the chart height until labels are displayed. Also, sometimes the horizontal space is insufficient, thus please also try increasing the chart width. You'll find these options under the 'Customise' menu.{br}{br}\u003cb\u003eThe columns represent time periods but they are not ordered chronologically?\u003c/b\u003e{br}The bar chart is being used to compare the statistical values of different categories, and in order to ease this comparison, columns are always ordered ascending by the statistical values. If you intent to visualise a chronological trend then use the timeline chart instead. Note that the stacked bar chart (with only one variable per bar) would be another alternative if columns are absolutely required.{br}{br}\u003cb\u003eSeveral dimensions are combined per bar?\u003c/b\u003e{br}If your selection varies for more than one of the dimensions, then the columns will represent all possible combinations of the selected dimension items. If you want to compare the values of only one dimension than make sure that all other dimensions have single selections.{br}{br}\u003cb\u003eThe columns do not contain the desired items?\u003c/b\u003e{br}Make sure to include in your selection only the required dimension items.{br}{br}\u003cb\u003eThe chart doesn't have the desired size or axis scaling?\u003c/b\u003e{br}Use the various chart customisation options that you'll find under the 'Customise' menu.","viewer.guidance.choro":"\u003cb\u003eThe map is not generated and you see a message 'There is no data for the current selection. Please change the selection.'?\u003c/b\u003e{br}Maps need data covering at least 1 data point. Check and increase the currently selected dimension items.{br}{br}\u003cb\u003eThe map is not showing the intended variable?\u003c/b\u003e{br}Maps need exactly 1 data point per map object. Adapt the currently selected dimension items. Available data points can be checked with the 'Table' tab.{br}{br}\u003cb\u003eThe chart doesn't have the desired size?\u003c/b\u003e{br}Use the chart size customisation options that you'll find under the 'Customise' menu. Note that the zooming scale is currently not customisable.{br}{br}\u003cb\u003eThe chart doesn't have the desired colour scale?\u003c/b\u003e{br}Unfortunately, the colour scale is currently not customisable.","viewer.guidance.hsymbol":"\u003cb\u003eThe symbol series do not contain the desired items?\u003c/b\u003e{br}Use the 'Customise' menu to choose the dimension as 'Chart series (dimension for symbols)' that contains the items to be displayed as symbol series.{br}{br}\u003cb\u003eAll symbol series are grey and cannot be distinguished?\u003c/b\u003e{br}Symbol series are only coloured if especially highlighted, otherwise their purpose is to provide a general overview of all the values. Use the highlight feature under the 'Customise' menu to choose the symbol series for which you would like to apply colours. There is a predefined colour sequence (maximum 8 repeated colours) thus the order of the highlight selection is significant.{br}{br}\u003cb\u003eThe symbol series are not labelled?\u003c/b\u003e{br}Symbol series are only labelled if there is enough space for those labels. Increase the chart height until labels are displayed or reduce the selection. Also, sometimes the horizontal space is insufficient, thus please also try increasing the chart width. You'll find these options under the 'Customise' menu.{br}{br}\u003cb\u003eThe chart is not generated and you see a message 'There is no data for the current selection. Please change the selection.'?\u003c/b\u003e{br}Make sure to have a selection that includes at least 2 data points. You can check data availability using the 'Table' tab.{br}{br}\u003cb\u003eSeveral dimensions are combined per symbol series?\u003c/b\u003e{br}If your selection varies for more than two of the dimensions, then the symbol series will represent all possible combinations of the selected dimension items. If you want to compare the symbol series of only one dimension than make sure that all other dimensions have single selections.{br}{br}\u003cb\u003eThe chart doesn't have the desired size or axis scaling?\u003c/b\u003e{br}Use the various chart customisation options that you'll find under the 'Customise' menu.","viewer.guidance.row":"\u003cb\u003eAll rows are grey and cannot be distinguished?\u003c/b\u003e{br}Rows are only coloured if especially highlighted, otherwise their purpose is to provide a general size overview of all the categories. Use the highlight feature under the 'Customise' menu to choose the rows for which you would like to apply colours. There is a predefined colour sequence (maximum 8 repeated colours) thus the order of the highlight selection is significant.{br}{br}\u003cb\u003eThe rows are not labelled?\u003c/b\u003e{br}Rows are only labelled if there is enough space for those labels. Increase the chart height until labels are displayed or reduce the selection. Also, sometimes the horizontal space is insufficient, thus please also try increasing the chart width. You'll find these options under the 'Customise' menu.{br}{br}\u003cb\u003eThe chart is not generated and you see a message 'There is no data for the current selection. Please change the selection.'?\u003c/b\u003e or \u003cb\u003eNo rows are shown?\u003c/b\u003e{br}Make sure to have a selection that includes at least 2 data points. You can check data availability using the 'Table' tab.{br}{br}\u003cb\u003eSeveral dimensions are combined per row?\u003c/b\u003e{br}If your selection varies for more than one of the dimensions, then the rows will represent all possible combinations of the selected dimension items. If you want to compare the values of only one dimension than make sure that all other dimensions have single selections.{br}{br}\u003cb\u003eThe rows do not contain the desired items?\u003c/b\u003e{br}Make sure to include in your selection only the required dimension items.{br}{br}\u003cb\u003eThe chart doesn't have the desired size or axis scaling?\u003c/b\u003e{br}Use the various chart customisation options that you'll find under the 'Customise' menu.","viewer.guidance.scatter":"\u003cb\u003eThe horizontal and/or vertical scatter axes do not contain the desired variables?\u003c/b\u003e{br}Use the 'Customise' menu to choose the dimension as 'Chart series (dimension for X and Y axes)' that contains the to be compared variables (items). Also select the corresponding dimension items to be compared as 'Dimension value for X-axis' and 'Dimension value for Y-axis'.{br}{br}\u003cb\u003eThe chart shows only one dot?\u003c/b\u003e{br}Scatter plot compare the varying values of one (or more) dimension(s) for one item of another dimension against another item of that dimension. Therefore, scatter plot require multiple selections in at least two dimensions. Make sure that your selection is adequate. Use the 'Table' to check also data availability.{br}{br}\u003cb\u003eThe chart is not generated and you see a message 'There is no data for the current selection. Please change the selection.'?\u003c/b\u003e{br}Make sure to have a selection that includes at least 1 data point. You can check data availability using the 'Table' tab.{br}{br}\u003cb\u003eAll dots are grey and cannot be distinguished?\u003c/b\u003e{br}Dots are only coloured if especially highlighted, otherwise their purpose is to provide a general distribution overview allowing to identify the type of relationship between the plotted variables. Use the highlight feature under the 'Customise' menu to choose the dimension items for which you would like to apply colours. There is a predefined colour sequence (maximum 8 repeated colours) thus the order of the highlight selection is significant.{br}{br}\u003cb\u003eThe chart doesn't have the desired size or axis scaling?\u003c/b\u003e{br}Use the various chart customisation options that you'll find under the 'Customise' menu.","viewer.guidance.stacked-bar":"\u003cb\u003eThe stacked columns do not represent the intended categories and variables?\u003c/b\u003e{br}The stacked column chart is being used to compare several statistical values for different categories. Use the 'Customise' menu to choose the dimension used to distinguish the stacked columns as 'Chart series (dimension for X-axis)'. The column segments will represent all possible combinations of the other selected dimension items (with a limitation of 5 segments maximum). Reduce the selection to only two varying dimensions if the segments should represent the items of one single dimension.{br}{br}\u003cb\u003eAll stacked columns are shaded in grey and cannot be distinguished?\u003c/b\u003e{br}Stacked columns are only coloured if especially highlighted, otherwise their purpose is to provide a general size overview for the values of all the categories. Use the highlight feature under the 'Customise' menu to choose the stacked columns for which you would like to apply colours. There is a predefined colour sequence (maximum 8 repeated colours) thus the order of the highlight selection is significant. The shading scheme cannot be changed.{br}{br}\u003cb\u003eThe stacked columns are not labelled?\u003c/b\u003e{br}Stacked columns are only labelled if there is enough space for those labels. The minimum required vertical space for labels is 50% of the chart size. Increase the chart height until labels are displayed. Also, sometimes the horizontal space is insufficient, thus please also try increasing the chart width. You'll find these options under the 'Customise' menu.{br}{br}\u003cb\u003eYou wanted a percentage stacked column chart?\u003c/b\u003e{br}Use the 'Percentage' customisation option that you'll find under the 'Customise' menu. This chart type allows comparing shares across a dimension.{br}{br}\u003cb\u003eThe chart is not generated and you see a message 'There is no data for the current selection. Please change the selection.'?\u003c/b\u003e{br}Stacked column charts need data covering at least 2 data points. Check and increase the currently selected dimension items.{br}{br}\u003cb\u003eThe chart doesn't have the desired size or axis scaling?\u003c/b\u003e{br}Use the various chart customisation options that you'll find under the 'Customise' menu.","viewer.guidance.stacked-row":"\u003cb\u003eThe stacked rows do not represent the intended categories and variables?\u003c/b\u003e{br}The stacked row chart is being used to compare several statistical values for different categories. Use the 'Customise' menu to choose the dimension used to distinguish the stacked rows as 'Chart series (dimension for Y-axis)'. The row segments will represent all possible combinations of the other selected dimension items (with a limitation of 5 segments maximum). Reduce the selection to only two varying dimensions if the segments should represent the items of one single dimension.{br}{br}\u003cb\u003eAll stacked rows are shaded in grey and cannot be distinguished?\u003c/b\u003e{br}Stacked rows are only coloured if especially highlighted, otherwise their purpose is to provide a general size overview for the values of all the categories. Use the highlight feature under the 'Customise' menu to choose the stacked rows for which you would like to apply colours. There is a predefined colour sequence (maximum 8 repeated colours) thus the order of the highlight selection is significant. The shading scheme cannot be changed.{br}{br}\u003cb\u003eThe stacked rows are not labelled?\u003c/b\u003e{br}Stacked rows are only labelled if there is enough space for those labels. The minimum required vertical space for labels is 50% of the chart size. Increase the chart height until labels are displayed. Also, sometimes the horizontal space is insufficient, thus please also try increasing the chart width. You'll find these options under the 'Customise' menu.{br}{br}\u003cb\u003eYou wanted a percentage stacked row chart?\u003c/b\u003e{br}Use the 'Percentage' customisation option that you'll find under the 'Customise' menu. This chart type allows comparing shares across a dimension.{br}{br}\u003cb\u003eThe chart is not generated and you see a message 'There is no data for the current selection. Please change the selection.'?\u003c/b\u003e{br}Stacked row charts need data covering at least 2 data points. Check and increase the currently selected dimension items.{br}{br}\u003cb\u003eThe chart doesn't have the desired size or axis scaling?\u003c/b\u003e{br}Use the various chart customisation options that you'll find under the 'Customise' menu.","viewer.guidance.timeline":"\u003cb\u003eAll lines are grey and cannot be distinguished?\u003c/b\u003e{br} Timelines are only coloured if especially highlighted, otherwise their purpose is to provide a general trend overview of all the timelines. Use the highlight feature under the 'Customise' menu to choose the timelines for which you would like to apply colours. There is a predefined colour sequence (maximum 8 repeated colours) thus the order of the highlight selection is significant.{br}{br}\u003cb\u003eThe lines are not labelled?\u003c/b\u003e{br}Lines are only labelled if especially highlighted. Use the highlight feature under the 'Customise' menu to choose the timelines for which you would like to see labels.{br}{br}\u003cb\u003eThe highlighted timelines do not show dots for values?\u003c/b\u003e{br}Dots on timelines are only shown if there is sufficient horizontal space that allow well distinguishing the dots. Increase the chart width or reduce the time period range selection.{br}{br}\u003cb\u003eSeveral dimensions are combined per timeline?\u003c/b\u003e{br}If, apart the time dimension, your selection varies for more than one of the dimensions, then the timelines will represent all possible combinations of the selected dimension items. If you want to compare the timelines of only one dimension than make sure that all other dimensions have single selections.{br}{br}\u003cb\u003eThe chart is not generated and you see a message 'There is no data for the current selection. Please change the selection.'?\u003c/b\u003e{br}Timeline charts need data covering at least 2 time periods. Check and increase the currently selected time range.{br}{br}\u003cb\u003eThe chart doesn't have the desired size or axis scaling?\u003c/b\u003e{br}Use the various chart customisation options that you'll find under the 'Customise' menu.","viewer.guidance.vsymbol":"\u003cb\u003eThe symbol series do not contain the desired items?\u003c/b\u003e{br}Use the 'Customise' menu to choose the dimension as 'Chart series (dimension for symbols)' that contains the items to be displayed as symbol series.{br}{br}\u003cb\u003eAll symbol series are grey and cannot be distinguished?\u003c/b\u003e{br}Symbol series are only coloured if especially highlighted, otherwise their purpose is to provide a general overview of all the values. Use the highlight feature under the 'Customise' menu to choose the symbol series for which you would like to apply colours. There is a predefined colour sequence (maximum 8 repeated colours) thus the order of the highlight selection is significant.{br}{br}\u003cb\u003eThe symbol series are not labelled?\u003c/b\u003e{br}Symbol series are only labelled if there is enough space for those labels. The minimum required vertical space for labels is 50% of the chart size. Increase the chart height until labels are displayed.  Also, sometimes the horizontal space is insufficient, thus please also try increasing the chart width. You'll find these options under the 'Customise' menu.{br}{br}\u003cb\u003eThe chart is not generated and you see a message 'There is no data for the current selection. Please change the selection.'?\u003c/b\u003e{br}Make sure to have a selection that includes at least 2 data points. You can check data availability using the 'Table' tab.{br}{br}\u003cb\u003eSeveral dimensions are combined per symbol series?\u003c/b\u003e{br}If your selection varies for more than two of the dimensions, then the symbol series will represent all possible combinations of the selected dimension items. If you want to compare the symbol series of only one dimension than make sure that all other dimensions have single selections.{br}{br}\u003cb\u003eThe chart doesn't have the desired size or axis scaling?\u003c/b\u003e{br}Use the various chart customisation options that you'll find under the 'Customise' menu.","viewer.guidances.chart":"You did not get the expected chart?","viewer.guidances.table":{},"vis.data.availability.disabled":"Due to the large size of this dataset, we are not able to indicate unavailability of data for certain filter selections.","vx.config.copyright":"Remove the copyright","vx.config.display.both":"Both","vx.config.display.code":"Identifier","vx.config.display.label":"Name","vx.config.logo":"Remove the logo","vx.config.reset":"Reset","vx.config.source":"Source label","vx.config.subtitle":"Subtitle","vx.config.title":"Title","vx.config.uniq.focus.option":"Timeline","vx.filter.all.selection":"Select All","vx.filter.apply":"Apply","vx.filter.branch.selection":"Whole branch","vx.filter.children.selection":"Item and all items directly below","vx.filter.close":"Cancel","vx.filter.colapse.all":"Collapse All","vx.filter.deselect.all":"Deselect All","vx.filter.expand.all":"Expand All","vx.filter.level.selection":"All items at the same level","vx.filter.selectin.hint":"Did you already know that you can select several items either{br}by holding the mouse button while selecting neighbored items or{br}by holding the 'Shift' key while selecting the last neighbored item or{br}by holding the 'Ctrl' key while selecting the next individual item(s)?","vx.filter.selectin.mode":"Change selection mode","vx.filter.single.selection":"Single item","vx.filters.current.clear":"Clear all","vx.filters.current.title":"Data selected in this dataset with: ","vx.no.data":"There is currently no data available for this dataset. Please try again later.","vx.no.data.selection":"There is no data for the current selection. Please change the selection.","vx.no.map":{},"vx.no.time.data":"A timeline chart cannot be shown because the data has no time dimension.","vx.spotlight.placeholder":"Search by keywords and/or ID (ex: E5100)","vx.spotlight.placeholder.pr nonymous":"Connection anonyme","space.auth.failed":"Non autorisé : veuillez entrer un nom d'utilisateur et un mot de passe valides","space.auth.header":"Se connecter à {space}","space.auth.login":"Se connecter","space.auth.password":"Mot de passe","space.auth.user":"Nom d'utilisateur","th":"ภาษาไทย","used.filters.reducing":"Eléments","user.login":"Se Connecter","user.logout":"Se Déconnecter","viewer.guidance.bar":"\u003cb\u003eUne couleur unique grise ne permet pas la distinction des colonnes ?\u003c/b\u003e{br}Les colonnes ne sont colorées que si elles sont spécialement mises en couleurs, sinon l'objectif est d'obtenir un aperçu général des grandeurs de chaque catégorie. Utilisez la fonction de mise en couleurs dans le menu « Personnaliser » pour choisir les catégories auxquelles vous souhaitez appliquer des couleurs. Il existe une séquence de couleurs prédéfinie (maximum 8 couleurs répétées), donc l'ordre de la sélection des couleurs est significatif.{br}{br}\u003cb\u003eLes étiquettes ne sont pas affichées pour les colonnes ?\u003c/b\u003e{br}Les colonnes ne sont étiquetées que s'il y a suffisamment d'espace pour afficher les étiquettes. L'espace vertical minimum nécessaire pour afficher les étiquettes est 50% de la taille du graphique. Pour les visualiser, augmentez la hauteur du graphique. Si l'espace horizontal est aussi parfois insuffisant, augmentez également la largeur du graphique. Vous trouverez ces options dans le menu « Personnaliser ».{br}{br}\u003cb\u003eLes colonnes représentent des périodes de temps mais elles ne sont pas classées chronologiquement ?\u003c/b\u003e{br}Le graphique est utilisé pour comparer les valeurs statistiques de différentes catégories. Pour faciliter cette comparaison, les colonnes sont toujours ordonnées par ordre croissant des valeurs statistiques. Si vous avez l'intention de visualiser une tendance chronologique, utilisez plutôt la courbe chronologique. Notez que le graphique à colonnes empilées (avec une seule variable par barre) serait une autre alternative si les colonnes sont absolument nécessaires.{br}{br}\u003cb\u003ePlusieurs dimensions sont combinées par barre ?\u003c/b\u003e{br}Si votre sélection varie pour plus d'une des dimensions, les colonnes représenteront toutes les combinaisons possibles des éléments de dimension sélectionnés. Si vous souhaitez comparer les valeurs d'une seule dimension, assurez-vous que toutes les autres dimensions ont des sélections uniques.{br}{br}\u003cb\u003eLes colonnes ne contiennent pas les éléments souhaités ?\u003c/b\u003e{br}Assurez-vous de n'inclure dans votre sélection que les éléments de dimension requis.{br}{br}\u003cb\u003eLe graphique n'a pas la taille ou l'échelle de l'axe souhaitée ?\u003c/b\u003e{br}Utilisez les différentes options de personnalisation des graphiques que vous trouverez dans le menu « Personnaliser ».","viewer.guidance.choro":"\u003cb\u003eLa carte n'est pas générée et vous voyez un message « Il n'y a pas de données pour la sélection actuelle. Veuillez modifier la sélection. » ?\u003c/b\u003e{br}Les cartes ont besoin de données couvrant au moins 1 point de données. Vérifiez et augmentez les éléments de dimension actuellement sélectionnés.{br}{br}\u003cb\u003eLa carte n'affiche pas la variable voulue ?\u003c/b\u003e{br}Les cartes nécessitent exactement 1 point de données par objet cartographique. Adaptez les éléments de dimension actuellement sélectionnés. Les points de données disponibles peuvent être vérifiés dans l'onglet « Tableau ».{br}{br}\u003cb\u003eLe graphique n'a pas la taille souhaitée ?\u003c/b\u003e{br}Utilisez les options de personnalisation de la taille du graphique que vous trouverez dans le menu « Personnaliser ». Notez que l'échelle de zoom n'est actuellement pas personnalisable.{br}{br}\u003cb\u003eLe graphique n'a pas l'échelle de couleurs souhaitée ?\u003c/b\u003e{br}Malheureusement, l'échelle de couleurs n'est actuellement pas personnalisable.","viewer.guidance.hsymbol":"\u003cb\u003e La série de symboles ne contient pas les éléments souhaités ? \u003c/b\u003e {br} Utilisez le menu « Personnaliser » pour choisir la dimension comme « Série du graphique (dimension pour les symboles) » qui contient les éléments à afficher sous forme de séries de symboles. {br} {br} \u003cb\u003e Une couleur unique grise ne permet pas la distinction des séries de symboles ? \u003c/b\u003e {br} Les séries de symboles ne sont colorées que si elles sont spécialement mises en couleurs, sinon l'objectif est d'obtenir un aperçu général de toutes les valeurs. Utilisez la fonction de mise en couleurs dans le menu « Personnaliser » pour choisir la série de symboles pour laquelle vous souhaitez appliquer des couleurs. Il y a une séquence de couleurs prédéfinie (maximum 8 couleurs répétées) donc l'ordre de la sélection est significatif. {br} {br} \u003cb\u003e Les étiquettes ne sont pas affichées pour les séries de symboles ? \u003c/b\u003e {br} Les séries de symboles ne sont étiquetées que s'il y a suffisamment d'espace pour ces étiquettes. Augmentez la hauteur du graphique jusqu'à ce que les étiquettes s'affichent ou réduisez la sélection. De plus, parfois l'espace horizontal est insuffisant, essayez donc également d'augmenter la largeur du graphique. Vous trouverez ces options dans le menu « Personnaliser ». {br} {br} \u003cb\u003e Le graphique n'apparaît pas et vous voyez un message « Il n'y a pas de données pour la sélection actuelle. Veuillez modifier la sélection. » ? \u003c/b\u003e {br} Assurez-vous d'avoir une sélection qui comprend au moins 2 points de données. Vous pouvez vérifier la disponibilité des données à l'aide de l'onglet « Tableau ». {br} {br} \u003cb\u003e Plusieurs dimensions sont combinées par série de symboles ? \u003c/b\u003e {br} Si votre sélection varie pour plus de deux des dimensions, la série de symboles représentera toutes les combinaisons possibles des éléments de dimension sélectionnés. Si vous souhaitez comparer la série de symboles d'une seule dimension, assurez-vous que toutes les autres dimensions ont des sélections uniques. {br} {br} \u003cb\u003e Le graphique n'a pas la taille ou l'échelle de l'axe souhaitée ? \u003c/b\u003e {br} Utilisez les différentes options de personnalisation des graphiques que vous trouverez dans le menu « Personnaliser ».","viewer.guidance.row":"\u003cb\u003e Une couleur unique grise ne permet pas la distinction des barres horizontales ? \u003c/b\u003e {br} Les barres horizontales ne sont colorées que si elles sont spécialement mises en couleurs, sinon l'objectif est d'obtenir un aperçu général de la taille de toutes les catégories. Utilisez la fonction de mise en couleurs dans le menu « Personnaliser » pour choisir les barres horizontales auxquelles vous souhaitez appliquer des couleurs. Il y a une séquence de couleurs prédéfinie (maximum 8 couleurs répétées) donc l'ordre de la sélection est significatif. {br} {br} \u003cb\u003e Les étiquettes ne sont pas affichées pour les barres horizontales ? \u003c/b\u003e {br} Les barres horizontales ne sont étiquetées que s'il y a suffisamment d'espace pour ces étiquettes. Augmentez la hauteur du graphique jusqu'à ce que les étiquettes s'affichent ou réduisez la sélection. De plus, parfois l'espace horizontal est insuffisant, essayez donc également d'augmenter la largeur du graphique. Vous trouverez ces options dans le menu « Personnaliser ». {br} {br} \u003cb\u003e Le graphique n'apparaît pas et vous voyez un message « Il n'y a pas de données pour la sélection actuelle. Veuillez modifier la sélection. » ? \u003c/b\u003e ou \u003cb\u003e Aucune ligne n'est affichée ? \u003c/b\u003e {br} Assurez-vous d'avoir une sélection qui comprend au moins 2 points de données. Vous pouvez vérifier la disponibilité des données à l'aide de l'onglet « Tableau ». {br} {br} \u003cb\u003e Plusieurs dimensions sont combinées par ligne? \u003c/b\u003e {br} Si votre sélection varie pour plusieurs dimensions, les barres horizontales représenteront toutes les combinaisons possibles des éléments de dimension sélectionnés. Si vous souhaitez comparer les valeurs d'une seule dimension, assurez-vous que toutes les autres dimensions ont des sélections uniques. {br} {br} \u003cb\u003e Les barres horizontales ne contiennent pas les éléments souhaités ? \u003c/b\u003e {br} Assurez-vous de n'inclure dans votre sélection que les éléments de dimension requis. {br} {br} \u003cb\u003e Le graphique n'a pas la taille ou l'échelle de l'axe souhaitée ? \u003c/b\u003e {br} Utilisez les différentes options de personnalisation des graphiques que vous trouverez dans le menu « Personnaliser ».","viewer.guidance.scatter":"\u003cb\u003e Les axes de dispersion horizontaux et/ou verticaux ne contiennent pas les variables souhaitées ? \u003c/b\u003e {br} Utilisez le menu « Personnaliser » pour choisir la dimension comme « Série du graphique (dimension pour les axes horizontal et vertical) » contenant les variables (éléments) à comparer. Sélectionnez également les éléments de dimension correspondants à comparer en tant que « Valeur de la dimension pour l'axe horizontal » et « Valeur de la dimension pour l'axe vertical ». {br} {br} \u003cb\u003e Le graphique n'affiche qu'un seul point ? \u003c/b\u003e {br} Les nuages ​​de points comparent pour deux valeurs d'une dimension les valeurs variables d'une (ou plusieurs) autre(s) dimension(s). Par conséquent, les nuages ​​de points nécessitent plusieurs sélections dans au moins deux dimensions. Assurez-vous que votre sélection est adéquate. Utilisez le « Tableau » pour vérifier également la disponibilité des données. {br} {br} \u003cb\u003e Le graphique n'apparaît pas et vous voyez un message « Il n'y a pas de données pour la sélection actuelle. Veuillez modifier la sélection. » ? \u003c/b\u003e {br} Assurez-vous d'avoir une sélection qui comprend au moins 1 point de données. Vous pouvez vérifier la disponibilité des données à l'aide de l'onglet « Tableau ». {br} {br} \u003cb\u003e Une couleur unique grise ne permet pas la distinction des points ? \u003c/b\u003e {br} Les points ne sont colorés que s'ils sont spécialement mis en couleurs, sinon l'objectif est d'obtenir un aperçu général de la distribution permettant d'identifier le type de relation entre les variables tracées. Utilisez la fonction de mise en couleurs sous le menu « Personnaliser » pour choisir les éléments de dimension pour lesquels vous souhaitez appliquer des couleurs. Il y a une séquence de couleurs prédéfinie (maximum 8 couleurs répétées) donc l'ordre de la sélection est significatif. {br} {br} \u003cb\u003e Le graphique n'a pas la taille ou l'échelle de l'axe souhaitée ? \u003c/b\u003e {br} Utilisez les différentes options de personnalisation des graphiques que vous trouverez dans le menu « Personnaliser ».","viewer.guidance.stacked-bar":"\u003cb\u003e Les colonnes empilées ne représentent pas les catégories et les variables prévues ? \u003c/b\u003e {br} Le graphique à colonnes empilées est utilisé pour comparer plusieurs valeurs statistiques pour différentes catégories. Utilisez le menu « Personnaliser » pour choisir la dimension utilisée pour distinguer les bacolonnesrres empilées comme « Série du graphique (dimension pour l'axe horizontal) ». Les segments de barre représenteront toutes les combinaisons possibles des autres éléments de dimension sélectionnés (avec une limitation de 5 segments maximum). Réduisez la sélection à seulement deux dimensions variables si les segments doivent représenter les éléments d'une seule dimension. {br} {br} \u003cb\u003e Une couleur unique grise ne permet pas la distinction des colonnes empilées ? \u003c/b\u003e {br} Les colonnes empilées ne sont colorées que si elles sont spécialement mises en couleurs, sinon l'objectif est d'obtenir un aperçu général de la taille des valeurs de toutes les catégories. Utilisez la fonction de mise en couleurs sous le menu « Personnaliser » pour choisir les colonnes empilées pour lesquelles vous souhaitez appliquer des couleurs. Il y a une séquence de couleurs prédéfinie (maximum 8 couleurs répétées) donc l'ordre de la sélection est significatif. Le schéma d'ombrage ne peut pas être modifié. {br} {br} \u003cb\u003e Les étiquettes ne sont pas affichées pour les colonnes empilées ? \u003c/b\u003e {br} Les colonnes empilées ne sont étiquetées que s'il y a suffisamment d'espace pour ces étiquettes. L'espace vertical minimum requis pour les étiquettes est de 50% de la taille du graphique. Augmentez la hauteur du graphique jusqu'à ce que les étiquettes s'affichent. De plus, parfois l'espace horizontal est insuffisant, essayez donc également d'augmenter la largeur du graphique. Vous trouverez ces options dans le menu « Personnaliser ». {br} {br} \u003cb\u003e Vous vouliez un graphique à colonnes empilées en pourcentage ? \u003c/b\u003e {br} Utilisez l'option de personnalisation « Pourcentage » que vous trouverez dans le menu « Personnaliser ». Ce type de graphique permet de comparer les répartitions dans une dimension. {br} {br} \u003cb\u003e Le graphique n'apparaît pas et vous voyez un message « Il n'y a pas de données pour la sélection actuelle. Veuillez modifier la sélection. » ? \u003c/b\u003e {br} Les graphiques à colonnes empilées nécessitent des données couvrant au moins 2 points de données. Vérifiez et augmentez les éléments de dimension actuellement sélectionnés. {br} {br} \u003cb\u003e Le graphique n'a pas la taille ou l'échelle de l'axe souhaitée ? \u003c/b\u003e {br} Utilisez les différentes options de personnalisation des graphiques que vous trouverez dans le menu « Personnaliser ».","viewer.guidance.stacked-row":"\u003cb\u003e Les barres horizontales empilées ne représentent pas les catégories et les variables prévues ? \u003c/b\u003e {br} Le graphique à barres horizontales empilées est utilisé pour comparer plusieurs valeurs statistiques pour différentes catégories. Utilisez le menu « Personnaliser » pour choisir la dimension utilisée pour distinguer les barres horizontales empilées comme « Série du graphique (dimension pour l'axe vertical) ». Les segments de barre horizontale représenteront toutes les combinaisons possibles des autres éléments de dimension sélectionnés (avec une limitation de 5 segments maximum). Réduisez la sélection à seulement deux dimensions variables si les segments doivent représenter les éléments d'une seule dimension. {br} {br} \u003cb\u003e Une couleur unique grise ne permet pas la distinction des barres horizontales empilées ? \u003c/b\u003e {br} Les barres horizontales empilées ne sont colorées que si elles sont spécialement mises en couleurs, sinon l'objectif est d'obtenir un aperçu général de la taille des valeurs de toutes les catégories. Utilisez la fonction de mise en couleurs sous le menu « Personnaliser » pour choisir les barres horizontales empilées pour lesquelles vous souhaitez appliquer des couleurs. Il y a une séquence de couleurs prédéfinie (maximum 8 couleurs répétées) donc l'ordre de la sélection est significatif. Le schéma d'ombrage ne peut pas être modifié. {br} {br} \u003cb\u003e Les étiquettes ne sont pas affichées pour les barres horizontales empilées ? \u003c/b\u003e {br} Les barres horizontales empilées ne sont étiquetées que s'il y a suffisamment d'espace pour ces étiquettes. L'espace vertical minimum requis pour les étiquettes est de 50% de la taille du graphique. Augmentez la hauteur du graphique jusqu'à ce que les étiquettes s'affichent. De plus, parfois l'espace horizontal est insuffisant, essayez donc également d'augmenter la largeur du graphique. Vous trouverez ces options dans le menu « Personnaliser ». {br} {br} \u003cb\u003e Vous vouliez un graphique à barres horizontales empilées en pourcentage ? \u003c/b\u003e {br} Utilisez l'option de personnalisation « Pourcentage » que vous trouverez dans le menu « Personnaliser ». Ce type de graphique permet de comparer les répartitions dans une dimension. {br} {br} \u003cb\u003e Le graphique n'apparaît pas et vous voyez un message « Il n'y a pas de données pour la sélection actuelle. Veuillez modifier la sélection. » ? \u003c/b\u003e {br} Les graphiques à barres horizontales empilées nécessitent des données couvrant au moins 2 points de données. Vérifiez et augmentez les éléments de dimension actuellement sélectionnés. {br} {br} \u003cb\u003e Le graphique n'a pas la taille ou l'échelle de l'axe souhaitée ? \u003c/b\u003e {br} Utilisez les différentes options de personnalisation des graphiques que vous trouverez dans le menu « Personnaliser ».","viewer.guidance.timeline":"\u003cb\u003eUne couleur unique grise ne permet pas la distinction des courbes chronologiques ?\u003c/b\u003e{br}Les courbes chronologiques ne sont colorées que si elles sont spécialement mises en couleurs, sinon l'objectif est d'obtenir un aperçu général des tendances de toutes les courbes chronologiques. Utilisez la fonction de mise en couleurs dans le menu « Personnaliser » pour choisir les courbes chronologiques auxquelles vous souhaitez appliquer des couleurs. Il existe une séquence de couleurs prédéfinie (maximum 6 couleurs répétées), donc l'ordre de la sélection est significatif.{br}{br}\u003cb\u003eLes étiquettes ne sont pas affichées pour les courbes chronologiques ?\u003c/b\u003e{br}Les courbes chronologiques ne sont étiquetées que si elles sont spécialement mises en couleurs. Utilisez la fonction de mise en couleurs dans le menu « Personnaliser » pour sélectionner les courbes pour lesquelles vous souhaitez voir les étiquettes. {br} {br} \u003cb\u003e Les courbes chronologiques en couleurs n'affichent pas de points pour les valeurs ? \u003c/b\u003e {br} Les points sur les courbes ne sont affichés que s'il y a suffisamment d'espace horizontal qui permet de bien distinguer les points. Augmentez la largeur du graphique ou réduisez la sélection de la plage de périodes de temps. {br} {br} \u003cb\u003e Plusieurs dimensions sont combinées par courbe chronologique ? \u003c/b\u003e {br} Si, en dehors de la dimension temporelle, votre sélection varie pour plusieurs dimensions, les courbes chronologiques représenteront toutes les combinaisons possibles des éléments de dimension sélectionnés. Si vous souhaitez comparer les courbes chronologiques d'une seule dimension, assurez-vous que toutes les autres dimensions ont des sélections uniques.{br}{br}\u003cb\u003eLe graphique n'apparaît pas et vous voyez un message « Il n'y a pas de données pour la sélection actuelle. Veuillez modifier la sélection. » ?\u003c/b\u003e{br}Les graphiques chronologiques ont besoin une couverture des données d'au moins 2 périodes de temps. Vérifiez et augmentez l'actuelle sélection de la période de temps.{br}{br}\u003cb\u003eLe graphique n'a pas la taille ou l'échelle de l'axe souhaitée ?\u003c/b\u003e{br}Utilisez les différentes options de personnalisation des graphiques que vous trouverez dans le menu « Personnaliser ».","viewer.guidance.vsymbol":"\u003cb\u003e La série de symboles ne contient pas les éléments souhaités ? \u003c/b\u003e {br} Utilisez le menu « Personnaliser » pour choisir la dimension comme « Série du graphique (dimension pour les symboles) » qui contient les éléments à afficher sous forme de séries de symboles. {br} {br} \u003cb\u003e Une couleur unique grise ne permet pas la distinction des séries de symboles ? \u003c/b\u003e {br} Les séries de symboles ne sont colorées que si elles sont spécialement mises en couleurs, sinon l'objectif est d'obtenir un aperçu général de toutes les valeurs. Utilisez la fonction de mise en couleurs dans le menu « Personnaliser » pour choisir la série de symboles pour laquelle vous souhaitez appliquer des couleurs. Il y a une séquence de couleurs prédéfinie (maximum 8 couleurs répétées) donc l'ordre de la sélection est significatif. {br} {br} \u003cb\u003e Les étiquettes ne sont pas affichées pour les séries de symboles ? \u003c/b\u003e {br} Les séries de symboles ne sont étiquetées que s'il y a suffisamment d'espace pour ces étiquettes. L'espace vertical minimum requis pour les étiquettes est de 50% de la taille du graphique. Augmentez la hauteur du graphique jusqu'à ce que les étiquettes s'affichent. De plus, parfois l'espace horizontal est insuffisant, essayez donc également d'augmenter la largeur du graphique. Vous trouverez ces options dans le menu « Personnaliser ». {br} {br} \u003cb\u003e Le graphique n'apparaît pas et vous voyez un message « Il n'y a pas de données pour la sélection actuelle. Veuillez modifier la sélection. » ? \u003c/b\u003e {br} Assurez-vous d'avoir une sélection qui comprend au moins 2 points de données. Vous pouvez vérifier la disponibilité des données à l'aide de l'onglet « Tableau ». {br} {br} \u003cb\u003e Plusieurs dimensions sont combinées par série de symboles ? \u003c/b\u003e {br} Si votre sélection varie pour plus de deux des dimensions, la série de symboles représentera toutes les combinaisons possibles des éléments de dimension sélectionnés. Si vous souhaitez comparer la série de symboles d'une seule dimension, assurez-vous que toutes les autres dimensions ont des sélections uniques. {br} {br} \u003cb\u003e Le graphique n'a pas la taille ou l'échelle de l'axe souhaitée ? \u003c/b\u003e {br} Utilisez les différentes options de personnalisation des graphiques que vous trouverez dans le menu « Personnaliser ».","viewer.guidances.chart":"💡 Vous n'obtenez pas le graphique souhaité ?","viewer.guidances.table":{},"vis.data.availability.disabled":"En raison de la grande taille de cet ensemble de données, nous ne sommes pas en mesure d’indiquer l’indisponibilité des données pour certaines sélections de filtres.","vx.config.copyright":"Supprimer les droits d'auteur","vx.config.display.both":"Libellé et identifiant","vx.config.display.code":"Identifiant","vx.config.display.label":"Libellé","vx.config.logo":"Supprimer le logo","vx.config.reset":"Réinitialiser","vx.config.source":"Source des libellés","vx.config.subtitle":"Sous-titre","vx.config.title":"Titre","vx.config.uniq.focus.option":"Courbe chronologique","vx.fil
