<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" font-family="Arial, Helvetica, Liberation Sans, DejaVu Sans, sans-serif">
  <title>Why a RAG: an LLM alone versus an LLM grounded in the legislation database</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#FFFFFF"/>

  <!-- Left panel -->
  <rect x="15" y="15" width="420" height="400" rx="14" fill="#FBEAEA" stroke="#C0392B" stroke-width="1.5"/>
  <text x="225" y="48" text-anchor="middle" font-size="19" font-weight="bold" fill="#8E2A1F">An LLM on its own</text>

  <rect x="45" y="70" width="360" height="56" rx="10" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="225" y="94" text-anchor="middle" font-size="14" fill="#1F2937">"What is the first French income-tax</text>
  <text x="225" y="113" text-anchor="middle" font-size="14" fill="#1F2937">threshold for EUROMOD system 2025?"</text>
  <line x1="225" y1="126" x2="225" y2="154" stroke="#4B5563" stroke-width="2" marker-end="url(#a)"/>

  <rect x="125" y="158" width="200" height="50" rx="25" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.5"/>
  <text x="225" y="180" text-anchor="middle" font-size="15" font-weight="bold" fill="#374151">LLM</text>
  <text x="225" y="198" text-anchor="middle" font-size="12" fill="#6B7280">answers from training memory</text>
  <line x1="225" y1="208" x2="225" y2="236" stroke="#4B5563" stroke-width="2" marker-end="url(#a)"/>

  <rect x="95" y="240" width="260" height="42" rx="10" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.5"/>
  <text x="225" y="267" text-anchor="middle" font-size="16" font-weight="bold" fill="#C0392B">"About 11 300 €"</text>

  <g font-size="13.5" fill="#7F1D1D">
    <text x="50" y="316">✗  Which year? Memory stops at a cut-off date</text>
    <text x="50" y="341">✗  No source: nothing a reviewer can check</text>
    <text x="50" y="366">✗  Can invent a plausible-looking number</text>
    <text x="50" y="391">✗  Weak on Lithuanian or Dutch legal text</text>
  </g>

  <!-- Right panel -->
  <rect x="465" y="15" width="420" height="400" rx="14" fill="#E6F4F1" stroke="#1C8C7A" stroke-width="1.5"/>
  <text x="675" y="48" text-anchor="middle" font-size="19" font-weight="bold" fill="#11594D">An LLM grounded by the RAG</text>

  <rect x="495" y="70" width="360" height="56" rx="10" fill="#FFFFFF" stroke="#9CA3AF"/>
  <text x="675" y="94" text-anchor="middle" font-size="14" fill="#1F2937">Same question + country + date</text>
  <text x="675" y="113" text-anchor="middle" font-size="12.5" fill="#6B7280">(FR, law in force for income year 2024)</text>
  <line x1="675" y1="126" x2="675" y2="146" stroke="#4B5563" stroke-width="2" marker-end="url(#a)"/>

  <rect x="515" y="150" width="320" height="46" rx="10" fill="#1F3A5F"/>
  <text x="675" y="171" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#FFFFFF">1. Retrieve: legislation database</text>
  <text x="675" y="188" text-anchor="middle" font-size="12" fill="#D6E2F0">CGI art. 197, version in force on that date</text>
  <line x1="675" y1="196" x2="675" y2="214" stroke="#4B5563" stroke-width="2" marker-end="url(#a)"/>

  <rect x="515" y="218" width="320" height="46" rx="10" fill="#2E6FB7"/>
  <text x="675" y="239" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#FFFFFF">2. Generate: LLM reads only those texts</text>
  <text x="675" y="256" text-anchor="middle" font-size="12" fill="#DCEAF8">and must quote the sentence it relies on</text>
  <line x1="675" y1="264" x2="675" y2="282" stroke="#4B5563" stroke-width="2" marker-end="url(#a)"/>

  <rect x="495" y="286" width="360" height="62" rx="10" fill="#FFFFFF" stroke="#1C8C7A" stroke-width="1.5"/>
  <text x="675" y="309" text-anchor="middle" font-size="16" font-weight="bold" fill="#11594D">11 497 €</text>
  <text x="675" y="328" text-anchor="middle" font-size="12" fill="#374151">« … de chaque part de revenu qui excède 11 497 € … »</text>
  <text x="675" y="343" text-anchor="middle" font-size="11.5" fill="#6B7280">CGI art. 197 · Légifrance · version of 16 Feb 2025</text>

  <g font-size="13.5" fill="#11594D">
    <text x="500" y="376">✓  Quote checked word-for-word by code</text>
    <text x="500" y="399">✓  Dated, cited, and a human decides</text>
  </g>
</svg>
