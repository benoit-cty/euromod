<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Arial, Helvetica, Liberation Sans, DejaVu Sans, sans-serif">
  <title>One embedding model, two kinds of hardware, the same vectors</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
  </defs>
  <rect width="900" height="330" fill="#FFFFFF"/>

  <!-- model -->
  <rect x="15" y="115" width="180" height="100" rx="12" fill="#1F3A5F"/>
  <text x="105" y="150" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">BGE-M3</text>
  <text x="105" y="173" text-anchor="middle" font-size="12" fill="#D6E2F0">one model,</text>
  <text x="105" y="190" text-anchor="middle" font-size="12" fill="#D6E2F0">one version for everyone</text>

  <g stroke="#4B5563" stroke-width="2" fill="none">
    <path d="M195,150 C230,150 230,80 262,80" marker-end="url(#a)"/>
    <path d="M195,180 C230,180 230,250 262,250" marker-end="url(#a)"/>
  </g>

  <!-- GPU -->
  <rect x="266" y="20" width="330" height="120" rx="12" fill="#E6F4F1" stroke="#1C8C7A" stroke-width="1.5"/>
  <text x="285" y="47" font-size="15" font-weight="bold" fill="#11594D">GPU worker (NVIDIA)</text>
  <g font-size="12.5" fill="#374151">
    <text x="285" y="71">PyTorch on CUDA, picked automatically</text>
    <text x="285" y="91">~4 GB of video memory is enough</text>
    <text x="285" y="111">older cards supported (full precision)</text>
    <text x="285" y="129" font-weight="bold" fill="#11594D">whole country corpus: hours</text>
  </g>

  <!-- CPU -->
  <rect x="266" y="190" width="330" height="120" rx="12" fill="#EAF2FB" stroke="#2E6FB7" stroke-width="1.5"/>
  <text x="285" y="217" font-size="15" font-weight="bold" fill="#1F3A5F">CPU worker (no GPU needed)</text>
  <g font-size="12.5" fill="#374151">
    <text x="285" y="241">OpenVINO: fast on Intel CPUs (and iGPU/NPU)</text>
    <text x="285" y="261">or PyTorch on CPU; slim image, no CUDA</text>
    <text x="285" y="281">search queries still answered in ~1 s</text>
    <text x="285" y="299" font-weight="bold" fill="#1F3A5F">whole country corpus: days</text>
  </g>

  <g stroke="#4B5563" stroke-width="2" fill="none">
    <path d="M596,80 C630,80 630,150 662,150" marker-end="url(#a)"/>
    <path d="M596,250 C630,250 630,180 662,180" marker-end="url(#a)"/>
  </g>

  <!-- vectors -->
  <rect x="666" y="100" width="220" height="130" rx="12" fill="#FDF3E1" stroke="#D98E04" stroke-width="1.5"/>
  <text x="776" y="128" text-anchor="middle" font-size="15" font-weight="bold" fill="#8A5A00">Same vectors</text>
  <text x="776" y="152" text-anchor="middle" font-size="12.5" fill="#374151">1 024 numbers per chunk</text>
  <text x="776" y="172" text-anchor="middle" font-size="12.5" fill="#374151">same database table</text>
  <text x="776" y="192" text-anchor="middle" font-size="12.5" fill="#374151">mixable, comparable</text>
  <text x="776" y="212" text-anchor="middle" font-size="12.5" fill="#374151">choose by budget, not by code</text>
</svg>
