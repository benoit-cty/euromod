<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Arial, Helvetica, Liberation Sans, DejaVu Sans, sans-serif">
  <title>The five nested levels of legal content, with provenance and search tables</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="900" height="470" fill="#FFFFFF"/>

  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3A5F">Legal content: five nested levels</text>
  <text x="760" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F3A5F">Example (France)</text>

  <!-- nested boxes -->
  <rect x="20" y="40" width="560" height="410" rx="12" fill="#EAF2FB" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="38" y="66" font-size="15" font-weight="bold" fill="#1F3A5F">instruments</text>
  <text x="160" y="66" font-size="13" fill="#374151">a law, code or decree as a whole</text>

  <rect x="45" y="82" width="520" height="355" rx="12" fill="#D8E7F7" stroke="#2E6FB7" stroke-width="1.5"/>
  <text x="63" y="108" font-size="15" font-weight="bold" fill="#1F3A5F">legal_units</text>
  <text x="172" y="108" font-size="13" fill="#374151">an article as a timeless "slot"</text>

  <rect x="70" y="124" width="480" height="300" rx="12" fill="#C3D9F1" stroke="#2E6FB7" stroke-width="1.5"/>
  <text x="88" y="150" font-size="15" font-weight="bold" fill="#1F3A5F">legal_unit_versions</text>
  <text x="248" y="150" font-size="13" fill="#374151">what it said from date A to date B</text>

  <rect x="95" y="166" width="440" height="190" rx="12" fill="#E6F4F1" stroke="#1C8C7A" stroke-width="1.5"/>
  <text x="113" y="192" font-size="15" font-weight="bold" fill="#11594D">unit_texts</text>
  <text x="203" y="192" font-size="13" fill="#374151">that version in one language</text>

  <rect x="120" y="208" width="400" height="80" rx="12" fill="#FFFFFF" stroke="#1C8C7A" stroke-width="1.5"/>
  <text x="138" y="234" font-size="15" font-weight="bold" fill="#11594D">chunks</text>
  <text x="200" y="234" font-size="13" fill="#374151">the piece that is searched AND cited</text>
  <text x="138" y="258" font-size="12.5" fill="#4B5563">header "Code général des impôts &gt; Art. 197" + text</text>
  <text x="138" y="276" font-size="12.5" fill="#4B5563">keyword index built in, instantly searchable</text>

  <rect x="120" y="302" width="400" height="40" rx="10" fill="#FDF3E1" stroke="#D98E04" stroke-width="1.2"/>
  <text x="138" y="327" font-size="13.5" fill="#8A5A00"><tspan font-weight="bold">embeddings</tspan>: one vector per chunk per model</text>

  <text x="95" y="382" font-size="12.5" fill="#1F3A5F">Rule: two versions of one article can never overlap in time.</text>
  <text x="95" y="402" font-size="12.5" fill="#1F3A5F">Every version points to the archived download it came from.</text>

  <!-- example column -->
  <g font-size="13" fill="#1F2937">
    <rect x="620" y="44" width="265" height="38" rx="8" fill="#EAF2FB" stroke="#1F3A5F"/>
    <text x="634" y="68">Code général des impôts (CGI)</text>
    <rect x="620" y="92" width="265" height="38" rx="8" fill="#D8E7F7" stroke="#2E6FB7"/>
    <text x="634" y="116">CGI, art. 197</text>
    <rect x="620" y="140" width="265" height="38" rx="8" fill="#C3D9F1" stroke="#2E6FB7"/>
    <text x="634" y="164">art. 197, 16 Feb 2025 → 21 Feb 2026</text>
    <rect x="620" y="188" width="265" height="56" rx="8" fill="#E6F4F1" stroke="#1C8C7A"/>
    <text x="634" y="210">French (authentic)</text>
    <text x="634" y="231">English (machine translation)</text>
    <rect x="620" y="254" width="265" height="38" rx="8" fill="#FFFFFF" stroke="#1C8C7A"/>
    <text x="634" y="278">chunk id = the citation's database id</text>
    <rect x="620" y="302" width="265" height="38" rx="8" fill="#FDF3E1" stroke="#D98E04"/>
    <text x="634" y="326">1 024 numbers from BGE-M3</text>
  </g>
  <g stroke="#9CA3AF" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="580" y1="63" x2="617" y2="63"/>
    <line x1="565" y1="111" x2="617" y2="111"/>
    <line x1="550" y1="159" x2="617" y2="159"/>
    <line x1="535" y1="216" x2="617" y2="216"/>
    <line x1="520" y1="248" x2="617" y2="273"/>
    <line x1="520" y1="322" x2="617" y2="321"/>
  </g>

  <!-- side: provenance -->
  <rect x="620" y="362" width="265" height="88" rx="10" fill="#F3F4F6" stroke="#6B7280"/>
  <text x="634" y="385" font-size="13.5" font-weight="bold" fill="#374151">Provenance (append-only)</text>
  <text x="634" y="406" font-size="12" fill="#4B5563">sources → fetch_runs → fetch_snapshots</text>
  <text x="634" y="425" font-size="12" fill="#4B5563">portal · run · raw bytes, URL, date, sha256</text>
  <text x="634" y="442" font-size="12" fill="#4B5563">"no text without a proven origin"</text>
  <line x1="620" y1="400" x2="553" y2="400" stroke="#6B7280" stroke-width="1.5" marker-end="url(#a)"/>
</svg>
