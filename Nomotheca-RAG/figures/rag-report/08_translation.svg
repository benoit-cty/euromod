<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Arial, Helvetica, Liberation Sans, DejaVu Sans, sans-serif">
  <title>Translation into English: stored side by side, never used as evidence</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
  </defs>
  <rect width="900" height="400" fill="#FFFFFF"/>

  <text x="20" y="28" font-size="15" font-weight="bold" fill="#1F3A5F">Law → English: one version, two texts side by side</text>

  <!-- original -->
  <rect x="20" y="45" width="300" height="150" rx="12" fill="#EAF2FB" stroke="#1F3A5F" stroke-width="1.5"/>
  <text x="38" y="70" font-size="14" font-weight="bold" fill="#1F3A5F">Original text (authentic)</text>
  <text x="38" y="90" font-size="12" fill="#4B5563">language: lt · as published by TAR</text>
  <text x="38" y="120" font-size="12.5" fill="#1F2937" font-style="italic">„Neapmokestinamųjų pajamų dydis</text>
  <text x="38" y="138" font-size="12.5" fill="#1F2937" font-style="italic">(NPD) … lygus 747 eurams …"</text>
  <text x="38" y="176" font-size="12" font-weight="bold" fill="#11594D">✓ the only text a quote is checked in</text>

  <!-- arrow -->
  <line x1="320" y1="120" x2="386" y2="120" stroke="#4B5563" stroke-width="2" marker-end="url(#a)"/>
  <rect x="330" y="132" width="50" height="22" rx="4" fill="#F3F4F6"/>
  <text x="355" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">LLM</text>

  <!-- english -->
  <rect x="390" y="45" width="300" height="150" rx="12" fill="#E6F4F1" stroke="#1C8C7A" stroke-width="1.5"/>
  <text x="408" y="70" font-size="14" font-weight="bold" fill="#11594D">English (machine translation)</text>
  <text x="408" y="90" font-size="12" fill="#4B5563">from: lt · engine recorded · flagged MT</text>
  <text x="408" y="120" font-size="12.5" fill="#1F2937" font-style="italic">"The amount of tax-exempt income</text>
  <text x="408" y="138" font-size="12.5" fill="#1F2937" font-style="italic">(NPD) … shall be EUR 747 …"</text>
  <text x="408" y="176" font-size="12" font-weight="bold" fill="#8A5A00">for reading and searching, not citing</text>

  <!-- rules -->
  <rect x="710" y="45" width="175" height="150" rx="12" fill="#FDF3E1" stroke="#D98E04" stroke-width="1.5"/>
  <text x="724" y="70" font-size="13.5" font-weight="bold" fill="#8A5A00">Translation rules</text>
  <g font-size="12" fill="#374151">
    <text x="724" y="94">numbers, dates, ids</text>
    <text x="724" y="110">never altered</text>
    <text x="724" y="134">structure and article</text>
    <text x="724" y="150">numbering kept</text>
    <text x="724" y="174">act names kept in</text>
    <text x="724" y="190">the original language</text>
  </g>

  <!-- uses -->
  <text x="20" y="232" font-size="14" font-weight="bold" fill="#1F3A5F">What the English text is for</text>
  <g font-size="12.5">
    <rect x="20" y="245" width="275" height="62" rx="10" fill="#FFFFFF" stroke="#9CA3AF"/>
    <text x="34" y="269" font-weight="bold" fill="#1F2937">Reviewers read any country</text>
    <text x="34" y="289" fill="#4B5563">a Dutch or Lithuanian source, in English</text>
    <rect x="312" y="245" width="275" height="62" rx="10" fill="#FFFFFF" stroke="#9CA3AF"/>
    <text x="326" y="269" font-weight="bold" fill="#1F2937">One search across countries</text>
    <text x="326" y="289" fill="#4B5563">"child benefit amount" in the UI</text>
    <rect x="604" y="245" width="281" height="62" rx="10" fill="#FFFFFF" stroke="#9CA3AF"/>
    <text x="618" y="269" font-weight="bold" fill="#1F2937">Measure it</text>
    <text x="618" y="289" fill="#4B5563">search original vs English: which wins?</text>
  </g>

  <!-- reverse direction -->
  <text x="20" y="342" font-size="14" font-weight="bold" fill="#1F3A5F">And the other way round: parameter labels → law's language</text>
  <rect x="20" y="355" width="250" height="34" rx="8" fill="#F3F4F6" stroke="#9CA3AF"/>
  <text x="34" y="377" font-size="12.5" fill="#1F2937">"Tax-exempt income amount"</text>
  <line x1="270" y1="372" x2="316" y2="372" stroke="#4B5563" stroke-width="2" marker-end="url(#a)"/>
  <rect x="320" y="355" width="270" height="34" rx="8" fill="#EAF2FB" stroke="#2E6FB7"/>
  <text x="334" y="377" font-size="12.5" fill="#1F2937">"neapmokestinamųjų pajamų dydis"</text>
  <text x="605" y="377" font-size="12.5" fill="#4B5563">so keyword search speaks the law's words</text>
</svg>
