<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" font-family="Arial, Helvetica, Liberation Sans, DejaVu Sans, sans-serif">
  <title>Point-in-time: dated versions of one article and the version selected at a reference date</title>
  <rect width="900" height="270" fill="#FFFFFF"/>

  <text x="20" y="24" font-size="15" font-weight="bold" fill="#1F3A5F">One article, several dated versions: CGI art. 197 (French income-tax scale)</text>

  <!-- axis -->
  <line x1="60" y1="170" x2="870" y2="170" stroke="#374151" stroke-width="1.5"/>
  <g font-size="12.5" fill="#4B5563" text-anchor="middle">
    <line x1="120" y1="165" x2="120" y2="175" stroke="#374151"/><text x="120" y="192">2024</text>
    <line x1="370" y1="165" x2="370" y2="175" stroke="#374151"/><text x="370" y="192">2025</text>
    <line x1="620" y1="165" x2="620" y2="175" stroke="#374151"/><text x="620" y="192">2026</text>
    <line x1="870" y1="165" x2="870" y2="175" stroke="#374151"/><text x="860" y="192">2027</text>
  </g>

  <!-- versions -->
  <rect x="60" y="70" width="339" height="60" rx="8" fill="#E5E7EB" stroke="#6B7280"/>
  <text x="229" y="95" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#374151">version A: first band from 11 294 €</text>
  <text x="229" y="115" text-anchor="middle" font-size="12" fill="#4B5563">closed on 16 Feb 2025 when version B arrived</text>

  <rect x="403" y="70" width="260" height="60" rx="8" fill="#2E6FB7"/>
  <text x="533" y="95" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#FFFFFF">version B: from 11 497 €</text>
  <text x="533" y="115" text-anchor="middle" font-size="12" fill="#DCEAF8">16 Feb 2025 → 21 Feb 2026</text>

  <rect x="667" y="70" width="203" height="60" rx="8" fill="#E5E7EB" stroke="#6B7280"/>
  <text x="768" y="95" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#374151">version C</text>
  <text x="768" y="115" text-anchor="middle" font-size="12" fill="#4B5563">from 21 Feb 2026, open-ended</text>

  <!-- reference date pin -->
  <line x1="495" y1="62" x2="495" y2="170" stroke="#C0392B" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="495" cy="170" r="6" fill="#C0392B"/>
  <text x="495" y="56" text-anchor="middle" font-size="13" font-weight="bold" fill="#C0392B">reference date 1 Jul 2025</text>

  <text x="20" y="243" font-size="13" fill="#1F2937">A search "as of" a date only sees the version whose validity contains that date. Old versions are never overwritten,</text>
  <text x="20" y="261" font-size="13" fill="#1F2937">so a 2024 system year can be re-checked in 2027 against the law exactly as it stood then.</text>
</svg>
