<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Arial, Helvetica, Liberation Sans, DejaVu Sans, sans-serif">
  <title>Ingestion: country adapter steps and shared core steps</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
  </defs>
  <rect width="900" height="330" fill="#FFFFFF"/>

  <!-- step boxes -->
  <g font-size="12" text-anchor="middle">
    <rect x="10" y="70" width="130" height="120" rx="10" fill="#FDF3E1" stroke="#D98E04" stroke-width="1.5"/>
    <text x="75" y="96" font-size="15" font-weight="bold" fill="#8A5A00">1. Resolve</text>
    <text x="75" y="122" fill="#374151">"CGI art. 197,</text>
    <text x="75" y="139" fill="#374151">in force 2025"</text>
    <text x="75" y="160" fill="#374151">→ exact national</text>
    <text x="75" y="177" fill="#374151">document id</text>

    <rect x="160" y="70" width="130" height="120" rx="10" fill="#FDF3E1" stroke="#D98E04" stroke-width="1.5"/>
    <text x="225" y="96" font-size="15" font-weight="bold" fill="#8A5A00">2. Fetch</text>
    <text x="225" y="122" fill="#374151">download the</text>
    <text x="225" y="139" fill="#374151">official file</text>
    <text x="225" y="160" fill="#374151">(XML, JSON,</text>
    <text x="225" y="177" fill="#374151">HTML, PDF)</text>

    <rect x="310" y="70" width="130" height="120" rx="10" fill="#EAF2FB" stroke="#2E6FB7" stroke-width="1.5"/>
    <text x="375" y="96" font-size="15" font-weight="bold" fill="#1F3A5F">3. Archive</text>
    <text x="375" y="122" fill="#374151">store raw bytes</text>
    <text x="375" y="139" fill="#374151">+ URL + date</text>
    <text x="375" y="160" fill="#374151">+ fingerprint</text>
    <text x="375" y="177" fill="#374151">(sha256)</text>

    <rect x="460" y="70" width="130" height="120" rx="10" fill="#FDF3E1" stroke="#D98E04" stroke-width="1.5"/>
    <text x="525" y="96" font-size="15" font-weight="bold" fill="#8A5A00">4. Parse</text>
    <text x="525" y="122" fill="#374151">national format</text>
    <text x="525" y="139" fill="#374151">→ one common</text>
    <text x="525" y="160" fill="#374151">structure: acts,</text>
    <text x="525" y="177" fill="#374151">articles, versions</text>

    <rect x="610" y="70" width="130" height="120" rx="10" fill="#EAF2FB" stroke="#2E6FB7" stroke-width="1.5"/>
    <text x="675" y="96" font-size="15" font-weight="bold" fill="#1F3A5F">5. Load</text>
    <text x="675" y="122" fill="#374151">close old version,</text>
    <text x="675" y="139" fill="#374151">open new one;</text>
    <text x="675" y="160" fill="#374151">cut into chunks;</text>
    <text x="675" y="177" fill="#374151">keyword-searchable</text>

    <rect x="760" y="60" width="130" height="62" rx="10" fill="#E6F4F1" stroke="#1C8C7A" stroke-width="1.5"/>
    <text x="825" y="85" font-size="14" font-weight="bold" fill="#11594D">6a. Embed</text>
    <text x="825" y="104" fill="#374151">BGE-M3 vectors</text>

    <rect x="760" y="138" width="130" height="62" rx="10" fill="#E6F4F1" stroke="#1C8C7A" stroke-width="1.5"/>
    <text x="825" y="163" font-size="14" font-weight="bold" fill="#11594D">6b. Translate</text>
    <text x="825" y="182" fill="#374151">English version</text>
  </g>
  <g stroke="#4B5563" stroke-width="2">
    <line x1="140" y1="130" x2="156" y2="130" marker-end="url(#a)"/>
    <line x1="290" y1="130" x2="306" y2="130" marker-end="url(#a)"/>
    <line x1="440" y1="130" x2="456" y2="130" marker-end="url(#a)"/>
    <line x1="590" y1="130" x2="606" y2="130" marker-end="url(#a)"/>
    <line x1="740" y1="118" x2="756" y2="98" marker-end="url(#a)"/>
    <line x1="740" y1="142" x2="756" y2="162" marker-end="url(#a)"/>
  </g>

  <!-- brackets above -->
  <text x="375" y="30" text-anchor="middle" font-size="13" fill="#4B5563">done immediately, one transaction per article version</text>
  <line x1="10" y1="42" x2="740" y2="42" stroke="#9CA3AF" stroke-width="1.2"/>
  <line x1="10" y1="42" x2="10" y2="52" stroke="#9CA3AF" stroke-width="1.2"/>
  <line x1="740" y1="42" x2="740" y2="52" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="825" y="30" text-anchor="middle" font-size="13" fill="#4B5563">later, as batch jobs</text>
  <line x1="760" y1="42" x2="890" y2="42" stroke="#9CA3AF" stroke-width="1.2"/>

  <!-- legend -->
  <rect x="120" y="235" width="22" height="16" rx="3" fill="#FDF3E1" stroke="#D98E04"/>
  <text x="150" y="248" font-size="13.5" fill="#1F2937"><tspan font-weight="bold">Country adapter</tspan> (one per country: the only part that changes)</text>
  <rect x="120" y="265" width="22" height="16" rx="3" fill="#EAF2FB" stroke="#2E6FB7"/>
  <text x="150" y="278" font-size="13.5" fill="#1F2937"><tspan font-weight="bold">Shared core</tspan> (identical for every country, about 80 % of the code)</text>
  <rect x="120" y="295" width="22" height="16" rx="3" fill="#E6F4F1" stroke="#1C8C7A"/>
  <text x="150" y="308" font-size="13.5" fill="#1F2937"><tspan font-weight="bold">Enrichment</tspan> (run by the worker, can lag without blocking keyword search)</text>
</svg>
