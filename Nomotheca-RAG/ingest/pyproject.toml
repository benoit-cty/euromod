[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nomotheca-legislation-ingest"
version = "0.1.0"
description = "Archive-first legislation ingestion pipeline for the EUROMOD RAG prototype."
readme = "README.md"
license = {text = "EUPL-1.2"}
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  # Plain-text extraction for contributed PDFs (circulars). Deliberately not a
  # layout-aware toolchain: a circular's value sits in its prose, not a table.
  "pypdf>=5.0",
  "pydantic>=2.8",
  "pytest>=9.1.1",
  "tenacity>=8.5",
  "textual>=0.86",
  "typer>=0.12",
]

[project.optional-dependencies]
embeddings = [
  "sentence-transformers[openvino]>=3.0",
  "torch>=2.13.0",
]
# Same packages, but torch comes from the CUDA 12.6 wheel index (see
# [tool.uv.sources]); for the workstation with an NVIDIA GPU. Kept conflicting
# with `embeddings` so the two never share one environment:
#   UV_PROJECT_ENVIRONMENT=.venv-cuda uv sync --extra embeddings-cuda
embeddings-cuda = [
  "sentence-transformers[openvino]>=3.0",
  "torch>=2.13.0",
]
translate = [
  "nomoscope-agentic-workflow",
]
# Tier 3 of the Legifrance ELI resolver only (ADR 0002): a headless browser
# opens the URL and its final URL is read, nothing else. Optional on purpose —
# the CPU-only default environment and the validation UI must keep working
# without Chromium, and without it the resolver simply stops at tier 2.
#   uv sync --extra legifrance && uv run playwright install chromium
legifrance = [
  "playwright>=1.47",
]

[[tool.uv.index]]
name = "pytorch_cpu"
url = "https://download.pytorch.org/whl/cpu"
# Only torch (routed via [tool.uv.sources]) may come from this index: it also
# mirrors common packages (e.g. packaging<=24.1) at stale versions, and uv's
# first-match strategy would otherwise pin them below what other deps need.
explicit = true

[[tool.uv.index]]
name = "pytorch_cu126"
url = "https://download.pytorch.org/whl/cu126"
# CUDA 12.6 is the newest PyTorch channel that still ships Pascal (sm_61)
# kernels, which is what the GTX 1080 Ti needs; the cu128+ channels start at
# sm_75 and CUDA 13 dropped Pascal outright. Same explicit-only rule as above.
explicit = true

[tool.uv]
# One environment cannot hold both torch builds; uv needs the conflict declared
# before it will resolve the extra-scoped torch sources below.
conflicts = [[{ extra = "embeddings" }, { extra = "embeddings-cuda" }]]

[project.scripts]
nomotheca-ingest = "nomotheca_ingest.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nomotheca_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
torch = [
  { index = "pytorch_cpu", extra = "embeddings" },
  { index = "pytorch_cu126", extra = "embeddings-cuda" },
]
nomoscope-agentic-workflow = { path = "../../Nomoscope-agentic-workflow/pipeline", editable = true }
