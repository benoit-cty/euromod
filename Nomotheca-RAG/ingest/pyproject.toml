[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nomotheca-legislation-ingest"
version = "0.1.0"
description = "Archive-first legislation ingestion pipeline for the EUROMOD RAG prototype."
readme = "README.md"
license = {text = "EUPL-1.2"}
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  # Plain-text extraction for contributed PDFs (circulars). Deliberately not a
  # layout-aware toolchain: a circular's value sits in its prose, not a table.
  "pypdf>=5.0",
  "pydantic>=2.8",
  "tenacity>=8.5",
  "typer>=0.12",
]

[project.optional-dependencies]
# `cli tui`, the interactive ingestion monitor. Not needed by the worker image.
tui = [
  "textual>=0.86",
]
embeddings = [
  "sentence-transformers[openvino]>=3.0",
  "torch>=2.13.0",
]
# Same packages, but torch comes from the CUDA 12.6 wheel index (see
# [tool.uv.sources]); for the workstation with an NVIDIA GPU. Kept conflicting
# with `embeddings` so the two never share one environment:
#   UV_PROJECT_ENVIRONMENT=.venv-cuda uv sync --extra embeddings-cuda
embeddings-cuda = [
  "sentence-transformers[openvino]>=3.0",
  "torch>=2.13.0",
]
# The LLM translator: provider access only (nomos-llm), not the whole workflow.
translate = [
  "nomos-llm",
]
# The headless browser (core/browser.py), for two narrow uses: tier 3 of the
# Legifrance ELI resolver (ADR 0002: Chromium opens the URL, only its final URL
# is read) and contributed PDFs a portal serves to a browser only
# (sante.gouv.fr's Bulletin officiel; contributed.fetch_in_browser, Firefox).
# Optional on purpose — the CPU-only default environment and the validation UI
# keep working without it; the resolver then stops at tier 2 and such a PDF is
# refused with its hint.
#   uv sync --extra browser && uv run playwright install chromium firefox
browser = [
  "playwright>=1.47",
]

[dependency-groups]
dev = ["pytest>=8", "textual>=0.86"]

[project.scripts]
nomotheca-ingest = "nomotheca_ingest.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nomotheca_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
torch = [
  { index = "pytorch_cpu", extra = "embeddings" },
  { index = "pytorch_cu126", extra = "embeddings-cuda" },
]
nomos-llm = { workspace = true }
